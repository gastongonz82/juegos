<!doctype html>
<html lang="es"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Vladi Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#052b46}button{font:inherit}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;background:#25bde8 url("./assets/premium-scene.jpg") center center/100% 100% no-repeat}
#game:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 70%,#002b3822);pointer-events:none}
.scenery{position:absolute;z-index:2;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(#159fee 0 43%,#8cecff 70%)}.sun{position:absolute;right:10%;top:13%;width:90px;height:90px;border-radius:50%;background:#fff8b2;box-shadow:0 0 45px #fff8}.clouds{position:absolute;inset:0;background:radial-gradient(ellipse at 12% 20%,#fff 0 5%,transparent 5.4%),radial-gradient(ellipse at 45% 15%,#fff 0 7%,transparent 7.4%),radial-gradient(ellipse at 76% 25%,#fff 0 6%,transparent 6.4%)}.cliff{position:absolute;bottom:35%;width:31%;height:38%;background:linear-gradient(90deg,#b56d35,#e1a45d 45%,#8b512e);border-radius:48% 52% 8% 8%;box-shadow:inset 0 16px #39b84c,0 10px 25px #006b8455}.cliff b{position:absolute;inset:8% 8% auto;height:16%;background:#38ad45;border-radius:50%}.c1{left:-9%;height:31%;bottom:38%}.c2{left:29%;width:27%;height:27%;bottom:42%}.c3{right:-8%;height:42%;bottom:34%}.falls{position:absolute;z-index:3;width:7%;background:linear-gradient(90deg,#dfffff,#37d7f6 40%,#fff 52%,#1ca9dd);box-shadow:0 0 16px #cfffffaa}.f1{left:15%;top:47%;height:28%}.f2{right:12%;top:40%;height:35%}.temple{position:absolute;right:4%;bottom:53%;width:16%;height:18%;background:repeating-linear-gradient(90deg,#b99358 0 18%,#87683f 18% 22%);border:7px solid #6d5435;box-shadow:inset 0 12px #65a83c}.water{position:absolute;left:0;right:0;bottom:22%;height:31%;background:linear-gradient(#7bf2ff,#10b7df 42%,#087ca9);box-shadow:inset 0 8px #eaffffcc}.islands{position:absolute;z-index:4;left:0;right:0;bottom:29%;height:14%;background:radial-gradient(ellipse at 12% 90%,#32a342 0 8%,transparent 8.5%),radial-gradient(ellipse at 40% 94%,#4cb14c 0 10%,transparent 10.5%),radial-gradient(ellipse at 70% 86%,#2b943e 0 11%,transparent 11.5%),radial-gradient(ellipse at 94% 98%,#5aba4f 0 9%,transparent 9.5%)}.palms{position:absolute;z-index:5;left:-2%;right:0;bottom:38%;font-size:clamp(60px,8vw,120px);white-space:nowrap;filter:drop-shadow(0 6px 5px #004a)}.dust{position:absolute;z-index:14;left:8%;bottom:20%;width:80px;height:32px;opacity:0;background:radial-gradient(circle,#fff9 0 25%,transparent 27%) 0 10px/25px 25px repeat-x;filter:blur(1px)}.running .dust{opacity:.85;animation:dust .35s linear infinite}@keyframes dust{to{transform:translateX(-25px);opacity:.25}}.track{position:absolute;z-index:5;left:0;right:0;bottom:0;height:22%;min-height:110px;background:linear-gradient(#a6f348 0 5%,#3cbf32 5% 12%,#8d582c 12% 100%);border-top:5px solid #e6ff8b;box-shadow:inset 0 12px #176f2e}.track:before{content:"";position:absolute;inset:25% 0 0;background:repeating-linear-gradient(90deg,#c77b31 0 72px,#a75c25 72px 76px),repeating-linear-gradient(0deg,transparent 0 42px,#7d431f55 42px 46px);opacity:.95}
.track:after{content:"";position:absolute;left:0;right:0;top:38%;height:10px;background:repeating-linear-gradient(90deg,#75421f 0 90px,#9c5b2b 90px 180px);opacity:.25}
#hero{position:absolute;z-index:15;left:16%;bottom:19%;width:105px;height:132px;filter:drop-shadow(0 7px 5px #002c4488);transform-origin:55% 100%}.runnerHead{position:absolute;z-index:5;left:29px;top:0;width:66px;height:66px;border-radius:50%;overflow:hidden;border:3px solid #1c4d8d;background:#f3b37f}.runnerHead img{position:absolute;width:170px;height:170px;object-fit:contain;left:-70px;top:-34px;transform:scale(1.65)}.runnerBody{position:absolute;z-index:3;left:31px;top:53px;width:55px;height:53px;border-radius:42% 46% 34% 34%;background:linear-gradient(135deg,#29a8ff,#075fd0);border:3px solid #06478f;color:#ffe23f;font:bold 30px Arial;text-align:center;line-height:48px}.arm,.leg{position:absolute;display:block;transform-origin:50% 8%;border-radius:20px;background:linear-gradient(#29a8ff,#075fd0);border:3px solid #06478f}.arm{z-index:2;top:60px;width:17px;height:47px}.a1{left:27px;transform:rotate(42deg)}.a2{left:75px;transform:rotate(-48deg)}.leg{z-index:1;top:94px;width:20px;height:48px;background:linear-gradient(#164fbb 0 55%,#fff 56% 76%,#2673dc 77%)}.l1{left:37px;transform:rotate(33deg)}.l2{left:66px;transform:rotate(-38deg)}.running #hero{animation:runbob .14s ease-in-out infinite alternate}.running .a1{animation:arm1 .28s infinite alternate}.running .a2{animation:arm2 .28s infinite alternate}.running .l1{animation:leg1 .28s infinite alternate}.running .l2{animation:leg2 .28s infinite alternate}@keyframes arm1{to{transform:rotate(-48deg)}}@keyframes arm2{to{transform:rotate(42deg)}}@keyframes leg1{to{transform:rotate(-42deg)}}@keyframes leg2{to{transform:rotate(38deg)}}
.obj{position:absolute;z-index:12;bottom:20%;display:grid;place-items:center;filter:drop-shadow(0 5px 3px #0028)}
.rock{width:clamp(58px,6vw,88px);height:clamp(42px,4.5vw,66px);border:4px solid #413022;border-radius:55% 50% 35% 40%;background:radial-gradient(circle at 35% 25%,#d6c3a3 0 12%,transparent 13%),linear-gradient(145deg,#aa9579,#594b3c 68%,#332b25)}
.crate{width:clamp(56px,5.5vw,82px);height:clamp(56px,5.5vw,82px);border:5px solid #63350f;background:linear-gradient(45deg,transparent 43%,#754116 44% 56%,transparent 57%),linear-gradient(-45deg,transparent 43%,#754116 44% 56%,transparent 57%),#b96c27;box-shadow:inset 0 0 0 5px #e59a4b}
.star{z-index:13;width:62px;height:62px;font-size:54px;line-height:1;bottom:42%;filter:drop-shadow(0 4px 2px #8c5300);animation:spin 1.6s linear infinite}
@keyframes runbob{from{margin-bottom:0;transform:rotate(2deg) scaleY(.98)}to{margin-bottom:5px;transform:rotate(-3deg) scaleY(1.02)}}@keyframes spin{50%{transform:scale(.8) rotate(180deg)}100%{transform:rotate(360deg)}}
.hud{position:absolute;z-index:25;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;border:5px solid #48200c;border-radius:16px;background:linear-gradient(#ad612b,#6d3215);box-shadow:0 6px #321506,inset 0 2px #efa765;color:#fff;font:900 clamp(15px,2vw,24px) Arial Black;padding:8px 14px;text-shadow:0 2px #351506}.score{left:50%;transform:translateX(-50%)}.best{right:max(14px,env(safe-area-inset-right))}.pause{left:max(14px,env(safe-area-inset-left));width:58px;height:54px;padding:0;justify-content:center;z-index:45}
.overlay{position:absolute;z-index:40;inset:0;display:grid;place-items:center;padding:18px;background:#00243a55}.hidden{display:none!important}
.panel{text-align:center;max-width:760px;width:min(92vw,760px);padding:25px;border:7px solid #4b210d;border-radius:32px;background:linear-gradient(#b76a2eeb,#713719ee);box-shadow:0 12px #321506,0 28px 60px #001a2b99;color:#fff}
.title{font:1000 clamp(58px,10vw,120px)/.78 Arial Black;color:#ffd026;text-shadow:0 8px #70350e,5px 0 #123b67,-5px 0 #123b67}.title span{display:block;color:white;font-size:.62em}
.handle{display:inline-block;margin:15px 0;padding:7px 16px;border:3px solid #4b210d;border-radius:14px;background:#6b3118;font-weight:900}.preview{width:clamp(125px,22vw,210px);height:clamp(125px,22vw,210px);object-fit:contain;filter:drop-shadow(0 8px 5px #002a45aa)}
.play,.again,.home{cursor:pointer;font:1000 clamp(21px,3vw,34px) Arial Black;border-radius:20px;color:white}.play,.again{min-width:min(440px,90%);padding:13px 25px;border:6px solid #07531f;background:linear-gradient(#7cf34f,#13b72b);box-shadow:0 8px #063916;text-shadow:0 3px #063916}.home{margin-top:15px;padding:10px 22px;border:5px solid #4b210d;background:linear-gradient(#c47535,#7c3c19);box-shadow:0 6px #351607}
.help{margin-top:17px;font-weight:900}.stats{display:flex;justify-content:center;gap:35px;margin:16px 0}.stats div{min-width:130px;padding:10px;border:3px solid #d88b43;border-radius:16px;background:#4a210caa}.stats b{display:block;font:1000 44px Arial Black;color:#ffd026}.paused{position:absolute;z-index:30;inset:0;display:grid;place-items:center;pointer-events:none;background:#00182b99;color:#fff;font:1000 clamp(50px,10vw,110px) Arial Black;text-shadow:0 6px #001525}
@media(max-width:600px){#hero{left:9%;width:105px;height:132px;bottom:20%}.track{height:22%}.obj{bottom:18%}.star{bottom:40%}.hud{font-size:13px;padding:7px 9px;border-width:3px}.pause{width:48px;height:45px}.panel{padding:18px 10px}.title{font-size:18vw}.preview{width:34vw;height:34vw}.help{font-size:13px}.stats{gap:10px}.stats div{min-width:115px}.stats b{font-size:38px}}
</style></head><body><main id="game" tabindex="0"><div class="track"></div><div id="dust" class="dust"></div><div id="objects"></div><div id="hero" aria-label="Vladi"><div class="runnerHead"><img src="../flappy-vladi/assets/vladi_final.png" alt=""></div><div class="runnerBody">★</div><i class="arm a1"></i><i class="arm a2"></i><i class="leg l1"></i><i class="leg l2"></i></div><button id="pause" class="hud pause">Ⅱ</button><div id="score" class="hud score">🏃 0 · ⭐ 0</div><div id="best" class="hud best">🏆 0</div><div id="paused" class="paused hidden">PAUSA</div><div id="overlay" class="overlay"><section class="panel"><div class="title"><span>VLADI</span>RUN</div><div class="handle">@vladyerik · V11</div><br><div class="preview runnerPreview">🏃</div><br><button id="start" class="play">▶ CORRER</button><div class="help">TOCÁ / ESPACIO PARA SALTAR · JUNTÁ ⭐</div></section></div></main>
<script>
(()=>{const g=document.querySelector('#game'),hero=document.querySelector('#hero'),objs=document.querySelector('#objects'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),ov=document.querySelector('#overlay'),pb=document.querySelector('#pause'),pl=document.querySelector('#paused');let running=false,paused=false,y=0,vy=0,dist=0,stars=0,best=+(localStorage.getItem('vladiRunBest')||0),items=[],spawn=1.8,last=0,raf=0;bestEl.textContent='🏆 '+best;
const mobile=()=>innerWidth<=700;const ground=()=>innerHeight*(mobile()?.20:.19);const heroW=()=>mobile()?120:Math.max(110,Math.min(180,innerWidth*.11));const speed=()=>Math.min(.56,.32+dist/1900);const gravity=()=>mobile()?1420:1360;const jumpV=()=>mobile()?1050:1000;
function clear(){items.forEach(o=>o.el.remove());items=[]}
function add(){const star=Math.random()<.46,el=document.createElement('div');el.className='obj '+(star?'star':Math.random()<.5?'rock':'crate');if(star)el.textContent='⭐';const x=innerWidth+80;objs.appendChild(el);items.push({el,x,star,taken:false});spawn=(mobile()?2.05:2.2)+Math.random()*.8}
function jump(){if(!running||paused)return;if(y<=5)vy=jumpV()}
function start(){clear();dist=0;stars=0;y=0;vy=0;spawn=3.5;running=true;paused=false;g.classList.add('running');ov.classList.add('hidden');pl.classList.add('hidden');pb.textContent='Ⅱ';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);g.focus()}
function end(){if(!running)return;running=false;g.classList.remove('running');cancelAnimationFrame(raf);const pts=Math.floor(dist);best=Math.max(best,pts);localStorage.setItem('vladiRunBest',best);bestEl.textContent='🏆 '+best;ov.classList.remove('hidden');ov.innerHTML='<section class="panel"><div class="title"><span>VLADI</span>RUN</div><h1>¡BUENA CARRERA!</h1><div class="stats"><div>METROS<b>'+pts+'</b></div><div>ESTRELLAS<b>⭐ '+stars+'</b></div><div>RÉCORD<b>'+best+'</b></div></div><button id="again" class="again">↻ VOLVER A CORRER</button><br><button id="home" class="home">⌂ MENÚ</button></section>';document.querySelector('#again').onclick=e=>{e.stopPropagation();start()};document.querySelector('#home').onclick=e=>{e.stopPropagation();location.href='../'}}
function rectsHit(a,b,pad=12){return a.left+pad<b.right&&a.right-pad>b.left&&a.top+pad<b.bottom&&a.bottom-pad>b.top}
function draw(){hero.style.bottom=(ground()+y)+'px';hero.style.transform='rotate('+Math.max(-5,Math.min(5,-vy*.004))+'deg)';items.forEach(o=>o.el.style.left=o.x+'px')}
function loop(t){if(!running)return;if(paused){last=t;raf=requestAnimationFrame(loop);return}const dt=Math.min(.032,(t-last)/1000);last=t;dist+=dt*10*(1+speed());vy-=gravity()*dt;y+=vy*dt;if(y<0){y=0;vy=0}spawn-=dt;if(spawn<=0)add();const px=innerWidth*speed()*dt;for(const o of items){o.x-=px;if(o.x<-140){o.el.remove();o.dead=true;continue}const hr=hero.getBoundingClientRect(),or=o.el.getBoundingClientRect();if(o.star&&!o.taken&&rectsHit(hr,or,16)){o.taken=true;stars++;o.el.remove();o.dead=true}else if(!o.star&&dist>22&&rectsHit({left:hr.left+hr.width*.30,right:hr.right-hr.width*.24,top:hr.top+hr.height*.18,bottom:hr.bottom-hr.height*.08},{left:or.left+or.width*.12,right:or.right-or.width*.12,top:or.top+or.height*.12,bottom:or.bottom-or.height*.06},6)){draw();end();return}}items=items.filter(o=>!o.dead);scoreEl.textContent='🏃 '+Math.floor(dist)+' · ⭐ '+stars;draw();raf=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=e=>{e.stopPropagation();start()};pb.onclick=e=>{e.stopPropagation();if(!running)return;paused=!paused;pb.textContent=paused?'▶':'Ⅱ';pl.classList.toggle('hidden',!paused)};g.addEventListener('pointerdown',e=>{if(!e.target.closest('button')){e.preventDefault();jump()}});g.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;pb.textContent='▶';pl.classList.remove('hidden')}});draw()})();
</script></body></html><style id="v6">
#game{background-image:url("./assets/premium-scene.jpg")!important;background-size:cover!important;background-position:center!important}

</style><style id="v9-depth">
