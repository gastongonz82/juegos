*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#071d35;touch-action:none}body{font-family:system-ui,Arial,sans-serif}canvas{display:block}.top{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.chip{background:linear-gradient(#173e61e8,#0b2844e8);border:2px solid #ffffff80;box-shadow:0 5px 15px #00152a66,inset 0 1px #fff6;color:white;border-radius:22px;padding:8px 13px;font-weight:900;font-size:clamp(14px,3.7vw,20px);text-shadow:0 2px #0008}.menu{pointer-events:auto;color:#fff;text-decoration:none}.brand{position:fixed;z-index:20;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);font-weight:1000;color:#fff;font-size:clamp(22px,6vw,38px);letter-spacing:1px;text-shadow:0 4px 0 #0870a6,0 7px 16px #00375c}.hint{position:fixed;z-index:20;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;background:#082946d9;border:2px solid #ffffff55;border-radius:18px;padding:8px 15px;font-weight:900;font-size:clamp(12px,3.3vw,17px);pointer-events:none}.start{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:linear-gradient(#001a3455,#001a34aa);padding:24px}.card{width:min(88vw,480px);text-align:center;color:white;background:linear-gradient(145deg,#0d4777f2,#062843f5);border:3px solid #ffffffb0;border-radius:30px;padding:26px 22px;box-shadow:0 18px 60px #00101dcc,inset 0 2px #fff5}.card h1{margin:0;font-size:clamp(38px,11vw,68px);line-height:.9;text-shadow:0 5px #075f91}.card p{font-weight:800}.play{border:0;border-radius:22px;padding:14px 28px;font-size:23px;font-weight:1000;color:#16320b;background:linear-gradient(#ffe94c,#ffb719);box-shadow:0 7px 0 #c77a00,0 12px 22px #0007}.hide{display:none}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script></head><body>

<div class="start" id="start"><div class="card"><h1>VLADI<br>RUN</h1><p>@vladyerik</p><p>Corré por las islas, juntá estrellas y esquivá los peligros.</p><button class="play" id="play">▶ JUGAR</button></div></div>
<script>
const $=s=>document.querySelector(s), best=()=>+(localStorage.getItem('vladiRunBest')||0);$('#best').textContent=best();
const svg=(s)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const BG=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#28b9f4"/><stop offset=".62" stop-color="#8be4ff"/><stop offset="1" stop-color="#d6f8ff"/></linearGradient><linearGradient id="m" x2="0" y2="1"><stop stop-color="#58c96a"/><stop offset="1" stop-color="#178f62"/></linearGradient></defs><rect width="1200" height="700" fill="url(#s)"/><circle cx="950" cy="120" r="65" fill="#ffe873" opacity=".95"/><g fill="#fff" opacity=".9"><ellipse cx="160" cy="125" rx="80" ry="28"/><ellipse cx="220" cy="118" rx="55" ry="36"/><ellipse cx="700" cy="175" rx="90" ry="30"/><ellipse cx="770" cy="168" rx="55" ry="37"/></g><path d="M0 450 180 255 315 420 470 210 680 455 850 290 1030 445 1200 270V700H0Z" fill="#208fb1" opacity=".55"/><path d="M0 500 180 380 330 500 510 345 690 500 880 370 1030 495 1200 390V700H0Z" fill="url(#m)"/><path d="M0 545c170-45 280 35 440-5s290 35 470-10 290 10 290 10v160H0Z" fill="#11a7d0"/><g fill="#fff" opacity=".55"><path d="M20 595q80-35 160 0t160 0" fill="none" stroke="#fff" stroke-width="8"/><path d="M700 610q90-38 180 0t180 0" fill="none" stroke="#fff" stroke-width="7"/></g><g transform="translate(90 330)"><path d="m0 170 22-125 18 0 18 125" fill="#704a25"/><path d="M28 55Q-25 15-60 45 0 70 28 55M32 55Q80 10 115 45 60 70 32 55M30 42Q20-12-10-20 8 30 30 42M35 43Q52-8 83-12 60 28 35 43" fill="#18a85e"/></g><g transform="translate(1060 350) scale(.8)"><path d="m0 170 22-125 18 0 18 125" fill="#704a25"/><path d="M28 55Q-25 15-60 45 0 70 28 55M32 55Q80 10 115 45 60 70 32 55M30 42Q20-12-10-20 8 30 30 42M35 43Q52-8 83-12 60 28 35 43" fill="#18a85e"/></g></svg>`);
const TILE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="110"><defs><linearGradient id="d" y2="1"><stop stop-color="#b56c31"/><stop offset="1" stop-color="#6d3a21"/></linearGradient></defs><rect y="20" width="160" height="90" rx="10" fill="url(#d)"/><path d="M0 24Q20 0 40 22T80 20T120 22T160 18v28H0Z" fill="#38c85d"/><path d="M0 34Q20 15 40 35T80 32T120 34T160 30" fill="none" stroke="#159a45" stroke-width="8"/><g fill="#d58b49" opacity=".7"><circle cx="30" cy="70" r="7"/><circle cx="80" cy="88" r="9"/><circle cx="135" cy="65" r="6"/></g></svg>`);
const STAR=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><defs><radialGradient id="g"><stop stop-color="#fff77b"/><stop offset=".55" stop-color="#ffd324"/><stop offset="1" stop-color="#f29a00"/></radialGradient></defs><path d="M40 3 50 27 77 29 56 46 63 73 40 58 17 73 24 46 3 29 30 27Z" fill="url(#g)" stroke="#fff3a1" stroke-width="4"/></svg>`);
const SPIKE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="70"><defs><linearGradient id="g" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9fc3d4"/></linearGradient></defs><path d="M4 66 24 8 44 66 62 5 82 66 100 10 117 66Z" fill="url(#g)" stroke="#557b8e" stroke-width="4"/></svg>`);
const CRATE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect x="5" y="5" width="90" height="90" rx="10" fill="#c97935" stroke="#6e351d" stroke-width="8"/><path d="M14 14 86 86M86 14 14 86" stroke="#8d4826" stroke-width="13"/><path d="M14 14 86 86M86 14 14 86" stroke="#e0a05e" stroke-width="5"/></svg>`);
class Run extends Phaser.Scene{
 preload(){this.load.image('bg',BG);this.load.image('tile',TILE);this.load.image('star',STAR);this.load.image('spike',SPIKE);this.load.image('crate',CRATE);this.load.image('face','assets/vladi-face.png')}
 create(){this.started=false;this.dead=false;this.speed=390;this.jumpCount=0;this.stars=0;this.meters=0;this.t0=0;
 this.bg=this.add.tileSprite(0,0,1200,700,'bg').setOrigin(0).setDisplaySize(1200,700);
 this.floorY=575;this.ground=this.physics.add.staticGroup();for(let x=-20;x<1300;x+=150){let g=this.ground.create(x,this.floorY,'tile').setOrigin(0,0).setDisplaySize(155,106);g.refreshBody()}
 this.player=this.add.container(185,430);this.physics.add.existing(this.player);this.player.body.setSize(74,122).setOffset(-37,-61);this.player.body.setGravityY(1350);this.player.body.setCollideWorldBounds(true);
 this.shadow=this.add.ellipse(0,66,82,18,0x00192b,.22);this.body=this.add.graphics();this.body.fillStyle(0x1687e8).fillRoundedRect(-32,-8,64,78,20);this.body.fillStyle(0xffd92f);let P=[{x:0,y:4},{x:7,y:20},{x:25,y:21},{x:11,y:32},{x:15,y:51},{x:0,y:41},{x:-15,y:51},{x:-11,y:32},{x:-25,y:21},{x:-7,y:20}];this.body.fillPoints(P,true);
 this.leg1=this.add.rectangle(-17,64,17,54,0x124f9b).setOrigin(.5,0);this.leg2=this.add.rectangle(17,64,17,54,0x124f9b).setOrigin(.5,0);this.s1=this.add.ellipse(-20,119,37,18,0xffffff);this.s2=this.add.ellipse(20,119,37,18,0xffffff);
 this.face=this.add.image(0,-48,'face').setDisplaySize(82,82);let mg=this.make.graphics({add:false});mg.fillCircle(0,-48,37);this.face.setMask(mg.createGeometryMask());this.cap=this.add.graphics();this.cap.fillStyle(0x101820).fillEllipse(0,-79,78,27).fillRoundedRect(-34,-91,68,21,9).fillRoundedRect(26,-81,32,8,4);
 this.player.add([this.shadow,this.leg1,this.leg2,this.s1,this.s2,this.body,this.face,this.cap]);this.player.setDepth(12);this.physics.add.collider(this.player,this.ground,()=>this.jumpCount=0);
 this.obs=this.physics.add.group({allowGravity:false});this.items=this.physics.add.group({allowGravity:false});this.physics.add.overlap(this.player,this.obs,()=>this.over());this.physics.add.overlap(this.player,this.items,(p,s)=>{s.destroy();this.stars++;$('#stars').textContent=this.stars});
 this.input.on('pointerdown',()=>{if(this.started)this.jump()});this.input.keyboard.on('keydown-SPACE',()=>{if(this.started)this.jump()});
 this.time.addEvent({delay:1350,loop:true,callback:()=>{if(this.started&&!this.dead)this.spawn()}});
 $('#play').onclick=()=>{this.started=true;this.t0=this.time.now;$('#start').classList.add('hide')};
 }
 jump(){if(this.dead||this.jumpCount>=2)return;this.player.body.setVelocityY(this.jumpCount? -510:-650);this.jumpCount++}
 spawn(){let x=1250,type=Math.random()<.62?'spike':'crate';let o=this.obs.create(x,this.floorY+5,type).setOrigin(.5,1).setDisplaySize(type==='spike'?100:82,type==='spike'?58:82);o.body.setSize(type==='spike'?80:68,type==='spike'?40:72);o.setVelocityX(-this.speed);let n=Phaser.Math.Between(2,5);for(let i=0;i<n;i++){let s=this.items.create(x+100+i*62,this.floorY-120-(i%3)*35,'star').setDisplaySize(43,43);s.setVelocityX(-this.speed)}}
 over(){if(this.dead)return;this.dead=true;this.physics.pause();let b=Math.max(best(),this.meters);localStorage.setItem('vladiRunBest',b);$('#best').textContent=b;let q=this.add.rectangle(600,330,520,220,0x062843,.95).setStrokeStyle(4,0xffffff).setDepth(40);this.add.text(600,275,'¡GRAN CARRERA!',{fontSize:'38px',fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(41);this.add.text(600,330,this.meters+' m   ·   ⭐ '+this.stars,{fontSize:'28px',color:'#ffd83d'}).setOrigin(.5).setDepth(41);this.add.text(600,385,'TOCÁ PARA VOLVER A JUGAR',{fontSize:'21px',fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(41);this.input.once('pointerdown',()=>location.reload())}
 update(t){if(!this.started||this.dead)return;let sec=(t-this.t0)/1000;this.speed=Math.min(650,390+sec*4);this.bg.tilePositionX+=.55;for(const o of this.obs.children.entries)o.setVelocityX(-this.speed);for(const s of this.items.children.entries)s.setVelocityX(-this.speed);this.meters=Math.floor(sec*9);$('#meters').textContent=this.meters;let grounded=this.player.body.blocked.down||this.player.body.touching.down;if(grounded){let p=t*.022;this.leg1.rotation=Math.sin(p)*.55;this.leg2.rotation=-Math.sin(p)*.55;this.s1.x=-20+Math.sin(p)*15;this.s2.x=20-Math.sin(p)*15;this.player.angle=Math.sin(p*2)*1.5}else{this.leg1.rotation=-.35;this.leg2.rotation=.45;this.player.angle=-5}}
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1200,height:700,backgroundColor:'#45c5ef',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Run]});
</script></body></html>
