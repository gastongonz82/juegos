<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>VLADI RUN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#052b46;font-family:Arial,sans-serif}
button{font:inherit}.game{--ground:20%;position:fixed;inset:0;width:100vw;height:100dvh;min-height:100svh;overflow:hidden;touch-action:none;user-select:none;background:url("./assets/premium-scene.jpg?v=13") center 43%/cover no-repeat}
.game:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(#fff1,transparent 35%,transparent 72%,#002d3b2b)}
.ground{position:absolute;z-index:8;left:0;right:0;bottom:0;height:var(--ground);border-top:7px solid #d9ff7b;background:linear-gradient(#52bd35 0 10%,#a96a30 10% 100%);box-shadow:inset 0 11px #267c2c}
.ground:after{content:"";position:absolute;inset:20% 0 0;background:repeating-linear-gradient(110deg,#0000 0 70px,#5c331b55 72px 78px,#0000 80px 145px)}
.hero{position:absolute;z-index:16;left:13%;bottom:var(--ground);width:106px;height:150px;transform-origin:50% 100%;filter:drop-shadow(0 8px 5px #002b3f88)}
.face{position:absolute;z-index:5;left:18px;top:0;width:72px;height:72px;border-radius:46% 46% 50% 50%;overflow:hidden;border:3px solid #153f76;background:#efb37f}
.face img{position:absolute;width:184px;height:184px;object-fit:contain;left:-75px;top:-38px;transform:scale(1.62)}
.cap{position:absolute;z-index:6;left:15px;top:-8px;width:70px;height:24px;border-radius:50% 50% 20% 20%;background:#151515;transform:rotate(-8deg);box-shadow:19px 8px 0 -6px #151515}
.body{position:absolute;z-index:4;left:25px;top:63px;width:61px;height:55px;border:3px solid #06478f;border-radius:19px 19px 14px 14px;background:linear-gradient(135deg,#27a8ff,#075fcf);color:#ffd82e;text-align:center;font:900 34px/50px Arial}
.limb{position:absolute;z-index:3;width:18px;border:3px solid #06478f;border-radius:15px;background:linear-gradient(#25a4fb,#075fcf);transform-origin:50% 6%}.arm{top:70px;height:48px}.leg{top:108px;height:46px;background:linear-gradient(#1454bd 0 58%,#fff 59% 78%,#2879dc 79%)}.a1{left:19px;transform:rotate(40deg)}.a2{left:79px;transform:rotate(-45deg)}.l1{left:34px;transform:rotate(32deg)}.l2{left:65px;transform:rotate(-35deg)}
.running .hero{animation:bob .16s ease-in-out infinite alternate}.running .a1{animation:a1 .28s infinite alternate}.running .a2{animation:a2 .28s infinite alternate}.running .l1{animation:l1 .28s infinite alternate}.running .l2{animation:l2 .28s infinite alternate}
@keyframes bob{to{margin-bottom:5px}}@keyframes a1{to{transform:rotate(-45deg)}}@keyframes a2{to{transform:rotate(40deg)}}@keyframes l1{to{transform:rotate(-38deg)}}@keyframes l2{to{transform:rotate(36deg)}}
.object{position:absolute;z-index:14;bottom:var(--ground);filter:drop-shadow(0 6px 4px #0029)}.crate{width:74px;height:74px;border:6px solid #64330e;border-radius:7px;background:linear-gradient(45deg,#0000 42%,#6f3912 43% 57%,#0000 58%),linear-gradient(-45deg,#0000 42%,#6f3912 43% 57%,#0000 58%),#c4772e;box-shadow:inset 0 0 0 5px #eea65a}.rock{width:82px;height:58px;border:4px solid #493526;border-radius:55% 50% 38% 42%;background:radial-gradient(circle at 32% 26%,#d8c6a8 0 12%,#0000 13%),linear-gradient(145deg,#a9967b,#57483a 68%,#322a24)}.star{bottom:calc(var(--ground) + 105px);font-size:58px;line-height:1;filter:drop-shadow(0 4px 2px #865000);animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hud{position:absolute;z-index:40;top:max(13px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;color:#fff;border:4px solid #48200c;border-radius:17px;background:linear-gradient(#ae622c,#6b3115);box-shadow:0 6px #321506,inset 0 2px #efa765;text-shadow:0 2px #351506;font:900 clamp(14px,1.8vw,22px) Arial Black;padding:8px 13px}.pause{left:max(13px,env(safe-area-inset-left));width:54px;height:50px}.score{left:50%;transform:translateX(-50%)}.best{right:max(13px,env(safe-area-inset-right))}
.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:#001d3155}.hidden{display:none!important}.panel{width:min(92vw,690px);text-align:center;padding:24px;border:6px solid #48200c;border-radius:28px;background:linear-gradient(#b96b30ef,#6d3217f2);box-shadow:0 11px #321506,0 28px 60px #001a2b99;color:white}.title{font:1000 clamp(54px,9vw,108px)/.8 Arial Black;color:#ffd32a;text-shadow:0 7px #70350e,4px 0 #123b67,-4px 0 #123b67}.title span{display:block;color:#fff;font-size:.6em}.handle{display:inline-block;margin:14px 0;padding:7px 15px;border:3px solid #4b210d;border-radius:13px;background:#6b3118;font-weight:900}.play,.again,.home{cursor:pointer;font:1000 clamp(20px,2.7vw,31px) Arial Black;border-radius:18px;color:#fff}.play,.again{min-width:min(420px,90%);padding:13px 23px;border:5px solid #07531f;background:linear-gradient(#7cf34f,#13b72b);box-shadow:0 7px #063916}.home{margin-top:14px;padding:9px 20px;border:4px solid #4b210d;background:linear-gradient(#c47535,#7c3c19)}.help{margin-top:15px;font-weight:900}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}.stats div{min-width:125px;padding:9px;border:3px solid #d88b43;border-radius:15px;background:#4a210caa}.stats b{display:block;font:1000 38px Arial Black;color:#ffd026}.paused{position:absolute;z-index:45;inset:0;display:grid;place-items:center;background:#00182b99;color:#fff;font:1000 clamp(48px,9vw,100px) Arial Black}
@media(min-width:1000px){.hero{left:15%;transform:scale(1.08)}}
@media(min-width:1500px){.hero{left:16%;transform:scale(1.18)}}
@media(max-width:600px){.game{--ground:20%;background-position:center 42%}.hero{left:8%;transform:scale(.82)}.object{transform:scale(.88);transform-origin:bottom left}.star{bottom:calc(var(--ground) + 82px);font-size:48px}.hud{font-size:12px;padding:7px 8px;border-width:3px}.pause{width:46px;height:43px}.panel{padding:17px 9px}.title{font-size:18vw}.help{font-size:12px}}
@media(max-height:650px) and (min-width:700px){.game{--ground:18%;background-position:center 48%}.hero{transform:scale(.72)}}
</style></head>
<body><main id="game" class="game" tabindex="0"><div class="ground"></div><div id="objects"></div><div id="hero" class="hero"><div class="face"><img src="../flappy-vladi/assets/vladi_final.png?v=13" alt="Vladi"></div><div class="cap"></div><div class="body">★</div><i class="limb arm a1"></i><i class="limb arm a2"></i><i class="limb leg l1"></i><i class="limb leg l2"></i></div><button id="pause" class="hud pause">Ⅱ</button><div id="score" class="hud score">🏃 0 m · ⭐ 0</div><div id="best" class="hud best">🏆 0</div><div id="paused" class="paused hidden">PAUSA</div><div id="overlay" class="overlay"><section class="panel"><div class="title"><span>VLADI</span>RUN</div><div class="handle">@vladyerik</div><h2>AVENTURA TROPICAL</h2><button id="start" class="play">▶ CORRER</button><div class="help">TOCÁ / ESPACIO / ↑ PARA SALTAR · JUNTÁ ⭐</div></section></div></main>
<script>
(()=>{const g=document.querySelector('#game'),hero=document.querySelector('#hero'),objs=document.querySelector('#objects'),score=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),pause=document.querySelector('#pause'),pausedEl=document.querySelector('#paused');let running=false,paused=false,y=0,vy=0,meters=0,stars=0,best=+(localStorage.getItem('vladiRunBest')||0),items=[],spawn=3,last=0,raf=0;bestEl.textContent='🏆 '+best;
const ground=()=>innerHeight*(innerHeight<650&&innerWidth>700?.18:.20),speed=()=>Math.min(570,300+meters*.75),gravity=()=>2200,jumpV=()=>1050;
function wipe(){items.forEach(x=>x.el.remove());items=[]}function add(){const isStar=Math.random()<.42,el=document.createElement('div');el.className='object '+(isStar?'star':Math.random()<.52?'crate':'rock');if(isStar)el.textContent='⭐';const x=innerWidth+100;objs.appendChild(el);items.push({el,x,isStar,dead:false});spawn=1.9+Math.random()*1.05}
function jump(){if(running&&!paused&&y<5)vy=jumpV()}
function start(){wipe();y=vy=meters=stars=0;spawn=3.2;running=true;paused=false;g.classList.add('running');overlay.classList.add('hidden');pausedEl.classList.add('hidden');pause.textContent='Ⅱ';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);g.focus()}
function hit(a,b,p=.15){return a.left+a.width*p<b.right-b.width*p&&a.right-a.width*p>b.left+b.width*p&&a.top+a.height*p<b.bottom-b.height*.08&&a.bottom-a.height*.08>b.top+b.height*p}
function end(){if(!running)return;running=false;g.classList.remove('running');cancelAnimationFrame(raf);const m=Math.floor(meters);best=Math.max(best,m);localStorage.setItem('vladiRunBest',best);bestEl.textContent='🏆 '+best;overlay.classList.remove('hidden');overlay.innerHTML='<section class="panel"><div class="title"><span>VLADI</span>RUN</div><h1>¡BUENA CARRERA!</h1><div class="stats"><div>METROS<b>'+m+'</b></div><div>ESTRELLAS<b>⭐ '+stars+'</b></div><div>RÉCORD<b>'+best+'</b></div></div><button id="again" class="again">↻ VOLVER A CORRER</button><br><button id="home" class="home">⌂ MENÚ</button></section>';document.querySelector('#again').onclick=e=>{e.stopPropagation();start()};document.querySelector('#home').onclick=e=>{e.stopPropagation();location.href='../'}}
function loop(t){if(!running)return;if(paused){last=t;raf=requestAnimationFrame(loop);return}const dt=Math.min(.032,(t-last)/1000);last=t;meters+=dt*10;vy-=gravity()*dt;y+=vy*dt;if(y<0){y=0;vy=0}spawn-=dt;if(spawn<=0)add();for(const o of items){o.x-=speed()*dt;o.el.style.left=o.x+'px';if(o.x<-140){o.dead=true;o.el.remove();continue}const hr=hero.getBoundingClientRect(),or=o.el.getBoundingClientRect();if(o.isStar&&hit(hr,or,.22)){stars++;o.dead=true;o.el.remove()}else if(!o.isStar&&meters>18&&hit(hr,or,.22)){end();return}}items=items.filter(o=>!o.dead);hero.style.bottom=(ground()+y)+'px';hero.style.rotate=Math.max(-5,Math.min(5,-vy*.004))+'deg';score.textContent='🏃 '+Math.floor(meters)+' m · ⭐ '+stars;raf=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=e=>{e.stopPropagation();start()};pause.onclick=e=>{e.stopPropagation();if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';pausedEl.classList.toggle('hidden',!paused)};g.addEventListener('pointerdown',e=>{if(!e.target.closest('button')){e.preventDefault();jump()}});g.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;pause.textContent='▶';pausedEl.classList.remove('hidden')}});hero.style.bottom=ground()+'px'})();
</script></body></html>
