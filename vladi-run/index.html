function seedWorld(){platforms=[];hazards=[];stars=[];particles=[];distance=0;collected=0;worldTick=0;speed=300*scale;spawnX=W*.52;player={x:W*.19,y:groundY-clamp(H*.235,90,178),h:clamp(H*.235,90,178),w:clamp(H*.235,90,178)*.9,vy:0,airborne:false,grounded:true};
 const starter={x:-30,w:W*1.15+30,y:groundY,depth:H-groundY+90};platforms.push(starter);spawnX=starter.x+starter.w+rand(W*.055,W*.10);segmentsSpawned=0;for(let i=0;i<4;i++)stars.push({x:player.x+player.h*1.9+i*player.h*.55,y:groundY-player.h*.23,r:player.h*.115,phase:i*.8,got:false});
}
function newRun(){seedWorld();state='running';paused=false;lastTime=performance.now();runStart=lastTime;}

 const count=3+Math.floor(Math.random()*2),startX=x+rand(width*.12,width*.27),arc=rand(.17,.31);for(let i=0;i<count;i++)stars.push({x:startX+i*player.h*.5,y:groundY-player.h*(arc+(i%2)*.04),r:player.h*.115,phase:Math.random()*6.2,got:false});
 spawnX=x+width+gap;
}
function jump(){if(state==='menu'||state==='over'){newRun();return}if(state!=='running'||paused)return;if(player.grounded||player.airborne&&player.vy>0&&player.y+player.h>=groundY-player.h*.13){player.vy=-Math.sqrt(2*H*.51*930*scale);player.grounded=false;player.airborne=true;player.jumpCount=(player.jumpCount||0)+1}}
function togglePause(){if(state!=='running')return;paused=!paused;if(!paused)lastTime=performance.now()}
function restart(){newRun()}
function gameOver(){state='over';paused=false;best=Math.max(best,Math.floor(distance/26));try{localStorage.setItem(storeKey,String(best));localStorage.setItem(storeStars,String(+(localStorage.getItem(storeStars)||0)+collected))}catch(_){} }

function update(dt,t){worldTick=t;if(state!=='running'||paused)return;const meters=Math.floor(distance/26);speed=Math.min(560*scale,(300+meters*.48)*scale);distance+=speed*dt;
 if(spawnX<W+player.h*2.8)createSegment();for(const group of [platforms,hazards,stars])for(const o of group)o.x-=speed*dt;
 platforms=platforms.filter(p=>p.x+p.w>-80);hazards=hazards.filter(o=>o.x+o.w>-100);stars=stars.filter(s=>!s.got&&s.x>-50);
 const oldBottom=player.y+player.h;player.vy+=1750*scale*dt;player.y+=player.vy*dt;player.grounded=false;
 const footX=player.x+player.w*.45,support=platformAt(footX);if(support&&player.vy>=0&&oldBottom<=groundY+3&&player.y+player.h>=groundY-1){player.y=groundY-player.h;player.vy=0;player.grounded=true;player.airborne=false}

}

}
function drawOverlay(){ctx.fillStyle='#001e376f';ctx.fillRect(0,0,W,H);const portrait=H>W*1.05,cx=W/2,cy=H*.49,bw=Math.min(W*.88,portrait?460:850),bh=Math.min(H*.76,portrait?520:430),x=cx-bw/2,y=cy-bh/2;

 const title=state==='over'?'¡FIN DEL JUEGO!':paused?'PAUSA':'VLADI RUN';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#572a16';ctx.font=`1000 ${clamp(bw*.095,34,76)}px system-ui,Arial`;ctx.fillText(title,cx,y+bh*.18);

function render(t){ctx.setTransform(DPR,0,0,DPR,0,0);drawBackground(t);for(const p of platforms)drawStonePlatform(p);for(const o of hazards){if(o.type==='crate')drawCrate(o.x,groundY-o.h,o.w);else drawSpikes(o.x,groundY,o.w,o.h)}for(const s of stars)drawCollectible(s);for(const p of particles){ctx.globalAlpha=clamp(p.life/.4,0,1);ellipse(p.x,p.y,4,4,p.color)}ctx.globalAlpha=1;if(state==='running'&&!paused)drawRunner(t);drawHUD();if(state==='menu'||state==='over'||paused)drawOverlay();}

function pointer(e){e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(state==='menu'||state==='over'){jump();return}if(ui.pause&&x>=ui.pause.x&&x<=ui.pause.x+ui.pause.w&&y>=ui.pause.y&&y<=ui.pause.y+ui.pause.h){togglePause();return}if(paused){togglePause();return}jump()}
