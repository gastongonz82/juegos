<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Vladi Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#052b46}button{font:inherit}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(circle at 82% 16%,#fff 0 3%,transparent 3.2%),radial-gradient(ellipse at 18% 30%,#fff 0 7%,transparent 7.2%),radial-gradient(ellipse at 55% 20%,#dff9ff 0 8%,transparent 8.2%),linear-gradient(#159ee9 0 47%,#68dff3 47% 58%,#0c9cc4 58% 66%,#08789c 66% 100%)}
#game:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 54%,#005e7c14 70%,#002b3855);pointer-events:none}
.scenery{position:absolute;z-index:2;inset:0;overflow:hidden;pointer-events:none}.hill{position:absolute;bottom:30%;width:34vw;height:28vh;background:linear-gradient(145deg,#6dd84d,#237b3e 40%,#67533b 41%,#987251);clip-path:polygon(0 100%,12% 42%,30% 20%,45% 48%,62% 5%,78% 40%,100% 100%);opacity:.95}.h1{left:-5%}.h2{left:32%;transform:scale(.8)}.h3{right:-6%;transform:scale(1.1)}.palm{position:absolute;bottom:28%;font-style:normal;font-size:clamp(70px,10vw,170px);filter:drop-shadow(0 6px 4px #0045)}.p1{left:3%}.p2{right:5%}.falls{position:absolute;right:29%;bottom:30%;font-style:normal;font-size:clamp(60px,8vw,130px);opacity:.75}.track{position:absolute;z-index:5;left:0;right:0;bottom:0;height:25%;min-height:120px;background:linear-gradient(#78e23f 0 11%,#208a32 11% 20%,#b46b2d 20% 48%,#8c4f25 48% 100%);border-top:7px solid #12672b;box-shadow:inset 0 12px #fff4}
.track:after{content:"";position:absolute;left:0;right:0;top:38%;height:10px;background:repeating-linear-gradient(90deg,#75421f 0 90px,#9c5b2b 90px 180px);opacity:.25}
#hero{position:absolute;z-index:15;left:16%;bottom:19%;width:clamp(110px,11vw,180px);height:clamp(110px,11vw,180px);object-fit:contain;filter:drop-shadow(0 7px 5px #002c4488);transform-origin:center bottom;animation:runbob .22s ease-in-out infinite alternate}
.obj{position:absolute;z-index:12;bottom:20%;display:grid;place-items:center;filter:drop-shadow(0 5px 3px #0028)}
.rock{width:clamp(65px,7vw,105px);height:clamp(48px,5vw,78px);border:5px solid #4c321f;border-radius:55% 50% 35% 40%;background:linear-gradient(145deg,#b8a184,#685744 65%,#44392f)}
.crate{width:clamp(62px,6vw,92px);height:clamp(62px,6vw,92px);border:6px solid #63350f;background:linear-gradient(45deg,transparent 43%,#754116 44% 56%,transparent 57%),linear-gradient(-45deg,transparent 43%,#754116 44% 56%,transparent 57%),#b96c27;box-shadow:inset 0 0 0 5px #e59a4b}
.star{z-index:13;width:62px;height:62px;font-size:54px;line-height:1;bottom:42%;filter:drop-shadow(0 4px 2px #8c5300);animation:spin 1.6s linear infinite}
@keyframes runbob{to{margin-bottom:3px;transform:rotate(-2deg)}}@keyframes spin{50%{transform:scale(.8) rotate(180deg)}100%{transform:rotate(360deg)}}
.hud{position:absolute;z-index:25;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;border:5px solid #48200c;border-radius:16px;background:linear-gradient(#ad612b,#6d3215);box-shadow:0 6px #321506,inset 0 2px #efa765;color:#fff;font:900 clamp(15px,2vw,24px) Arial Black;padding:8px 14px;text-shadow:0 2px #351506}.score{left:50%;transform:translateX(-50%)}.best{right:max(14px,env(safe-area-inset-right))}.pause{left:max(14px,env(safe-area-inset-left));width:58px;height:54px;padding:0;justify-content:center;z-index:45}
.overlay{position:absolute;z-index:40;inset:0;display:grid;place-items:center;padding:18px;background:#00243a55}.hidden{display:none!important}
.panel{text-align:center;max-width:760px;width:min(92vw,760px);padding:25px;border:7px solid #4b210d;border-radius:32px;background:linear-gradient(#b76a2eeb,#713719ee);box-shadow:0 12px #321506,0 28px 60px #001a2b99;color:#fff}
.title{font:1000 clamp(58px,10vw,120px)/.78 Arial Black;color:#ffd026;text-shadow:0 8px #70350e,5px 0 #123b67,-5px 0 #123b67}.title span{display:block;color:white;font-size:.62em}
.handle{display:inline-block;margin:15px 0;padding:7px 16px;border:3px solid #4b210d;border-radius:14px;background:#6b3118;font-weight:900}.preview{width:clamp(125px,22vw,210px);height:clamp(125px,22vw,210px);object-fit:contain;filter:drop-shadow(0 8px 5px #002a45aa)}
.play,.again,.home{cursor:pointer;font:1000 clamp(21px,3vw,34px) Arial Black;border-radius:20px;color:white}.play,.again{min-width:min(440px,90%);padding:13px 25px;border:6px solid #07531f;background:linear-gradient(#7cf34f,#13b72b);box-shadow:0 8px #063916;text-shadow:0 3px #063916}.home{margin-top:15px;padding:10px 22px;border:5px solid #4b210d;background:linear-gradient(#c47535,#7c3c19);box-shadow:0 6px #351607}
.help{margin-top:17px;font-weight:900}.stats{display:flex;justify-content:center;gap:35px;margin:16px 0}.stats div{min-width:130px;padding:10px;border:3px solid #d88b43;border-radius:16px;background:#4a210caa}.stats b{display:block;font:1000 44px Arial Black;color:#ffd026}.paused{position:absolute;z-index:30;inset:0;display:grid;place-items:center;pointer-events:none;background:#00182b99;color:#fff;font:1000 clamp(50px,10vw,110px) Arial Black;text-shadow:0 6px #001525}
@media(max-width:600px){#hero{left:10%;width:120px;height:120px;bottom:20%}.track{height:22%}.obj{bottom:18%}.star{bottom:40%}.hud{font-size:13px;padding:7px 9px;border-width:3px}.pause{width:48px;height:45px}.panel{padding:18px 10px}.title{font-size:18vw}.preview{width:34vw;height:34vw}.help{font-size:13px}.stats{gap:10px}.stats div{min-width:115px}.stats b{font-size:38px}}
</style></head><body><main id="game" tabindex="0"><div class="scenery"><i class="hill h1"></i><i class="hill h2"></i><i class="hill h3"></i><i class="palm p1">🌴</i><i class="palm p2">🌴</i><i class="falls">💦</i></div><div class="track"></div><div id="objects"></div><img id="hero" src="../flappy-vladi/assets/vladi_final.png" alt="Vladi"><button id="pause" class="hud pause">Ⅱ</button><div id="score" class="hud score">🏃 0 · ⭐ 0</div><div id="best" class="hud best">🏆 0</div><div id="paused" class="paused hidden">PAUSA</div><div id="overlay" class="overlay"><section class="panel"><div class="title"><span>VLADI</span>RUN</div><div class="handle">@vladyerik</div><br><img class="preview" src="../flappy-vladi/assets/vladi_final.png" alt="Vladi"><br><button id="start" class="play">▶ CORRER</button><div class="help">TOCÁ / ESPACIO PARA SALTAR · JUNTÁ ⭐</div></section></div></main>
<script>
(()=>{const g=document.querySelector('#game'),hero=document.querySelector('#hero'),objs=document.querySelector('#objects'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),ov=document.querySelector('#overlay'),pb=document.querySelector('#pause'),pl=document.querySelector('#paused');let running=false,paused=false,y=0,vy=0,dist=0,stars=0,best=+(localStorage.getItem('vladiRunBest')||0),items=[],spawn=1.8,last=0,raf=0;bestEl.textContent='🏆 '+best;
const mobile=()=>innerWidth<=700;const ground=()=>innerHeight*(mobile()?.20:.19);const heroW=()=>mobile()?120:Math.max(110,Math.min(180,innerWidth*.11));const speed=()=>Math.min(.43,.19+dist/2600);const gravity=()=>mobile()?1120:1080;const jumpV=()=>mobile()?860:820;
function clear(){items.forEach(o=>o.el.remove());items=[]}
function add(){const star=Math.random()<.38,el=document.createElement('div');el.className='obj '+(star?'star':Math.random()<.5?'rock':'crate');if(star)el.textContent='⭐';const x=innerWidth+80;objs.appendChild(el);items.push({el,x,star,taken:false});spawn=(mobile()?2.45:2.65)+Math.random()*1.05}
function jump(){if(!running||paused)return;if(y<=5)vy=jumpV()}
function start(){clear();dist=0;stars=0;y=0;vy=0;spawn=3.8;running=true;paused=false;ov.classList.add('hidden');pl.classList.add('hidden');pb.textContent='Ⅱ';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);g.focus()}
function end(){if(!running)return;running=false;cancelAnimationFrame(raf);const pts=Math.floor(dist);best=Math.max(best,pts);localStorage.setItem('vladiRunBest',best);bestEl.textContent='🏆 '+best;ov.classList.remove('hidden');ov.innerHTML='<section class="panel"><div class="title"><span>VLADI</span>RUN</div><h1>¡BUENA CARRERA!</h1><div class="stats"><div>METROS<b>'+pts+'</b></div><div>ESTRELLAS<b>⭐ '+stars+'</b></div><div>RÉCORD<b>'+best+'</b></div></div><button id="again" class="again">↻ VOLVER A CORRER</button><br><button id="home" class="home">⌂ MENÚ</button></section>';document.querySelector('#again').onclick=e=>{e.stopPropagation();start()};document.querySelector('#home').onclick=e=>{e.stopPropagation();location.href='../'}}
function rectsHit(a,b,pad=12){return a.left+pad<b.right&&a.right-pad>b.left&&a.top+pad<b.bottom&&a.bottom-pad>b.top}
function draw(){hero.style.bottom=(ground()+y)+'px';hero.style.transform='rotate('+Math.max(-5,Math.min(5,-vy*.004))+'deg)';items.forEach(o=>o.el.style.left=o.x+'px')}
function loop(t){if(!running)return;if(paused){last=t;raf=requestAnimationFrame(loop);return}const dt=Math.min(.032,(t-last)/1000);last=t;dist+=dt*10*(1+speed());vy-=gravity()*dt;y+=vy*dt;if(y<0){y=0;vy=0}spawn-=dt;if(spawn<=0)add();const px=innerWidth*speed()*dt;for(const o of items){o.x-=px;if(o.x<-140){o.el.remove();o.dead=true;continue}const hr=hero.getBoundingClientRect(),or=o.el.getBoundingClientRect();if(o.star&&!o.taken&&rectsHit(hr,or,16)){o.taken=true;stars++;o.el.remove();o.dead=true}else if(!o.star&&dist>22&&rectsHit({left:hr.left+hr.width*.28,right:hr.right-hr.width*.18,top:hr.top+hr.height*.28,bottom:hr.bottom-hr.height*.10},{left:or.left+or.width*.12,right:or.right-or.width*.12,top:or.top+or.height*.12,bottom:or.bottom-or.height*.06},6)){draw();end();return}}items=items.filter(o=>!o.dead);scoreEl.textContent='🏃 '+Math.floor(dist)+' · ⭐ '+stars;draw();raf=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=e=>{e.stopPropagation();start()};pb.onclick=e=>{e.stopPropagation();if(!running)return;paused=!paused;pb.textContent=paused?'▶':'Ⅱ';pl.classList.toggle('hidden',!paused)};g.addEventListener('pointerdown',e=>{if(!e.target.closest('button')){e.preventDefault();jump()}});g.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;pb.textContent='▶';pl.classList.remove('hidden')}});draw()})();
</script></body></html>
