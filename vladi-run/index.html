 const title=state==='over'?'¡FIN DEL JUEGO!':paused?'PAUSA':'VLADI RUN';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#572a16';ctx.font=`1000 ${clamp(bw*.095,34,76)}px system-ui,Arial`;ctx.fillText(title,cx,y+bh*.18);
 // Mini hero rendered by the same animated full-body drawing used in play.
 if(state==='menu'||paused){const hold=player?{...player}:null;if(!player){player={x:cx-45,y:y+bh*.24,h:145,w:130,grounded:true,airborne:false,vy:0}}const oldX=player.x,oldY=player.y,oldH=player.h,oldW=player.w;player.h=portrait?125:184;player.w=player.h*.9;player.x=cx-player.w/2;player.y=y+bh*.22;drawRunner(worldTick||performance.now());player.x=oldX;player.y=oldY;player.h=oldH;player.w=oldW;if(!hold)player=null}
 if(state==='over'){
  ctx.fillStyle='#3a2719';ctx.font=`800 ${clamp(bw*.048,19,30)}px system-ui,Arial`;ctx.fillText('DISTANCIA',cx-bw*.19,y+bh*.47);ctx.fillText('RÉCORD',cx+bw*.19,y+bh*.47);ctx.fillStyle='#a4490e';ctx.font=`1000 ${clamp(bw*.105,39,72)}px system-ui,Arial`;ctx.fillText(Math.floor(distance/26)+'m',cx-bw*.19,y+bh*.58);ctx.fillText(best+'m',cx+bw*.19,y+bh*.58);ctx.fillStyle='#74451f';ctx.font=`900 ${clamp(bw*.047,18,27)}px system-ui,Arial`;ctx.fillText('⭐  '+collected+' ESTRELLAS',cx,y+bh*.68);

 const buttonW=Math.min(bw*.78,420),buttonH=clamp(H*.075,52,70),buttonY=y+bh*(portrait?.79:.79);ui.play={x:cx-buttonW/2,y:buttonY,w:buttonW,h:buttonH};rounded(ui.play.x,ui.play.y,buttonW,buttonH,18,gradient(0,buttonY,0,buttonH,[[0,'#75e943'],[1,'#13a82b']]),'#075222',5);ctx.fillStyle='#fff';ctx.font=`1000 ${clamp(buttonH*.43,22,32)}px system-ui,Arial`;ctx.fillText(state==='over'?'↻  VOLVER A JUGAR':paused?'▶  CONTINUAR':'▶  JUGAR',cx,buttonY+buttonH/2+1);
 
}
function drawPickup(item){
 const r=item.r;ctx.save();ctx.translate(item.x,item.y);
 ellipse(0,0,r*1.3,r*1.3,item.type==='magnet'?'#563ca8':'#087991','#fff0bd',3);
 if(item.type==='shield'){
  path([[-r*.72,-r*.72],[r*.72,-r*.72],[r*.64,r*.18],[0,r*.86],[-r*.64,r*.18]],'#eafaff','#ffd875',Math.max(1.5,r*.09));
  path([[0,-r*.57],[r*.51,-r*.57],[r*.44,r*.13],[0,r*.62]],'#5dc9e8');
  ctx.strokeStyle='#197694';ctx.lineWidth=Math.max(2,r*.10);ctx.beginPath();ctx.moveTo(-r*.32,-r*.05);ctx.lineTo(-r*.06,r*.21);ctx.lineTo(r*.35,-r*.25);ctx.stroke();

  ctx.strokeStyle='#f6fcff';ctx.lineWidth=r*.43;ctx.beginPath();ctx.moveTo(-r*.55,-r*.65);ctx.lineTo(-r*.55,-r*.27);ctx.moveTo(r*.55,-r*.65);ctx.lineTo(r*.55,-r*.27);ctx.stroke();

}
function drawStageClear(){
 ctx.fillStyle='#061d3977';ctx.fillRect(0,0,W,H);const bw=Math.min(W*.9,620),bh=Math.min(H*.7,420),x=(W-bw)/2,y=(H-bh)/2;
 rounded(x,y,bw,bh,24,gradient(x,y,bw,bh,[[0,'#fff5d8'],[1,'#ffd482']]),'#78431b',5);

 const buttonW=bw*.8,buttonH=Math.min(58,bh*.18),buttonY=y+bh*.77;ui.play={x:(W-buttonW)/2,y:buttonY,w:buttonW,h:buttonH};
 rounded(ui.play.x,buttonY,buttonW,buttonH,15,'#25b93e','#075222',4);ctx.fillStyle='#fff';ctx.font='900 '+clamp(bw*.045,18,26)+'px system-ui';ctx.fillText('▶ CONTINUAR',W/2,buttonY+buttonH/2);
}
function render(t){ctx.setTransform(DPR,0,0,DPR,0,0);drawCachedBackground(t);for(const p of platforms)drawStonePlatform(p);if(state==='running'&&!paused){for(const o of hazards){if(o.disabled)continue;if(o.type==='crate')drawCrate(o.x,groundY-o.h,o.w);else drawSpikes(o.x,groundY,o.w,o.h)}for(const s of stars)drawCollectible(s);for(const item of pickups)drawPickup(item);drawFinish()}for(const p of particles){ctx.globalAlpha=clamp(p.life/.4,0,1);ellipse(p.x,p.y,4,4,p.color)}ctx.globalAlpha=1;if(state==='running'&&!paused)drawRunner(t);drawHUD();if(state==='clear')drawStageClear();else if(state==='lost'||state==='over')drawLifeLost();else if(state==='menu'||paused)drawOverlay();}
function loop(t){
 const elapsed=lastTime?Math.max(0,(t-lastTime)/1000):0;lastTime=t;
 if(state==='running'&&!paused){
  if(elapsed>0&&elapsed<.15){frameSamples++;frameTotal+=elapsed;if(frameSamples>=90){const average=frameTotal/frameSamples;frameSamples=0;frameTotal=0;if(average>1/45&&renderCap>.8){renderCap=renderCap>1.25?1.25:.8;resize()}}}
  let remaining=Math.min(.1,elapsed);
  while(remaining>1e-8&&state==='running'&&!paused){const step=Math.min(1/120,remaining);update(step,t);remaining-=step}
 }else worldTick=t;
 render(t);raf=requestAnimationFrame(loop);
}
function flushStars(){if(!starsPending)return;try{localStorage.setItem(storeStars,String(totalStars));starsPending=false}catch(_){}}
addEventListener('pagehide',flushStars);

function pointer(e){e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(state==='menu'||state==='over'||state==='lost'||state==='clear'){jump();return}if(ui.pause&&x>=ui.pause.x&&x<=ui.pause.x+ui.pause.w&&y>=ui.pause.y&&y<=ui.pause.y+ui.pause.h){togglePause();return}if(paused){togglePause();return}jump()}
canvas.addEventListener('pointerdown',pointer,{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='clear')continueStage();else if(state==='menu')newRun();else jump()}else if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();togglePause()}},{passive:false});document.addEventListener('visibilitychange',()=>{if(document.hidden){flushStars();if(state==='running'&&!paused)togglePause()}});

seedWorld();raf=requestAnimationFrame(loop);
