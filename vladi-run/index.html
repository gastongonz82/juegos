<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#49c9f2"><title>VLADI RUN</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10293b;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.ui{position:fixed;backdrop-filter:blur(3px);z-index:3;top:max(12px,env(safe-area-inset-top));color:#fff;font:900 clamp(14px,3vw,22px) Arial Black;text-shadow:0 2px #321506;background:linear-gradient(#c87832,#743717);border:4px solid #47200d;border-radius:16px;padding:8px 13px;box-shadow:0 5px #2d1407,0 8px 18px #0005}.score{left:50%;transform:translateX(-50%)}.best{right:12px}.pause{left:12px;width:52px;height:48px;padding:0;color:#fff}.cover{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:#06263d66;padding:18px}.cover.hide{display:none}.card{text-align:center;color:#fff;width:min(90vw,650px);padding:22px;border:6px solid #48200c;border-radius:28px;background:linear-gradient(#b86a30ed,#6b3218f2);box-shadow:0 10px #301405}.logo{font:1000 clamp(55px,12vw,105px)/.8 Arial Black;color:#ffd42c;text-shadow:0 7px #70350e,4px 0 #123b67,-4px 0 #123b67}.logo span{display:block;color:#fff;font-size:.6em}.play{margin-top:18px;min-width:min(420px,90%);padding:13px 20px;border:5px solid #07531f;border-radius:18px;background:linear-gradient(#7cf34f,#13b72b);box-shadow:0 7px #063916;color:#fff;font:1000 clamp(20px,4vw,31px) Arial Black}.small{margin-top:14px;font-weight:900}.credit{font-size:11px;opacity:.75;margin-top:13px}@media(max-width:500px){.best{top:70px}.ui{font-size:13px;border-width:3px}.pause{width:47px;height:44px}}
</style></head><body><canvas id="game"></canvas><button id="pause" class="ui pause">Ⅱ</button><div id="score" class="ui score">🏃 0 m · ⭐ 0</div><div id="best" class="ui best">🏆 0</div><div id="cover" class="cover"><div class="card"><div class="logo"><span>VLADI</span>RUN</div><div>@vladyerik</div><button id="play" class="play">▶ CORRER</button><div class="small">TOCÁ / ESPACIO / ↑ PARA SALTAR</div><div class="credit">Motor basado en Endless-Runner (MIT), adaptado para VLADI RUN.</div></div></div><script>
(()=>{const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),cover=document.getElementById('cover'),play=document.getElementById('play'),pauseBtn=document.getElementById('pause');let W,H,DPR,ground,running=false,paused=false,last=0,spawn=0,meters=0,stars=0,best=+(localStorage.getItem('vladiRunBest')||0),speed=0,obs=[],coins=[],vy=0,py=0;bestEl.textContent='🏆 '+best;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ground=H*(W<600?.76:.79);py=Math.min(py,ground-playerH())}
const playerW=()=>Math.max(58,Math.min(92,W*.12)),playerH=()=>playerW()*1.42,px=()=>W<600?W*.13:W*.16;
function reset(){obs=[];coins=[];meters=stars=0;speed=Math.max(310,W*.43);vy=0;py=ground-playerH();spawn=.95;running=true;paused=false;cover.classList.add('hide');pauseBtn.textContent='Ⅱ';last=performance.now()}
function jump(){if(running&&!paused&&py>=ground-playerH()-2)vy=-Math.max(720,H*.95)}
function addObstacle(){const type=Math.random()<.33?'spike':Math.random()<.5?'rock':'crate';const w=type==='spike'?54:Math.max(46,Math.min(68,W*.09));const h=type==='spike'?42:w*(type==='rock'?.72:1);obs.push({x:W+40,y:ground-h,w,h,type});if(Math.random()<.55)coins.push({x:W+70,y:ground-h-85,r:18,t:0})}
function collide(a,b){const p=8;return a.x+p<b.x+b.w-p&&a.x+a.w-p>b.x+p&&a.y+p<b.y+b.h-p&&a.y+a.h-p>b.y+p}
function update(dt){if(!running||paused)return;meters+=dt*10;speed=Math.min(650,speed+dt*4);vy+=Math.max(1750,H*2.1)*dt;py+=vy*dt;if(py>ground-playerH()){py=ground-playerH();vy=0}spawn-=dt;if(spawn<=0){addObstacle();spawn=Math.max(.8,1.65-meters/500)+Math.random()*.55}for(const o of obs)o.x-=speed*dt;for(const c of coins){c.x-=speed*dt;c.t+=dt}obs=obs.filter(o=>o.x+o.w>-30);coins=coins.filter(c=>c.x>-30&&!c.got);const p={x:px()+playerW()*.18,y:py+playerH()*.08,w:playerW()*.65,h:playerH()*.86};for(const o of obs)if(collide(p,o)){gameOver();return}for(const c of coins){const dx=p.x+p.w/2-c.x,dy=p.y+p.h/2-c.y;if(dx*dx+dy*dy<(c.r+25)**2){c.got=true;stars++}}scoreEl.textContent='🏃 '+Math.floor(meters)+' m · ⭐ '+stars}
function gameOver(){running=false;best=Math.max(best,Math.floor(meters));localStorage.setItem('vladiRunBest',best);bestEl.textContent='🏆 '+best;cover.classList.remove('hide');cover.querySelector('.card').innerHTML='<div class="logo"><span>VLADI</span>RUN</div><h2>¡BUENA CARRERA!</h2><div class="small">'+Math.floor(meters)+' m · ⭐ '+stars+' · 🏆 '+best+'</div><button id="again" class="play">↻ OTRA VEZ</button><div class="credit">Motor Canvas MIT adaptado para VLADI RUN.</div>';document.getElementById('again').onclick=reset}
function hill(color,base,amp,step,shift){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,base);for(let x=0;x<=W+step;x+=step){let y=base-amp*(.35+.65*Math.abs(Math.sin((x+shift)/step*.78)));ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function background(t){const grad=ctx.createLinearGradient(0,0,0,ground);grad.addColorStop(0,'#35c9f4');grad.addColorStop(.58,'#9cecff');grad.addColorStop(1,'#16aaca');ctx.fillStyle=grad;ctx.fillRect(0,0,W,ground);ctx.fillStyle='#fff6ad';ctx.beginPath();ctx.arc(W*.82,H*.18,Math.min(48,W*.07),0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';for(const [x,y,s] of [[.18,.2,1],[.57,.3,.7]]){ctx.beginPath();ctx.ellipse(W*x,H*y,70*s,24*s,0,0,Math.PI*2);ctx.fill()}hill('#75b6bd',ground-H*.08,H*.19,W*.22,t*.003);hill('#397e8d',ground-H*.035,H*.23,W*.25,t*.006);ctx.fillStyle='#087fba';ctx.fillRect(0,ground-H*.13,W,H*.13);ctx.fillStyle='#18b8db';for(let i=0;i<6;i++)ctx.fillRect(((i*190-t*.025)%(W+220))-100,ground-H*(.105-i*.008),120,2);ctx.fillStyle='#74dc35';ctx.fillRect(0,ground-18,W,18);ctx.fillStyle='#b8f35b';ctx.fillRect(0,ground-18,W,6);ctx.fillStyle='#8a5129';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#a96b37';for(let x=-80;x<W+100;x+=150){ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+45,H);ctx.lineTo(x+100,H);ctx.lineTo(x+65,ground);ctx.fill()}}
function drawPlayer(t){const w=playerW(),h=playerH(),x=px(),y=py,bob=running&&vy===0?Math.sin(t*.018)*3:0;ctx.save();ctx.translate(x,y+bob);ctx.rotate(running&&vy===0?.08:Math.max(-.12,Math.min(.12,vy/5000)));const skin='#efaa77',blue='#1288e5',dark='#111';ctx.fillStyle=skin;ctx.beginPath();ctx.arc(w*.5,h*.25,w*.24,0,Math.PI*2);ctx.fill();ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(w*.48,h*.15,w*.31,h*.1,-.08,0,Math.PI*2);ctx.fill();ctx.fillStyle=blue;ctx.roundRect(w*.25,h*.42,w*.5,h*.38,12);ctx.fill();ctx.fillStyle='#ffd52d';ctx.font='900 '+w*.3+'px Arial';ctx.textAlign='center';ctx.fillText('★',w*.5,h*.7);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(w*.43,h*.245,w*.018,0,Math.PI*2);ctx.arc(w*.57,h*.245,w*.018,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b95e49';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w*.5,h*.285,w*.075,.12*Math.PI,.88*Math.PI);ctx.stroke();const phase=Math.sin(t*.022);ctx.strokeStyle=blue;ctx.lineWidth=w*.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w*.3,h*.5);ctx.lineTo(w*(.12+.13*phase),h*(.68-.1*phase));ctx.moveTo(w*.7,h*.5);ctx.lineTo(w*(.88-.13*phase),h*(.68+.1*phase));ctx.stroke();ctx.strokeStyle='#1356b8';ctx.beginPath();ctx.moveTo(w*.4,h*.77);ctx.lineTo(w*(.25-.15*phase),h*.98);ctx.moveTo(w*.6,h*.77);ctx.lineTo(w*(.75+.15*phase),h*.98);ctx.stroke();ctx.restore()}
function drawObstacle(o){ctx.save();if(o.type==='crate'){let cg=ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);cg.addColorStop(0,'#e9a24f');cg.addColorStop(.5,'#b96828');cg.addColorStop(1,'#7a3918');ctx.fillStyle=cg;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#63340f';ctx.lineWidth=6;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.beginPath();ctx.moveTo(o.x+6,o.y+6);ctx.lineTo(o.x+o.w-6,o.y+o.h-6);ctx.moveTo(o.x+o.w-6,o.y+6);ctx.lineTo(o.x+6,o.y+o.h-6);ctx.stroke()}else if(o.type==='rock'){ctx.fillStyle='#6d7780';ctx.shadowColor='#24323a';ctx.shadowBlur=8;ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h*.58,o.w/2,o.h*.55,0,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#eef6fa';ctx.shadowColor='#4c5960';ctx.shadowBlur=5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(o.x+i*18,o.y+o.h);ctx.lineTo(o.x+i*18+10,o.y);ctx.lineTo(o.x+i*18+20,o.y+o.h);ctx.fill()}}ctx.restore()}
function draw(t){background(t);for(const c of coins){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.t*2);ctx.fillStyle='#ffd629';ctx.font='900 38px Arial';ctx.textAlign='center';ctx.fillText('★',0,12);ctx.restore()}for(const o of obs)drawObstacle(o);drawPlayer(t)}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
play.onclick=reset;pauseBtn.onclick=e=>{e.stopPropagation();if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';last=performance.now()};cvs.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;pauseBtn.textContent='▶'}});resize();requestAnimationFrame(loop)})();
</script></body></html>
