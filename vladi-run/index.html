.game:before{content:"";position:absolute;z-index:3;left:0;right:0;bottom:var(--ground);height:16px;pointer-events:none;background:repeating-linear-gradient(90deg,#b8f66a 0 38px,#7bd143 38px 76px);filter:drop-shadow(0 3px 2px #154c22)}

@media(max-width:430px){.best{top:72px;right:10px}.score{max-width:58vw;white-space:nowrap}.pause{left:10px}.hud{border-radius:14px}.hero{left:10%}.palm{bottom:35%}.island{bottom:31%}.i2{bottom:34%}}

<body oncontextmenu="return false"><main id="game" class="game" tabindex="0" data-build="2026-10-05-c0"><div class="world"><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="mount m1"></i><i class="mount m2"></i><i class="island i1"></i><i class="island i2"></i><i class="palm p1">🌴</i><i class="palm p2">🌴</i></div><div class="ground"></div><div id="objects"></div><div id="combo" class="combo">⭐ +1</div><div id="hero" class="hero" aria-label="Vladi"><div class="kid"><div class="hair"></div><div class="kidface"><i></i><b></b></div><div class="shirt">★</div><span class="arm ar1"></span><span class="arm ar2"></span><span class="leg lg1"></span><span class="leg lg2"></span></div></div><button id="pause" class="hud pause">Ⅱ</button><div id="score" class="hud score">🏃 0 m · ⭐ 0</div><div id="best" class="hud best">🏆 0</div><div id="paused" class="paused hidden">PAUSA</div><div id="overlay" class="overlay"><section class="panel"><div class="title"><span>VLADI</span>RUN</div><div class="handle">@vladyerik</div><h2>AVENTURA TROPICAL</h2><div class="ready">CORRÉ · SALTÁ · JUNTÁ ESTRELLAS</div><button id="start" class="play">▶ CORRER</button><div class="help">TOCÁ / ESPACIO / ↑ PARA SALTAR · JUNTÁ ⭐</div></section></div></main>
<script>
(()=>{const g=document.querySelector('#game'),hero=document.querySelector('#hero'),objs=document.querySelector('#objects'),score=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),pause=document.querySelector('#pause'),pausedEl=document.querySelector('#paused'),combo=document.querySelector('#combo');let running=false,paused=false,y=0,vy=0,meters=0,stars=0,best=+(localStorage.getItem('vladiRunBest')||0),items=[],spawn=3,last=0,raf=0;bestEl.textContent='🏆 '+best;
const ground=()=>innerHeight*(innerHeight<650&&innerWidth>700?.18:.20),speed=()=>Math.min(560,285+meters*.62),gravity=()=>2200,jumpV=()=>1050;
function wipe(){items.forEach(x=>x.el.remove());items=[]}function add(){const isStar=Math.random()<.42,el=document.createElement('div');let kind;if(isStar){kind='star'}else if(meters>90&&Math.random()<.25){kind='spikes'}else{kind=Math.random()<.52?'crate':'rock'}el.className='object '+kind;if(isStar)el.textContent='⭐';const x=innerWidth+100;objs.appendChild(el);items.push({el,x,isStar,dead:false});spawn=Math.max(1.25,1.85-Math.min(meters,250)/600)+Math.random()*.65}
function jump(){if(running&&!paused&&y<5)vy=jumpV()}
function start(){wipe();y=vy=meters=stars=0;spawn=1.7;running=true;paused=false;g.classList.add('running');overlay.classList.add('hidden');pausedEl.classList.add('hidden');pause.textContent='Ⅱ';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);g.focus()}
function hit(a,b,p=.15){return a.left+a.width*p<b.right-b.width*p&&a.right-a.width*p>b.left+b.width*p&&a.top+a.height*p<b.bottom-b.height*.08&&a.bottom-a.height*.08>b.top+b.height*p}
function end(){if(!running)return;running=false;g.classList.remove('running');cancelAnimationFrame(raf);const m=Math.floor(meters);best=Math.max(best,m);localStorage.setItem('vladiRunBest',best);bestEl.textContent='🏆 '+best;overlay.classList.remove('hidden');overlay.innerHTML='<section class="panel"><div class="title"><span>VLADI</span>RUN</div><h1>¡BUENA CARRERA!</h1><div class="stats"><div>METROS<b>'+m+'</b></div><div>ESTRELLAS<b>⭐ '+stars+'</b></div><div>RÉCORD<b>'+best+'</b></div></div><button id="again" class="again">↻ VOLVER A CORRER</button><br><button id="home" class="home">⌂ MENÚ</button></section>';document.querySelector('#again').onclick=e=>{e.stopPropagation();start()};document.querySelector('#home').onclick=e=>{e.stopPropagation();location.href='../'}}
function loop(t){if(!running)return;if(paused){last=t;raf=requestAnimationFrame(loop);return}const dt=Math.min(.032,(t-last)/1000);last=t;meters+=dt*10;vy-=gravity()*dt;y+=vy*dt;if(y<0){y=0;vy=0}spawn-=dt;if(spawn<=0)add();for(const o of items){o.x-=speed()*dt;o.el.style.left=o.x+'px';if(o.x<-140){o.dead=true;o.el.remove();continue}const hr=hero.getBoundingClientRect(),or=o.el.getBoundingClientRect();if(o.isStar&&hit(hr,or,.22)){stars++;combo.classList.remove('show');void combo.offsetWidth;combo.classList.add('show');o.dead=true;o.el.remove()}else if(!o.isStar&&meters>24&&hit(hr,or,.24)){end();return}}items=items.filter(o=>!o.dead);hero.style.bottom=(ground()+y)+'px';hero.style.rotate=Math.max(-5,Math.min(5,-vy*.004))+'deg';score.textContent='🏃 '+Math.floor(meters)+' m · ⭐ '+stars;raf=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=e=>{e.stopPropagation();start()};requestAnimationFrame(()=>{hero.style.bottom=ground()+'px'});pause.onclick=e=>{e.stopPropagation();if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';pausedEl.classList.toggle('hidden',!paused)};g.addEventListener('pointerdown',e=>{if(!e.target.closest('button')){e.preventDefault();jump()}},{passive:false});g.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});g.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;pause.textContent='▶';pausedEl.classList.remove('hidden')}});addEventListener('resize',()=>{if(!running){hero.style.bottom=ground()+'px'}});hero.style.bottom=ground()+'px'})();
addEventListener('orientationchange',()=>setTimeout(()=>{if(!running)hero.style.bottom=ground()+'px'},120));
</script></body></html>
