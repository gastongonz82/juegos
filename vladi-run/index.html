<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VLADI RUN</title><style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#24bdf1;touch-action:none;font-family:Arial,sans-serif}canvas{display:block}.hud{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.h{background:linear-gradient(#542611,#2d1209);border:3px solid #160904;border-radius:20px;color:#fff;padding:8px 13px;font-size:clamp(15px,4vw,22px);font-weight:900;box-shadow:inset 0 2px #a96436,0 4px 0 #170a05,0 6px 12px #0005;text-shadow:0 2px #000}.back{pointer-events:auto;text-decoration:none}.start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#05243b55}.panel{text-align:center;background:linear-gradient(#542611f2,#291108f5);border:4px solid #140803;border-radius:28px;color:#fff;padding:24px;width:min(86vw,430px);box-shadow:inset 0 3px #ad6a3b,0 12px 30px #0008}.panel h1{font-size:48px;margin:0;text-shadow:0 4px #000}.panel button{font-size:24px;font-weight:900;border:0;border-radius:18px;padding:13px 28px;background:linear-gradient(#ffe84b,#ffac00);box-shadow:0 6px #b76500}.hide{display:none}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script></head><body><div id="game"></div><div class="hud"><div class="h">⭐ <span id="st">0</span></div><div class="h">🏃 <span id="mt">0</span>m</div><div class="h">🏆 <span id="be">0</span>m</div><a class="h back" href="../">JUEGOS</a></div><div class="start" id="start"><div class="panel"><h1>VLADI RUN</h1><p>Corré · saltá · juntá estrellas</p><button id="play">▶ JUGAR</button></div></div><script>
const $=x=>document.querySelector(x),best=()=>+(localStorage.vrbest||0);$('#be').textContent=best();
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TILE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150"><defs><linearGradient id="d" y2="1"><stop stop-color="#c47732"/><stop offset="1" stop-color="#773a1c"/></linearGradient></defs><rect y="35" width="180" height="115" fill="url(#d)"/><path d="M0 42Q18 7 40 35T82 32T125 34T180 28v38H0Z" fill="#72dc31"/><path d="M0 52Q25 27 48 50T96 47T145 49T180 43" fill="none" stroke="#22a62c" stroke-width="12"/><g fill="#e3a158" opacity=".65"><rect x="18" y="83" width="55" height="8" rx="4"/><rect x="95" y="108" width="64" height="8" rx="4"/></g></svg>`);
const STAR=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"><circle cx="35" cy="35" r="31" fill="#ffb400" stroke="#fff06b" stroke-width="5"/><path d="m35 9 7 17 19 1-15 12 5 19-16-10-16 10 5-19L9 27l19-1Z" fill="#fff12f" stroke="#e98d00" stroke-width="2"/></svg>`);
const CRATE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect x="5" y="5" width="90" height="90" rx="7" fill="#b76628" stroke="#5d2b16" stroke-width="8"/><path d="m15 15 70 70M85 15 15 85" stroke="#6e341a" stroke-width="14"/><path d="m15 15 70 70M85 15 15 85" stroke="#dc914a" stroke-width="5"/></svg>`);
const SPIKE=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="130" height="75"><defs><linearGradient id="s" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#8fa7b5"/></linearGradient></defs><path d="M4 70 25 7l20 63L66 4l21 66 20-61 19 61Z" fill="url(#s)" stroke="#526b78" stroke-width="4"/></svg>`);
const CRAB=svg(`<svg xmlns="http://www.w3.org/2000/svg" width="110" height="75"><g fill="#ed3e24" stroke="#9e1e13" stroke-width="4"><ellipse cx="55" cy="45" rx="31" ry="22"/><path d="M28 43 8 28 3 12l20 8 10 15M82 43l20-15 5-16-20 8-10 15"/></g><g fill="#fff" stroke="#222" stroke-width="3"><circle cx="43" cy="28" r="9"/><circle cx="67" cy="28" r="9"/></g><circle cx="43" cy="28" r="3"/><circle cx="67" cy="28" r="3"/></svg>`);
class Game extends Phaser.Scene{
 preload(){this.load.image('bg','assets/reference-bg.jpg');this.load.image('tile',TILE);this.load.image('star',STAR);this.load.image('crate',CRATE);this.load.image('spike',SPIKE);this.load.image('crab',CRAB);this.load.image('face','assets/vladi-face.png')}
 create(){this.go=false;this.dead=false;this.score=0;this.m=0;this.speed=420;this.jumps=0;this.bg=this.add.tileSprite(0,0,1280,720,'bg').setOrigin(0).setDisplaySize(1280,720);
 this.floor=560;this.platforms=this.physics.add.staticGroup();for(let x=-40;x<1400;x+=170){let p=this.platforms.create(x,this.floor,'tile').setOrigin(0,0).setDisplaySize(175,145);p.refreshBody()}
 this.p=this.add.container(190,430);this.physics.add.existing(this.p);this.p.body.setSize(78,120).setOffset(-39,-60);this.p.body.setGravityY(1450);this.p.body.setCollideWorldBounds(true);
 let sh=this.add.ellipse(0,66,88,17,0x12370e,.28),body=this.add.graphics();body.fillStyle(0x1789e7).fillRoundedRect(-35,-5,70,78,22);body.fillStyle(0xffdd24);body.fillPoints([{x:0,y:5},{x:8,y:23},{x:28,y:24},{x:12,y:37},{x:17,y:57},{x:0,y:46},{x:-17,y:57},{x:-12,y:37},{x:-28,y:24},{x:-8,y:23}],true);
 this.l1=this.add.rectangle(-18,65,18,52,0x1456a0).setOrigin(.5,0);this.l2=this.add.rectangle(18,65,18,52,0x1456a0).setOrigin(.5,0);this.s1=this.add.ellipse(-22,117,40,19,0xffffff);this.s2=this.add.ellipse(22,117,40,19,0xffffff);let face=this.add.image(0,-48,'face').setDisplaySize(88,88);let mask=this.make.graphics({add:false});mask.fillCircle(0,-48,40);face.setMask(mask.createGeometryMask());let cap=this.add.graphics();cap.fillStyle(0x10151b).fillEllipse(0,-80,82,29).fillRoundedRect(-35,-93,70,22,9).fillRoundedRect(27,-82,34,8,4);this.p.add([sh,this.l1,this.l2,this.s1,this.s2,body,face,cap]);this.p.setDepth(10);
 this.physics.add.collider(this.p,this.platforms,()=>this.jumps=0);this.obs=this.physics.add.group({allowGravity:false});this.items=this.physics.add.group({allowGravity:false});this.physics.add.overlap(this.p,this.obs,()=>this.end());this.physics.add.overlap(this.p,this.items,(a,b)=>{b.destroy();this.score++;$('#st').textContent=this.score});
 this.input.on('pointerdown',()=>{if(this.go)this.jump()});this.input.keyboard.on('keydown-SPACE',()=>{if(this.go)this.jump()});this.time.addEvent({delay:1450,loop:true,callback:()=>{if(this.go&&!this.dead)this.spawn()}});
 $('#play').onclick=()=>{this.go=true;this.t0=this.time.now;$('#start').classList.add('hide')}}
 jump(){if(this.dead||this.jumps>1)return;this.p.body.setVelocityY(this.jumps?-520:-680);this.jumps++}
 spawn(){let x=1350,r=Math.random(),key=r<.48?'crate':r<.78?'spike':'crab',w=key==='crate'?86:key==='spike'?105:82,h=key==='crate'?86:key==='spike'?58:60;let o=this.obs.create(x,this.floor+4,key).setOrigin(.5,1).setDisplaySize(w,h);o.body.setSize(w*.8,h*.8);o.setVelocityX(-this.speed);for(let i=0,n=Phaser.Math.Between(2,4);i<n;i++){let s=this.items.create(x+110+i*66,this.floor-125-(i%2)*40,'star').setDisplaySize(46,46);s.setVelocityX(-this.speed)}}
 end(){if(this.dead)return;this.dead=true;this.physics.pause();let b=Math.max(best(),this.m);localStorage.vrbest=b;$('#be').textContent=b;let q=this.add.rectangle(640,340,520,200,0x3b180b,.94).setStrokeStyle(5,0x170904).setDepth(30);this.add.text(640,300,'¡GRAN CARRERA!',{fontSize:'38px',fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(31);this.add.text(640,350,this.m+'m   ⭐ '+this.score,{fontSize:'28px',color:'#ffdd2c'}).setOrigin(.5).setDepth(31);this.add.text(640,400,'TOCÁ PARA REINICIAR',{fontSize:'20px',fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(31);this.input.once('pointerdown',()=>location.reload())}
 update(t){if(!this.go||this.dead)return;let sec=(t-this.t0)/1000;this.speed=Math.min(650,420+sec*3);this.bg.tilePositionX+=.18;for(const x of this.obs.children.entries)x.setVelocityX(-this.speed);for(const x of this.items.children.entries)x.setVelocityX(-this.speed);this.m=Math.floor(sec*10);$('#mt').textContent=this.m;let g=this.p.body.blocked.down||this.p.body.touching.down,p=t*.023;if(g){this.l1.rotation=Math.sin(p)*.62;this.l2.rotation=-Math.sin(p)*.62;this.s1.x=-22+Math.sin(p)*17;this.s2.x=22-Math.sin(p)*17;this.p.angle=Math.sin(p*2)*1.3}else{this.l1.rotation=-.35;this.l2.rotation=.45;this.p.angle=-6}}
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:720,physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.ENVELOP,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Game]});
</script></body></html>
