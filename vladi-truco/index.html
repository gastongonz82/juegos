<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SUITS=['espada','basto','oro','copa'],NUM=[1,2,3,4,5,6,7,10,11,12],RANK={'espada-1':14,'basto-1':13,'espada-7':12,'oro-7':11};
const state={scores:[0,0],target:30,hand:0,mano:0,turn:0,round:0,tricks:[],hands:[[],[]],played:[[],[]],pending:null,truco:1,trucoCaller:null,envidoDone:false,envido:[],envidoCaller:null,flor:false,florDone:false,ended:false,ready:false,difficulty:'normal',token:0};
let voice=true,fx=true,music=false,audioCtx=null,musicTimer=null,aiTimer=null;
function strength(c){let k=c.s+'-'+c.n;if(RANK[k])return RANK[k];return ({3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1})[c.n]}
function envido(cards){let best=0;for(const c of cards)best=Math.max(best,c.n>7?0:c.n);for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(cards[i].s===cards[j].s)best=Math.max(best,20+(cards[i].n>7?0:cards[i].n)+(cards[j].n>7?0:cards[j].n));return best}
function hasFlor(cards){return cards.length===3&&cards.every(c=>c.s===cards[0].s)}
function florValue(cards){return 20+cards.reduce((a,c)=>a+(c.n>7?0:c.n),0)}
function deck(){return SUITS.flatMap(s=>NUM.map(n=>({s,n}))).sort(()=>Math.random()-.5)}
function spanishCardSVG(c){
const palette={espada:'#36517a',basto:'#2e6c4e',oro:'#bf8b27',copa:'#ad3e36'},col=palette[c.s];
const glyph={espada:'⚔',basto:'♣',oro:'✺',copa:'♜'}[c.s];
const shape=(x,y,scale=1)=>'<g transform="translate('+x+' '+y+') scale('+scale+')" stroke="'+col+'" stroke-width="1.3" fill="none">'+(
c.s==='oro'?'<circle r="10" fill="#f2cb62"/><circle r="7" stroke="#8d6216"/><path d="M-5 0H5M0-5V5"/>':
c.s==='copa'?'<path d="M-10 -11H10L7 2Q0 13 -7 2Z" fill="#c95343"/><path d="M0 10V17M-8 17H8"/><path d="M-13 -12H13"/>':
c.s==='espada'?'<path d="M0 -17L5 -7 3 8 0 13 -3 8 -5 -7Z" fill="#bed4e2"/><path d="M-11 9H11M0 12V20"/><circle cy="20" r="2"/>':
'<path d="M0 -17C-12 -16 -13 -6 -7 -3C-15 1 -12 9 -3 8L-1 18H3L4 8C13 9 16 1 7 -3C13 -8 11 -17 0 -17Z" fill="#5d8a55"/>')+'</g>';
let center='';
if(c.n<=7){const coords={1:[[48,73]],2:[[48,44],[48,108]],3:[[48,36],[48,74],[48,111]],4:[[30,43],[66,43],[30,108],[66,108]],5:[[30,43],[66,43],[48,76],[30,108],[66,108]],6:[[30,36],[66,36],[30,75],[66,75],[30,114],[66,114]],7:[[30,36],[66,36],[30,75],[66,75],[30,114],[66,114],[48,75]]};center=coords[c.n].map(([x,y])=>shape(x,y,.86)).join('')}
else{const names={10:'SOTA',11:'CABALLO',12:'REY'},hat=c.n===12?'♛':c.n===11?'♞':'♟';center='<rect x="18" y="29" width="60" height="99" rx="4" fill="#f4e5c2" stroke="'+col+'"/><path d="M20 106Q48 79 76 106V125H20Z" fill="'+col+'"/><circle cx="48" cy="66" r="15" fill="#e5b98a" stroke="#734c35"/><path d="M34 59Q48 33 62 59" fill="'+col+'"/><text x="48" y="48" font-size="19" text-anchor="middle" fill="#d8aa3b">'+hat+'</text><path d="M40 67h4m9 0h4M44 76q5 5 9 0" stroke="#653d2b" fill="none"/><text x="48" y="119" font-size="9" text-anchor="middle" fill="#fff2cc" font-weight="bold">'+names[c.n]+'</text>'}
return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 150" aria-label="'+c.n+' de '+c.s+'" role="img"><rect x="1" y="1" width="94" height="148" rx="5" fill="#fff9ea" stroke="'+col+'" stroke-width="1.5"/><rect x="6" y="6" width="84" height="138" rx="3" fill="none" stroke="#b6a17c" stroke-width=".7"/><text x="11" y="23" font-size="20" font-family="Georgia" font-weight="bold" fill="'+col+'">'+c.n+'</text><text x="85" y="139" text-anchor="end" font-size="18" font-family="Georgia" font-weight="bold" fill="'+col+'">'+c.n+'</text>'+center+'</svg>'
}
function card(c,back=false){const el=document.createElement('div');el.className='card '+(back?'backcard':c.s);if(!back)el.innerHTML=spanishCardSVG(c);return el}
function say(t){const el=$('speech');el.textContent=t;el.classList.remove('hidden');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add('hidden'),1800);if(voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.96;u.pitch=.85;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='es-ar')||speechSynthesis.getVoices().find(x=>x.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}}
function beep(f=340,d=.07){if(!fx)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch{}}
function musicLoop(){if(!music)return;const notes=[196,246.94,293.66,246.94,220,261.63,329.63,261.63];let i=0;musicTimer=setInterval(()=>{try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.value=.008;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.stop(audioCtx.currentTime+.23)}catch{}},340)}
function notify(t){$('notice').textContent=t}
function btn(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;$('controls').append(b)}
function schedule(fn,ms=750){clearTimeout(aiTimer);const token=state.token;aiTimer=setTimeout(()=>{if(token===state.token)fn()},ms)}
function render(){const s=state;$('humanScore').textContent=s.scores[0];$('aiScore').textContent=s.scores[1];$('target').textContent='A '+s.target+' puntos';$('handLabel').textContent='Mano '+s.hand;$('roundLabel').textContent='Baza '+Math.min(s.round+1,3)+' · '+(s.mano===0?'Sos mano':'Don Truco es mano');$('envidoLabel').textContent=s.envidoDone?'Envido cerrado':s.envido.length?'Envido: '+s.envido.join(' + '):'Envido disponible';$('trucoLabel').textContent='Truco: '+s.truco+' punto'+(s.truco>1?'s':'');$('opponent').replaceChildren(...s.hands[1].map(()=>card(null,true)));$('mine').replaceChildren(...s.hands[0].map((c,i)=>{const el=card(c);el.onclick=()=>play(0,i);if(s.turn!==0||s.pending||s.ended)el.classList.add('locked');return el}));$('aiPile').replaceChildren(...s.played[1].map(c=>card(c)));$('humanPile').replaceChildren(...s.played[0].map(c=>card(c)));$('controls').replaceChildren();if(!s.ready||s.ended)return;if(s.pending){if(s.pending.to===0){btn('¡Quiero!',()=>respond(true),true);btn('No quiero',()=>respond(false));if(s.pending.kind==='envido'){for(const v of raises())btn(v,()=>raiseEnvido(v))}if(s.pending.kind==='truco'&&s.pending.level<4)btn(['','','Retruco','Vale cuatro'][s.pending.level],()=>raiseTruco())}return}if(s.turn===0){if(canEnvido()){btn('Envido',()=>callEnvido('Envido'));btn('Real envido',()=>callEnvido('Real envido'));btn('Falta envido',()=>callEnvido('Falta envido'))}if(canFlor(0))btn('¡Flor!',()=>callFlor(0));if(canTruco(0))btn(['','Truco','Retruco','Vale cuatro'][s.truco],()=>callTruco(0));btn('Ir al mazo',()=>fold())}}
function canEnvido(){return !state.envidoDone&&!state.florDone&&state.round===0&&state.played[0].length===0&&state.played[1].length===0&&!state.pending}
function canFlor(p){return state.flor&&!state.florDone&&state.round===0&&state.played[p].length===0&&hasFlor(state.hands[p])}
function canTruco(p){return !state.pending&&state.truco<4&&(state.trucoCaller===null||state.trucoCaller!==p)}
function start(){state.token++;clearTimeout(aiTimer);Object.assign(state,{scores:[0,0],target:+$('length').value,hand:0,mano:Math.random()<.5?0:1,ended:false,ready:true,flor:$('flor').checked,difficulty:$('difficulty').value});$('modal').classList.add('hidden');nextHand()}
function nextHand(){state.token++;clearTimeout(aiTimer);if(state.scores.some(x=>x>=state.target)){finish();return}const s=state;s.hand++;s.mano=s.hand===1?s.mano:1-s.mano;s.turn=s.mano;s.round=0;s.tricks=[];s.played=[[],[]];s.pending=null;s.truco=1;s.trucoCaller=null;s.envidoDone=false;s.envido=[];s.envidoCaller=null;s.florDone=false;const d=deck();s.hands=[d.slice(0,3),d.slice(3,6)];notify('Nueva mano. '+(s.mano===0?'Salís vos.':'Sale Don Truco.'));render();if(s.turn===1)aiMove()}
function aiMove(){if(state.ended)return;schedule(()=>{const s=state;if(s.pending){if(s.pending.to!==1)return;const p=s.pending;let accept=true;if(p.kind==='envido'){const value=envido(s.hands[1]);accept=value>=(s.difficulty==='hard'?23:s.difficulty==='easy'?18:21)||Math.random()<.16}else if(p.kind==='truco'){const avg=s.hands[1].reduce((a,c)=>a+strength(c),0)/Math.max(1,s.hands[1].length);accept=avg>(s.difficulty==='hard'?6:7)||Math.random()<.32}else if(p.kind==='flor')accept=true;respond(accept);return}if(s.turn!==1)return;if(canFlor(1)){callFlor(1);return}if(canEnvido()&&envido(s.hands[1])>= (s.difficulty==='hard'?26:29)&&Math.random()<.55){callEnvido('Envido',1);return}if(canTruco(1)&&s.truco===1&&s.hands[1].some(c=>strength(c)>=11)&&Math.random()<.28){callTruco(1);return}let i=0;const rival=s.played[0].length>s.played[1].length?s.played[0].at(-1):null;if(rival){const winning=s.hands[1].map((c,i)=>({c,i})).filter(x=>strength(x.c)>strength(rival)).sort((a,b)=>strength(a.c)-strength(b.c));i=winning.length?winning[0].i:s.hands[1].reduce((best,c,j)=>strength(c)<strength(s.hands[1][best])?j:best,0)}else{i=s.hands[1].reduce((best,c,j)=>strength(c)<strength(s.hands[1][best])?j:best,0);if(s.difficulty==='hard'&&s.round===1&&s.tricks[0]===1)i=s.hands[1].reduce((best,c,j)=>strength(c)>strength(s.hands[1][best])?j:best,0)}play(1,i)},620)}
function play(p,i){const s=state;if(s.ended||s.pending||s.turn!==p||i<0||i>=s.hands[p].length)return;const c=s.hands[p].splice(i,1)[0];s.played[p].push(c);beep(300,0.11);s.turn=1-p;render();if(s.played[0].length===s.played[1].length){const a=strength(s.played[0].at(-1)),b=strength(s.played[1].at(-1));s.tricks.push(a===b?-1:a>b?0:1);const winner=handWinner(s.tricks,s.mano);if(winner!==null){schedule(()=>endHand(winner,s.truco),950);notify(winner===0?'¡Ganaste la mano!':'Don Truco ganó la mano.');return}s.round++;s.turn=s.tricks.at(-1)===-1?s.mano:s.tricks.at(-1);notify(s.tricks.at(-1)===-1?'¡Parda!':s.turn===0?'Te toca salir.':'Sale Don Truco.');render()}if(s.turn===1)aiMove()}
function handWinner(t,mano){if(t.length===1)return null;if(t[0]!==-1&&t[1]===t[0])return t[0];if(t[0]!==-1&&t[1]===-1)return t[0];if(t[0]===-1&&t[1]!==-1)return t[1];if(t.length<3)return null;if(t[0]===-1&&t[1]===-1&&t[2]===-1)return mano;if(t[0]===-1)return t[2]===-1?mano:t[2];if(t[1]===-1)return t[0];return t[2]===-1?t[0]:t[2]}
function points(p,n,msg){state.scores[p]+=n;notify(msg+' · +'+n+' punto'+(n===1?'':'s'));render();if(state.scores[p]>=state.target){finish();return true}return false}
function endHand(p,n){if(state.ended)return;const over=points(p,n,p===0?'¡Ganaste la mano!':'Don Truco ganó la mano');if(!over)schedule(nextHand,1350)}
function finish(){state.ended=true;state.token++;render();$('modal').classList.remove('hidden');$('modal').querySelector('h1').textContent=state.scores[0]>=state.target?'¡GANASTE! 🏆':'GANÓ DON TRUCO';$('modal').querySelector('p').textContent='Resultado final: '+state.scores[0]+' a '+state.scores[1]+'. ¿Jugamos otra?';$('begin').textContent='Nueva partida'}
function callTruco(p){if(!canTruco(p))return;const level=state.truco+1;state.pending={kind:'truco',to:1-p,by:p,level};say(['','','¡Truco!','¡Retruco!','¡Vale cuatro!'][level]);render();if(state.pending.to===1)aiMove()}
function raiseTruco(){const p=state.pending;if(!p||p.kind!=='truco'||p.to!==0||p.level>=4)return;state.pending={kind:'truco',to:1,by:0,level:p.level+1};say(state.pending.level===3?'¡Retruco!':'¡Vale cuatro!');render();aiMove()}
function callEnvido(v,p=0){if(!canEnvido())return;state.envido=[v];state.envidoCaller=p;state.pending={kind:'envido',to:1-p,by:p};say('¡'+v+'!');render();if(p===0)aiMove()}
function raises(){const e=state.envido;if(e.includes('Falta envido'))return [];const out=[];if(e.filter(x=>x==='Envido').length<2&&!e.includes('Real envido'))out.push('Envido');if(!e.includes('Real envido'))out.push('Real envido');out.push('Falta envido');return out}
function raiseEnvido(v){if(!state.pending||state.pending.kind!=='envido'||state.pending.to!==0||!raises().includes(v))return;state.envido.push(v);state.pending={kind:'envido',to:1,by:0};say('¡'+v+'!');render();aiMove()}
function envidoStake(){if(state.envido.includes('Falta envido')){const lead=Math.max(...state.scores);return lead<state.target/2?state.target:state.target-lead}return state.envido.reduce((a,v)=>a+(v==='Envido'?2:3),0)}
function envidoDeclined(){if(state.envido.length<=1)return 1;return state.envido.slice(0,-1).reduce((a,v)=>a+(v==='Envido'?2:v==='Real envido'?3:0),0)||1}
function callFlor(p){if(!canFlor(p))return;state.florDone=true;state.envidoDone=true;const both=hasFlor(state.hands[1-p]);if(both){state.pending={kind:'flor',to:1-p,by:p};say('¡Flor!');render();if(p===0)aiMove()}else{say('¡Flor!');points(p,3,p===0?'¡Tu flor!':'Flor de Don Truco');if(!state.ended&&state.turn===1)aiMove()}}
function respond(yes){const s=state,p=s.pending;if(!p)return;const who=p.to;s.pending=null;say(yes?'¡Quiero!':'¡No quiero!');if(p.kind==='truco'){if(yes){s.truco=p.level;s.trucoCaller=p.by;notify('Truco querido: '+s.truco+' puntos')}else{endHand(p.by,p.level-1);return}}else if(p.kind==='envido'){s.envidoDone=true;const winner=yes?(envido(s.hands[0])===envido(s.hands[1])?s.mano:envido(s.hands[0])>envido(s.hands[1])?0:1):p.by;const n=yes?envidoStake():envidoDeclined();const msg=yes?'Envido: vos '+envido(s.hands[0])+' · Don Truco '+envido(s.hands[1]):'Envido no querido';if(points(winner,n,msg))return}else if(p.kind==='flor'){const winner=yes?(florValue(s.hands[0])===florValue(s.hands[1])?s.mano:florValue(s.hands[0])>florValue(s.hands[1])?0:1):p.by;if(points(winner,yes?3:3,'Flor'))return}render();if(s.turn===1)aiMove()}
function fold(){if(state.pending||state.ended)return;endHand(1,state.truco)}
$('begin').onclick=start;$('theme').onchange=e=>document.body.classList.toggle('gold',e.target.value==='gold');$('voice').onclick=()=>{voice=!voice;$('voice').textContent='🔊 Voces: '+(voice?'Sí':'No');if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel()};$('fx').onclick=()=>{fx=!fx;$('fx').textContent='♣ Efectos: '+(fx?'Sí':'No')};$('music').onclick=()=>{music=!music;$('music').textContent='♫ Música: '+(music?'Sí':'No');clearInterval(musicTimer);if(music)musicLoop()};document.addEventListener('keydown',e=>{if(!state.ready||state.ended||state.pending||state.turn!==0)return;const i=Number(e.key)-1;if(i>=0&&i<3)play(0,i)});render();
})();
</script></body></html>
