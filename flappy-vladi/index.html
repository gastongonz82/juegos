function flap(){if(on&&!paused){v=cfg().flap;window.VladiSound?.play('jump')}}function clearP(){pipes.forEach(p=>{p.t.remove();p.b.remove()});pipes=[]}
function add(){let D=d(),c=cfg(),gap=D.h*c.gap,min=Math.max(72,D.h*.07),usable=D.h-D.ground-gap-min*2,top=min+Math.random()*Math.max(25,usable),x=D.w+30,t=document.createElement('div'),b=document.createElement('div');t.className='pipe top';b.className='pipe bottom';t.style.height=top+'px';b.style.height=(D.h-D.ground-top-gap)+'px';b.style.bottom=D.ground+'px';box.append(t,b);pipes.push({x,top,gap,t,b,pass:false})}
function draw(){hero.style.top=y+'px';hero.style.transform='rotate('+Math.max(-14,Math.min(32,v*.055))+'deg)';pipes.forEach(p=>{p.t.style.left=p.x+'px';p.b.style.left=p.x+'px'})}
function hit(p){let D=d(),x=D.w*D.hx+D.hw*.18,yy=y+D.hw*.18,w=D.hw*.64,h=D.hw*.58;return x+w>p.x&&x<p.x+D.pw&&(yy<p.top||yy+h>p.top+p.gap)}
function start(){window.VladiSound?.play('start');clearP();score=0;se.textContent=0;let D=d();y=D.h*.43;v=-65;next=2.35;ov.className='overlay hidden';on=true;paused=false;pb.textContent='Ⅱ';pl.classList.add('hidden');last=performance.now();g.focus();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function menu(){on=false;cancelAnimationFrame(raf);clearP();ov.className='overlay';ov.innerHTML='<section class="welcomeCard"><div class="welcomeGrid"><div class="brand"><div class="gameBadge">🌴 AVENTURA TROPICAL</div><div class="flappy">FLAPPY</div><div class="vladi">VLADI</div><div class="handle">@vladyerik</div><button id="start2" type="button" class="play">▶ JUGAR</button><div class="menuRecord">🏆 RÉCORD '+best+'</div><div class="miniHint">TOCÁ / ESPACIO PARA VOLAR</div></div><div class="welcomeHero"><img class="preview" src="assets/vladi_final.png" alt="Vladi"></div></div></section>';document.querySelector('#start2').onclick=e=>{e.stopPropagation();start()}}
function end(){if(!on)return;window.VladiSound?.play('gameover');on=false;cancelAnimationFrame(raf);best=Math.max(best,score);try{localStorage.setItem('flappyVladiBest',String(best))}catch(e){}be.textContent='👑 RÉCORD '+best;ov.className='overlay';let medal=score>=40?'🏆 CAMPEÓN':score>=25?'🥇 ORO':score>=12?'🥈 PLATA':score>=5?'🥉 BRONCE':'🌴 SEGUÍ VOLANDO';ov.innerHTML='<section class="result"><h1>GAME OVER</h1><div class="medal">'+medal+'</div><br><img class="resultHero gameOverHero" src="assets/vladi_gameover.png" alt="Vladi"><div class="stats"><span>PUNTAJE<b>'+score+'</b></span><span>RÉCORD<b>'+best+'</b></span></div><div class="resultActions"><button id="again" type="button" class="again">↻ VOLVER A JUGAR</button><br><button id="home" type="button" class="home">⌂ MENÚ PRINCIPAL</button></div><div class="tag">@vladyerik</div></section>';document.querySelector('#again').onclick=e=>{e.stopPropagation();start()};document.querySelector('#home').onclick=e=>{e.stopPropagation();menu()}}
function loop(t){if(!on)return;if(paused){last=t;raf=requestAnimationFrame(loop);return}let dt=Math.min(.03,(t-last)/1000);last=t;let D=d(),c=cfg();v+=c.grav*dt;y+=v*dt;next-=dt;if(next<=0){add();next=c.spawn}for(let p of pipes){p.x-=D.w*c.speed*dt;if(!p.pass&&p.x+D.pw<D.w*D.hx){p.pass=true;score++;window.VladiSound?.play('collect');se.textContent=score}if(hit(p)){draw();end();return}}pipes.filter(p=>p.x<-150).forEach(p=>{p.t.remove();p.b.remove()});pipes=pipes.filter(p=>p.x>=-150);if(y<0||y+D.hw>D.h-D.ground){draw();end();return}draw();raf=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=e=>{e.stopPropagation();start()};pb.onclick=e=>{e.stopPropagation();if(!on)return;paused=!paused;window.VladiSound?.play(paused?'pause':'resume');pl.classList.toggle('hidden',!paused);pb.textContent=paused?'▶':'Ⅱ'};g.addEventListener('pointerdown',e=>{if(!e.target.closest('button')){e.preventDefault();flap()}});g.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&on&&!paused){paused=true;pl.classList.remove('hidden');pb.textContent='▶'}});window.addEventListener('blur',()=>{if(on&&!paused){paused=true;pl.classList.remove('hidden');pb.textContent='▶'}});draw()})();
</script>
</body></html>
