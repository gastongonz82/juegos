<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10192b">
<title>Vladi Taekwondo · Arcade</title>
<style>
:root{color-scheme:dark;--ink:#0a1220;--navy:#101b31;--panel:#17253b;--panel2:#20314a;--gold:#f4c45b;--gold2:#ffe6a0;--cream:#fff7e6;--mint:#75d6b3;--red:#ef765e}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0b1425;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--cream);touch-action:none;user-select:none;-webkit-user-select:none}body{position:fixed;inset:0}button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center}
.stat{min-width:92px;padding:9px 14px 8px;border:1px solid #f5d58b55;border-radius:15px;background:linear-gradient(155deg,#263851ed,#101a2cf5);box-shadow:0 6px 18px #02081177,inset 0 1px #fff2;backdrop-filter:blur(9px);text-align:center}
.stat small{display:block;font-size:9px;font-weight:900;letter-spacing:.15em;color:#f7d580;text-transform:uppercase;line-height:1.2}.stat b{display:block;font-size:20px;line-height:1.1;font-weight:900;letter-spacing:-.04em;color:#fff8ec}
.brand{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;color:#f5dca1;font-weight:900;font-size:11px;letter-spacing:.14em;text-shadow:0 2px 6px #0009}.brand-mark{width:25px;height:25px;border:1px solid #ffd97c99;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#44351f,#19263a);color:var(--gold);font-size:13px}
.icon-btn{position:absolute;z-index:4;top:max(13px,env(safe-area-inset-top));width:45px;height:45px;border:1px solid #f5d58b77;border-radius:14px;background:linear-gradient(155deg,#384a5d,#16253b);box-shadow:0 5px 14px #02081180,inset 0 1px #fff3;display:grid;place-items:center;cursor:pointer}.icon-btn:active{transform:translateY(2px)}#sound{right:max(70px,calc(env(safe-area-inset-right) + 70px))}#pause{right:max(14px,env(safe-area-inset-right));font-size:20px}
.beltBadge{position:absolute;z-index:2;top:76px;left:max(18px,env(safe-area-inset-left));padding:7px 11px;border:1px solid #f6d98b55;border-radius:999px;background:#101a2bd9;box-shadow:0 5px 16px #0005;color:#d7eadf;font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(8px)}.beltBadge b{color:#82d4aa}
.lives{position:absolute;z-index:2;top:119px;left:max(20px,env(safe-area-inset-left));color:#fb8273;font-size:17px;font-weight:1000;letter-spacing:.12em;text-shadow:0 2px 9px #0009}
.cue{position:absolute;z-index:2;left:50%;top:23%;transform:translateX(-50%) scale(.96);width:min(285px,66vw);padding:12px 18px 13px;border:1px solid #fff8;border-radius:20px;background:linear-gradient(145deg,#1d3049eF,#101a2bed);box-shadow:0 15px 42px #050d19a8,inset 0 1px #fff3;text-align:center;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none}.cue.show{opacity:1;transform:translateX(-50%) scale(1)}.cueKicker{font-size:9px;font-weight:900;letter-spacing:.18em;color:#f3d48d;text-transform:uppercase}.cueTitle{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:4px;font-size:clamp(17px,3.2vw,24px);font-weight:1000;letter-spacing:.02em}.cueGlyph{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#ffffff13;font-size:20px}.cueTime{margin-top:9px;height:5px;border-radius:999px;background:#ffffff19;overflow:hidden}.cueTime i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#86e1b7,#f5d276);transform-origin:left;transition:transform .06s linear}
.feedback{position:absolute;z-index:2;left:50%;top:43%;transform:translate(-50%,-50%) scale(.85);font-size:clamp(22px,5vw,42px);font-weight:1000;letter-spacing:.05em;color:#fff4d3;text-shadow:0 4px 16px #0014,0 0 24px #ffcf63;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.controls{position:absolute;z-index:3;bottom:max(20px,calc(env(safe-area-inset-bottom) + 13px));left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:stretch;width:min(670px,calc(100% - 34px))}
.action{flex:1;min-width:0;min-height:76px;border:1px solid #ffffff2b;border-radius:19px;background:linear-gradient(155deg,#263951f2,#111c2ef2);box-shadow:0 7px 0 #080f1c,0 12px 22px #0007,inset 0 1px #fff3;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;cursor:pointer;transition:transform .09s,border-color .12s,filter .12s}
.action:hover{border-color:#f5d58b99;filter:brightness(1.12)}.action:active{transform:translateY(4px);box-shadow:0 3px 0 #080f1c,0 6px 12px #0007}
.actionIcon{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:#ffffff12;color:#f5d58b}.actionIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actionName{display:block;font-size:clamp(9px,1.2vw,12px);font-weight:950;letter-spacing:.09em;line-height:1.2}.actionKey{display:block;margin-top:3px;color:#94a7bb;font-size:9px;font-weight:750;letter-spacing:.1em}
#act-block .actionIcon{color:#87d8bd}#act-dodge .actionIcon{color:#86c9f0}#act-kick .actionIcon{color:#ffd277}
.hint{position:absolute;z-index:2;bottom:max(109px,calc(env(safe-area-inset-bottom) + 102px));left:50%;transform:translateX(-50%);padding:6px 11px;border-radius:999px;background:#101a2bcc;color:#d6e0e8;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.panel{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:#07101ccc;backdrop-filter:blur(7px)}.panel[hidden]{display:none}
.card{position:relative;width:min(515px,96vw);max-height:min(91dvh,820px);overflow:auto;border:1px solid #f6d78c99;border-radius:30px;background:linear-gradient(145deg,#1d2d45f7,#0d1729fa 72%);box-shadow:0 28px 90px #000a,inset 0 1px #fff2;color:var(--cream);text-align:center;padding:clamp(21px,4vh,34px) clamp(22px,6vw,48px) clamp(23px,4vh,36px)}
.card:before{content:"";position:absolute;inset:6px;border:1px solid #eac97926;border-radius:24px;pointer-events:none}
.eyebrow{margin:0 0 6px;color:#f2d18a;font-size:10px;letter-spacing:.24em;font-weight:1000;text-transform:uppercase}
.card h1{margin:0;font-size:clamp(32px,8vw,49px);line-height:.98;letter-spacing:-.055em;font-weight:1000;color:#fff7e9;text-shadow:0 3px 16px #e4b44a2b}
.heroWrap{height:clamp(178px,29vh,260px);margin:-2px auto 3px;display:flex;align-items:center;justify-content:center;position:relative}.heroWrap:after{content:"";position:absolute;bottom:7%;width:48%;height:10%;background:#e5ae5532;filter:blur(18px);border-radius:50%}.heroArt{position:relative;z-index:1;height:100%;width:auto;max-width:80%;object-fit:contain;filter:drop-shadow(0 16px 20px #0009);animation:idle 2.8s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.subtitle{max-width:380px;margin:3px auto 12px;color:#cbd5df;font-size:14px;line-height:1.5;font-weight:620}.howto{max-width:365px;margin:0 auto 13px;padding:10px 12px;border:1px solid #f6d78c30;border-radius:15px;background:#ffffff08;text-align:left}.howtoTitle{margin:0 0 6px;color:#f2d18a;font-size:9px;font-weight:1000;letter-spacing:.15em;text-align:center}.howtoRow{display:flex;align-items:center;gap:7px;padding:3px 0;color:#e8edf1;font-size:11px;font-weight:760}.howtoRow b{color:#fff3d2}.howtoArrow{color:#f4c45b;font-weight:1000}.howtoFoot{margin:6px 0 0;color:#9eafbf;font-size:9px;font-weight:700;text-align:center}.miniStats{display:flex;justify-content:center;gap:9px;margin:10px 0 14px}.miniStats span{padding:7px 10px;border-radius:999px;border:1px solid #ffffff18;background:#ffffff09;color:#dce5eb;font-size:10px;font-weight:850;letter-spacing:.045em}
.primary{width:min(100%,350px);min-height:58px;border:1px solid #ffe6a1;border-radius:17px;background:linear-gradient(180deg,#ffd976,#e2a936);box-shadow:0 5px 0 #855d22,0 12px 24px #0005,inset 0 1px #fff9;color:#211b12;font-size:18px;font-weight:1000;letter-spacing:.06em;cursor:pointer}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #855d22,0 5px 12px #0005}
.cardFoot{margin:15px 0 0;color:#91a3b4;font-size:11px;font-weight:700}
.resultLine{margin:10px auto 0;font-size:15px;color:#f2dca9;font-weight:800}
@media(max-width:640px){
 .brand{display:none}
 #sound{left:max(10px,env(safe-area-inset-left));right:auto;top:max(10px,env(safe-area-inset-top))}
 .topbar{top:max(10px,env(safe-area-inset-top));gap:5px;left:50%;width:calc(100% - 130px);justify-content:center}
 .stat{min-width:0;flex:1;padding:7px 6px;border-radius:13px}.stat small{font-size:8px;letter-spacing:.1em}.stat b{font-size:17px}
 .icon-btn{width:41px;height:41px;border-radius:13px}#sound{right:max(60px,calc(env(safe-area-inset-right) + 60px))}#pause{right:max(10px,env(safe-area-inset-right))}
 .beltBadge{top:max(60px,calc(env(safe-area-inset-top) + 53px));left:12px;font-size:9px;padding:6px 9px}
 .lives{top:max(93px,calc(env(safe-area-inset-top) + 86px));left:14px;font-size:15px}
 .cue{top:20%;width:min(280px,72vw);padding:11px 14px;border-radius:17px}
 .controls{bottom:max(14px,calc(env(safe-area-inset-bottom) + 9px));gap:7px;width:calc(100% - 20px)}
 .action{min-height:68px;flex-direction:column;gap:4px;padding:7px 3px;border-radius:15px}
 .actionIcon{width:27px;height:27px;flex-basis:27px;border-radius:9px}.actionIcon svg{width:19px;height:19px}
 .actionName{font-size:8px;letter-spacing:.04em}.actionKey{display:none}
 .hint{bottom:max(91px,calc(env(safe-area-inset-bottom) + 82px));font-size:9px}
 .card{border-radius:25px;padding:20px 20px 23px}.card:before{inset:5px;border-radius:20px}
 .heroWrap{height:clamp(135px,21vh,185px);margin:0 auto}.subtitle{font-size:13px;margin:3px auto 9px}.howto{margin-bottom:9px;padding:8px 10px}.howtoRow{font-size:10px}.howtoFoot{font-size:8px}.miniStats{gap:6px}.miniStats span{font-size:9px}
}
@media(max-height:600px) and (orientation:landscape){
 .brand{font-size:0}.topbar{left:50%;width:auto}.stat{min-width:75px;padding:5px 9px}.stat b{font-size:16px}
 .beltBadge{top:63px}.cue{top:19%;width:220px;padding:8px 12px}.controls{bottom:10px;width:min(540px,56vw);left:auto;right:16px;transform:none;gap:7px}.action{min-height:58px;padding:6px}.actionName{font-size:8px}.hint{bottom:81px;left:calc(100% - 285px);font-size:9px}
 .card{width:min(590px,94vw);padding:16px 25px;display:grid;grid-template-columns:170px 1fr;align-items:center;text-align:left;column-gap:22px}.card h1,.card .eyebrow,.card .subtitle,.card .miniStats,.card .primary,.card .cardFoot,.card .resultLine{grid-column:2}.heroWrap{grid-column:1;grid-row:1/8;height:225px;width:155px;margin:0}.card h1{font-size:34px}.card .eyebrow{margin:0}.card .subtitle{font-size:12px;margin:8px 0}.card .miniStats{justify-content:flex-start;margin:6px 0}.card .primary{min-height:47px}.card .cardFoot,.card .resultLine{margin-top:8px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<canvas id="stage" aria-label="Arena de entrenamiento de Vladi"></canvas>
<div class="brand" aria-hidden="true"><span class="brand-mark">龍</span> VLADI · DOJANG</div>
<div class="topbar" aria-label="Puntaje de la partida">
 <div class="stat"><small>Puntaje</small><b id="score">0</b></div>
 <div class="stat"><small>Ronda</small><b id="round">1</b></div>
 <div class="stat"><small>Racha</small><b id="combo">0×</b></div>
</div>
<div class="beltBadge" id="beltBadge">CINTURÓN <b>VERDE · P. ROJA</b></div>
<div class="lives" id="lives" aria-label="Oportunidades restantes">♥ ♥ ♥</div>
<button class="icon-btn" id="sound" data-sound-toggle aria-label="Silenciar sonidos" title="Sonido">🔊</button>
<button class="icon-btn" id="pause" aria-label="Pausar" title="Pausar">Ⅱ</button>
<div class="cue" id="cue" aria-live="polite"><div class="cueKicker">LEÉ EL MOVIMIENTO</div><div class="cueTitle"><span class="cueGlyph" id="cueGlyph">✦</span><span id="cueTitle">PREPARATE</span></div><div class="cueTime"><i id="cueBar"></i></div></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="hint" id="hint">Respondé al gesto del compañero · A / S / D</div>
<div class="controls" id="controls">
 <button class="action" id="act-block" data-action="block" aria-label="Bloquear, tecla A">
  <span class="actionIcon"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.2 8.2-8 10-4.8-1.8-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg></span><span><span class="actionName">BLOQUEAR</span><span class="actionKey">A · BLOQUEAR</span></span>
 </button>
 <button class="action" id="act-dodge" data-action="dodge" aria-label="Saltar, tecla S">
  <span class="actionIcon"><svg viewBox="0 0 24 24"><path d="M12 4v15M6 13l6 6 6-6"/><path d="M4 5h4M16 5h4"/></svg></span><span><span class="actionName">SALTO</span><span class="actionKey">S · SALTO</span></span>
 </button>
 <button class="action" id="act-kick" data-action="kick" aria-label="Atacar, tecla D">
  <span class="actionIcon"><svg viewBox="0 0 24 24"><path d="M4 18h6l2-5 3-2 2-5 3 1-1 5 3 2-2 3-6-1-2 5H4Z"/><path d="M3 6h5M3 10h3"/></svg></span><span><span class="actionName">ATAQUE</span><span class="actionKey">D · ATAQUE</span></span>
 </button>
</div>
<section class="panel" id="panel" aria-modal="true" role="dialog" aria-labelledby="panelTitle">
 <div class="card">
  <p class="eyebrow" id="panelEyebrow">ARCADE DE ARTES MARCIALES</p>
  <h1 id="panelTitle">VLADI<br>TAEKWONDO</h1>
  <div class="heroWrap"><img class="heroArt" id="heroArt" src="./assets/vladi-fighter.webp" alt="Vladi preparado para entrenar taekwondo"></div>
  <p class="subtitle" id="panelText">Mirá qué movimiento anuncia el compañero y elegí la respuesta correcta antes de que se acabe el tiempo.</p>
  <div class="howto" aria-label="Cómo jugar"><p class="howtoTitle">CUANDO VEAS…</p><div class="howtoRow"><b>GOLPE</b><span class="howtoArrow">→</span><span>BLOQUEAR</span></div><div class="howtoRow"><b>BARRIDO</b><span class="howtoArrow">→</span><span>SALTO</span></div><div class="howtoRow"><b>ABERTURA</b><span class="howtoArrow">→</span><span>ATAQUE</span></div><p class="howtoFoot">3 oportunidades · 5 movimientos por ronda · A / S / D en PC</p></div>
  <div class="miniStats" id="miniStats"><span>🥋 Cinturón verde · punta roja</span><span>📱 Táctil y teclado</span></div>
  <button class="primary" id="start">▶&nbsp; EMPEZAR ENTRENAMIENTO</button>
  <p class="cardFoot" id="panelFoot">Récord: <b id="best">0</b> · 3 oportunidades</p>
  <p class="resultLine" id="resultLine" hidden></p>
 </div>
</section>
<script src="../game-audio.js"></script>
<script src="../music/vladi-taekwondo.js?v=1"></script>
<script src="../game-music.js?v=4"></script>
<script src="./game.js?v=4"></script>
</body>
</html>
