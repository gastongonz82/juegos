name: Notify search engines with IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "**/*.html"
      - "sitemap.xml"
      - "*.txt"
      - ".github/workflows/indexnow.yml"

permissions:
  contents: read

jobs:
  submit-updated-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sitemap
        uses: actions/checkout@v4

      - name: Submit site URLs to IndexNow
        env:
          INDEXNOW_KEY: 529a9832c2749fd8c70ed5c52023d070
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          with open(f"{key}.txt", encoding="utf-8") as f:
              hosted_key = f.read().strip()
          if hosted_key != key:
              raise SystemExit("IndexNow key file does not match the configured key")

          root = ET.parse("sitemap.xml").getroot()
          urls = [
              node.text.strip()
              for node in root.findall(".//{*}loc")
              if node.text and node.text.strip().startswith("https://vladyerik.com/")
          ]
          if not urls:
              raise SystemExit("No vladyerik.com URLs found in sitemap.xml")
          if len(urls) > 10000:
              raise SystemExit("IndexNow allows at most 10,000 URLs per request")

          with open("/tmp/indexnow-payload.json", "w", encoding="utf-8") as f:
              json.dump({"host": "vladyerik.com", "key": key, "urlList": urls}, f)
          print(f"Submitting {len(urls)} URLs from sitemap.xml")
          PY

          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow-payload.json)"
          cat /tmp/indexnow-response.txt
          case "$status" in
            200|202) echo "IndexNow accepted the submission (HTTP $status)." ;;
            *) echo "IndexNow submission failed (HTTP $status)." >&2; exit 1 ;;
          esac
