<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Duo Drive · VLADYERIK</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#63c9f7;font-family:system-ui,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;justify-content:space-between;color:white;text-shadow:2px 3px #573817;font-weight:1000;font-size:clamp(18px,4vw,32px);pointer-events:none}.score{background:#f58213;border:5px solid #763915;border-radius:22px;padding:3px 15px}.bottom{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}.controls{display:flex;gap:10px}button{touch-action:none;user-select:none;border:3px solid #fff9;border-radius:16px;background:linear-gradient(#ffdf65,#f47c15);box-shadow:0 5px 0 #92430b;color:#3d210c;font-weight:1000;font-size:20px;padding:13px 19px;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #92430b}.panel{position:absolute;inset:0;background:#15283b99;display:flex;align-items:center;justify-content:center;padding:20px}.panel>div{max-width:420px;width:100%;text-align:center;border:6px solid #fff2a2;border-radius:30px;background:linear-gradient(#ffb933,#f47c16);box-shadow:0 15px 0 #77380f;padding:24px;color:#4a260b}.panel h1{font-size:clamp(32px,7vw,54px);line-height:1;margin:0 0 14px;text-shadow:2px 3px #fff5}.panel p{font-weight:800}.panel button{margin:5px}.hidden{display:none!important}.topbtn{position:absolute;top:60px;right:12px;padding:7px 12px;font-size:15px}.back{position:absolute;top:60px;left:12px;color:white;font-weight:bold;text-decoration:none;background:#142b54bb;border-radius:12px;padding:10px}#boost{background:linear-gradient(#baff76,#2bd341)}@media(min-width:800px){.bottom{max-width:950px;margin:auto}}</style></head><body><canvas id="game"></canvas><div class="hud"><span id="clock">TIME 60</span><span class="score">POINTS <span id="score">0000</span></span></div><a class="back" href="../arcade.html">← ARCADE</a><button class="topbtn" id="pause">Ⅱ</button><div class="bottom"><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><button id="boost">⚡ BOOST</button></div><section class="panel" id="panel"><div><h1>DUO DRIVE</h1><p>Elegí tu vehículo · juntá monedas y esquivá obstáculos hasta la meta.</p><button id="car">🚙 AUTO</button><button id="moto">🏍 MOTO</button><p>PC: ← → / A D · Espacio: turbo · P: pausa</p></div></section><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';const T=window.THREE,cv=document.querySelector('#game'),renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x66cdfa);renderer.shadowMap.enabled=false;const scene=new T.Scene();scene.background=new T.Color(0x65cdf7);scene.fog=new T.Fog(0x65cdf7,75,235);const camera=new T.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);scene.add(new T.HemisphereLight(0xffffff,0x68a73d,2.3));const sun=new T.DirectionalLight(0xfff3bb,2.1);sun.position.set(-25,45,30);scene.add(sun);const mat=(c)=>new T.MeshLambertMaterial({color:c});const road=mat(0xd7b27c),grass=mat(0x51d93e),red=mat(0xff5547),white=mat(0xffffff),blue=mat(0x25a5dc),brown=mat(0x885127),leaf=mat(0x20c76b),gold=new T.MeshPhongMaterial({color:0xffb400,shininess:95,emissive:0x8d4400,emissiveIntensity:.25}),green=new T.MeshPhongMaterial({color:0x04f557,emissive:0x00aa22,emissiveIntensity:.3});function box(w,h,d,m,x,y,z,parent=scene){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}function cyl(r,h,m,x,y,z,parent=scene){let o=new T.Mesh(new T.CylinderGeometry(r,r,h,9),m);o.position.set(x,y,z);parent.add(o);return o}function cone(r,h,m,x,y,z,parent=scene){let o=new T.Mesh(new T.ConeGeometry(r,h,7),m);o.position.set(x,y,z);parent.add(o);return o}box(400,.1,400,grass,0,-.25,-75);box(13,.12,400,road,0,0,-75);for(let z=18;z>-210;z-=5){box(.2,.04,2.4,white,0,.09,z);for(let s of [-1,1]){box(1,.07,2.5,Math.floor(z/5)%2?red:white,s*6.9,.1,z);box(.3,.65,2.6,blue,s*8,.48,z);if(Math.round(z)%10===8)box(.23,1.25,.23,brown,s*8,.8,z);}}function tree(x,z){let g=new T.Group();g.position.set(x,0,z);cyl(.37,3.5,brown,0,1.75,0,g);for(let k=0;k<3;k++){let o=new T.Mesh(new T.SphereGeometry(2.1-k*.25,7,6),leaf);o.position.set((k%2?-.5:.4),4+k*.7,0);g.add(o)}scene.add(g)}function house(x,z){let g=new T.Group();g.position.set(x,0,z);box(7,5,7,mat(0xffefbb),0,2.5,0,g);let roof=cone(6,4,mat(0xa9602d),0,7,0,g);roof.rotation.y=Math.PI/4;box(1.5,3,.12,brown,0,1.5,3.56,g);box(1.2,1.3,.13,blue,-2,3.5,3.56,g);scene.add(g)}for(let z=5;z>-205;z-=14){tree(-14-(Math.floor(-z)%3)*2,z);tree(15,z-7);if(Math.floor(-z/14)%3===0)house(22,z-7)}const world=new T.Group();scene.add(world);const track=new T.Group();scene.add(track);for(const obj of [...scene.children]){if(obj.isMesh&&obj.geometry?.type==='BoxGeometry'&&obj.position.z<20&&obj.position.z>-210&&obj!==vehicle){} }const pickups=[];for(let i=0;i<26;i++){let z=-15-i*8,x=[-3.7,0,3.7][i%3],g=new T.Group();g.position.set(x,1.3,z);let ring=new T.Mesh(new T.TorusGeometry(.8,.24,8,16),i%4===0?green:gold);g.add(ring);world.add(g);pickups.push({g,x,z,type:i%4===0?'boost':'coin',taken:false})}const obstacles=[];for(let i=0;i<14;i++){let z=-32-i*13,x=[-3.6,0,3.6][(i*7)%3];let g=new T.Group();g.position.set(x,0,z);box(1.5,1.4,1.5,mat(0xe75828),0,.7,0,g);box(1.55,.2,1.55,white,0,1.45,0,g);world.add(g);obstacles.push({g,x,z,hit:false})}const vehicle=new T.Group();scene.add(vehicle);function wheel(x,y,z,r,parent){let m=new T.Mesh(new T.CylinderGeometry(r,r,.45,14),mat(0x202124));m.rotation.z=Math.PI/2;m.position.set(x,y,z);parent.add(m)}function buildVehicle(type){while(vehicle.children.length)vehicle.remove(vehicle.children[0]);if(type==='car'){box(2.8,1.2,3.7,mat(0xffd21e),0,1.05,0,vehicle);box(2.3,1.2,2,mat(0xffdb27),0,2,0,vehicle);box(2.35,.65,.1,mat(0x9eeaff),0,2.1,-1.02,vehicle);for(let x of [-1.4,1.4])for(let z of [-1.15,1.15])wheel(x,.6,z,.7,vehicle);for(let x of [-.85,.85])box(.55,.4,.12,mat(0xfff6a0),x,1.2,-1.9,vehicle)}else{wheel(0,.75,-1.2,.78,vehicle);wheel(0,.75,1.15,.78,vehicle);box(.65,.45,2.5,mat(0xff9114),0,1.2,0,vehicle);box(.7,.2,.9,mat(0x222222),0,1.65,.3,vehicle);cyl(.37,1.1,mat(0xffffff),0,2.15,.4,vehicle);let helmet=new T.Mesh(new T.SphereGeometry(.63,12,9),mat(0xffa51a));helmet.position.set(0,3,.2);vehicle.add(helmet);box(1.7,.13,.16,mat(0x333333),0,2.05,-.95,vehicle);box(.75,.12,.8,white,0,2.6,.5,vehicle)}}let mode='moto',active=false,paused=false,elapsed=0,points=0,distance=0,lane=0,velocity=0,boost=0,held={left:false,right:false,boost:false};const panel=document.querySelector('#panel');function start(m){mode=m;buildVehicle(mode);active=true;paused=false;elapsed=0;points=0;distance=0;lane=0;boost=0;for(let p of pickups){p.taken=false;p.g.visible=true}for(let o of obstacles){o.hit=false;o.g.visible=true}panel.classList.add('hidden')}function end(){active=false;panel.classList.remove('hidden');panel.querySelector('h1').textContent='FINISH!';panel.querySelector('p').textContent='PUNTOS '+points+' · Elegí un vehículo para volver a jugar'}document.querySelector('#car').onclick=()=>start('car');document.querySelector('#moto').onclick=()=>start('moto');function toggle(){if(!active)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'}document.querySelector('#pause').onclick=toggle;for(let k of ['left','right','boost']){let el=document.querySelector('#'+k);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);held[k]=true});for(let event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>held[k]=false)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&!e.repeat)toggle();if(['ArrowLeft','KeyA'].includes(e.code))held.left=true;if(['ArrowRight','KeyD'].includes(e.code))held.right=true;if(e.code==='Space')held.boost=true});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))held.left=false;if(['ArrowRight','KeyD'].includes(e.code))held.right=false;if(e.code==='Space')held.boost=false});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?76:64;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000);last=now;if(active&&!paused){elapsed+=dt;let steer=(held.right?1:0)-(held.left?1:0);velocity+=(steer*6.8-velocity*7)*dt;lane=T.MathUtils.clamp(lane+velocity*dt,-4.6,4.6);if(held.boost&&boost>0)boost=Math.max(0,boost-dt);let speed=held.boost&&boost>0?68:45;distance+=dt*speed;vehicle.position.set(lane,0,5);for(const child of scene.children){if(child.isMesh&&child.geometry?.type==='BoxGeometry'&&child.position.z<19&&child.position.z>-210&&child.position.y<2&&child.position.z!==-75){child.position.z+=dt*speed;if(child.position.z>22)child.position.z-=230}if(child.isGroup&&child!==world&&child!==vehicle&&child!==track){child.position.z+=dt*speed;if(child.position.z>30)child.position.z-=224}}vehicle.rotation.z=T.MathUtils.lerp(vehicle.rotation.z,-velocity*.055,.12);vehicle.rotation.y=T.MathUtils.lerp(vehicle.rotation.y,-velocity*.035,.12);for(let p of pickups){p.g.position.z=p.z+distance;p.g.rotation.y+=dt*3;if(!p.taken&&Math.abs(p.g.position.z-5)<1.5&&Math.abs(p.x-lane)<1.4){p.taken=true;p.g.visible=false;if(p.type==='boost')boost=4;else points+=100}}for(let o of obstacles){o.g.position.z=o.z+distance;if(!o.hit&&Math.abs(o.g.position.z-5)<1.6&&Math.abs(o.x-lane)<1.5){o.hit=true;points=Math.max(0,points-150);o.g.visible=false}}document.querySelector('#score').textContent=String(points).padStart(4,'0');document.querySelector('#clock').textContent='TIME '+Math.max(0,Math.ceil(60-elapsed));if(elapsed>=60)end()}let portrait=innerWidth<innerHeight;camera.position.lerp(new T.Vector3(lane*.45,portrait?8.2:7.4,portrait?17.5:16),.13);camera.lookAt(lane*.3,1,-17);renderer.render(scene,camera)}buildVehicle('moto');requestAnimationFrame(frame)})();
</script></body></html>
