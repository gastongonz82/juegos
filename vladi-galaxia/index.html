<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07152e">
  <title>Vladi Galaxia Arcade</title>
  <style>
    :root{color-scheme:dark;--gold:#ffd253;--brown:#391b11;--cream:#fff1c4}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#050b1b;color:white;font-family:system-ui,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
    body{position:fixed;inset:0}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:none;white-space:nowrap}.pill{min-width:76px;padding:7px 12px;border:2px solid #815023;border-radius:15px;background:linear-gradient(#55351f,#271a21);box-shadow:0 4px #140d17,inset 0 1px #fff7b844;text-align:center;text-shadow:0 2px 3px #000}.pill small{display:block;color:#ffdf7a;font-size:10px;line-height:1.1;font-weight:950;letter-spacing:.1em}.pill b{font-size:18px;line-height:1.1;font-weight:1000}.hud.hidden,.hidden{display:none!important}
    .topbtn,#soundToggle{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));width:46px;height:46px;display:grid;place-items:center;border:3px solid #713c1c;border-radius:14px;background:linear-gradient(#b87940,#673619);box-shadow:0 4px #32190d;color:white;font-size:20px;line-height:1;touch-action:manipulation;cursor:pointer}.topbtn{right:max(12px,env(safe-area-inset-right));font-weight:1000}#soundToggle{left:max(12px,env(safe-area-inset-left));font-size:17px}
    .panel{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:18px;background:#0207189c;backdrop-filter:blur(6px)}.card{width:min(470px,94vw);max-height:92dvh;overflow:auto;border:5px solid #815023;border-radius:28px;background:linear-gradient(150deg,#fff2c9,#ffc64c 88%);color:#3e2112;text-align:center;padding:clamp(18px,4vw,30px);box-shadow:0 8px #27130b,0 24px 70px #0009}.eyebrow{margin:0 0 5px;color:#8c481b;font-size:12px;letter-spacing:.2em;font-weight:1000}.card h1{margin:0;font-size:clamp(32px,8vw,48px);line-height:.98;font-weight:1000;letter-spacing:-.045em;color:#35221a;text-shadow:0 2px #ffe088}.hero{width:min(100%,300px);height:clamp(135px,24vh,190px);margin:0 auto}.card p{margin:8px 0 16px;font-size:15px;font-weight:800;line-height:1.4}.play{width:min(100%,330px);min-height:62px;border:5px solid #07551e;border-radius:22px;background:linear-gradient(#7bf34a,#16b72d);box-shadow:0 6px #073e18;color:white;font-size:clamp(22px,6vw,30px);font-weight:1000;touch-action:manipulation}.play:active{transform:translateY(3px)}.hint{font-size:12px!important;margin:12px 0 0!important;color:#64472a}.best{margin:8px 0 0;color:#805016;font-weight:900;font-size:13px}.help{position:absolute;z-index:2;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:8px 13px;border:1px solid #a6c6ff55;border-radius:18px;background:#111932a8;color:#e5edff;font-size:12px;font-weight:800;text-align:center;white-space:nowrap;pointer-events:none}
    @media(max-width:430px){.hud{gap:4px}.pill{min-width:61px;padding:6px 8px;border-radius:12px}.pill small{font-size:9px}.pill b{font-size:16px}.topbtn,#soundToggle{width:42px;height:42px;border-radius:12px}.help{font-size:11px;bottom:max(10px,env(safe-area-inset-bottom))}}
    @media(orientation:landscape) and (max-height:560px){.panel{padding:8px}.card{width:min(700px,96vw);max-height:95dvh;padding:12px 22px;display:grid;grid-template-columns:170px 1fr;grid-template-rows:auto auto auto auto;column-gap:14px;align-items:center}.hero{grid-column:1;grid-row:1/5;width:160px;height:150px}.eyebrow,.card h1,.card p,.play,.hint,.best{text-align:left;grid-column:2}.eyebrow,.card h1{margin:0}.card p{font-size:13px;margin:3px 0}.play{min-height:48px;width:min(100%,300px);justify-self:start}.hint,.best{margin-top:3px!important}.hud{left:50%;gap:5px}.pill{min-width:62px;padding:5px 8px}.pill b{font-size:16px}.pill small{font-size:9px}.topbtn,#soundToggle{width:40px;height:40px}}
  </style>
  <link rel="stylesheet" href="../arcade-ui.css?v=3caf1eaf">
  <script src="../arcade-ui.js?v=f08ad087 defer></script>
</head>
<body>
  <button id="soundToggle" data-sound-toggle type="button" aria-label="Silenciar sonidos">🔊</button>
  <canvas id="game" aria-label="Mueve la nave de Vladi para esquivar y disparar a los enemigos espaciales"></canvas>
  <div id="hud" class="hud hidden" aria-live="polite">
    <div class="pill"><small>PUNTOS</small><b id="score">0</b></div>
    <div class="pill"><small>OLEADA</small><b id="wave">1</b></div>
    <div class="pill"><small>NAVE</small><b id="lives">♥♥♥</b></div>
  </div>
  <button id="pause" class="topbtn hidden" type="button" aria-label="Pausar">Ⅱ</button>
  <div id="help" class="help hidden">Movete con ← → o A D · en celular arrastrá la nave · tiro automático</div>
  <div id="panel" class="panel"><section class="card">
    <p class="eyebrow">ARCADE ESPACIAL</p><h1 id="panelTitle">VLADI GALAXIA</h1>
    <canvas id="hero" class="hero" aria-label="Vladi pilotea una nave espacial"></canvas>
    <p id="panelText">Surcá la galaxia, esquivá meteoritos y defendé la nave de las flotas enemigas.</p>
    <button id="start" class="play" type="button">▶ JUGAR</button>
    <p id="hint" class="hint">La nave dispara sola. Cada tres oleadas aparece un jefe.</p>
    <p class="best">Récord: <span id="menuBest">0</span></p>
  </section></div>
  <script src="../game-audio.js?v=3"></script>
<script src="../music/vladi-galaxia.js?v=1"></script>
<script src="../game-music.js?v=4"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
