<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Metro Rush — Arcade Prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8de2ff;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;color:white;text-shadow:0 2px 5px #1238;font-weight:900;pointer-events:none;font-size:clamp(14px,3vw,21px)}#hud b{color:#ffe15b}button{border:0;background:#143858d9;color:white;font-weight:900;border-radius:15px;padding:12px 17px;cursor:pointer}#pause{pointer-events:auto}#overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:linear-gradient(#1239,#163b5acc);color:white;text-align:center;padding:22px}#panel{background:#0d3455ed;border:2px solid #ffe26d;border-radius:28px;max-width:430px;padding:28px;box-shadow:0 20px 70px #0028}h1{font-size:clamp(36px,8vw,62px);line-height:.9;margin:0 0 20px;color:#ffe15b;text-shadow:3px 4px #ee724a}p{line-height:1.5}#start{background:linear-gradient(#ffcf38,#f47b29);font-size:23px;color:#20324b;padding:15px 36px;box-shadow:0 5px #bd541d}#help{font-size:13px;opacity:.9}#message{position:fixed;top:28%;width:100%;text-align:center;color:#fff;font-weight:1000;font-size:40px;text-shadow:0 3px 8px #1239;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body><div id="hud"><div>🏃 <span id="meters">0</span> m<br>🪙 <b id="coins">0</b></div><div>🏆 <span id="best">0</span></div><button id="pause" aria-label="Pausar">Ⅱ</button></div><div id="message"></div><div id="overlay"><div id="panel"><h1>METRO<br>RUSH</h1><p>¡Corré entre trenes, saltá barreras y juntá monedas!</p><p id="help">📱 Deslizá para moverte, saltar y agacharte.<br>⌨️ Flechas o WASD. Espacio para saltar.</p><button id="start">JUGAR</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x86dcff);scene.fog=new T.Fog(0x86dcff,65,205);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,450);camera.position.set(0,6.6,12);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x5d99a5,2));const sun=new T.DirectionalLight(0xffe4ae,2.8);sun.position.set(-18,30,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-65;scene.add(sun);
const mat=(c,metal=0)=>new T.MeshStandardMaterial({color:c,roughness:.75,metalness:metal}),M={track:mat(0x5e6c7c),stone:mat(0x9ea5b2),rail:mat(0xc6d2db,.55),wood:mat(0x664b38),blue:mat(0x178bd0),yellow:mat(0xffd23d),red:mat(0xef5347),skin:mat(0xffc08c),pants:mat(0x24436d),shoe:mat(0xf5f3ec),glass:mat(0x243c62,.3),green:mat(0x32ba78),coin:new T.MeshStandardMaterial({color:0xffd42b,metalness:.72,roughness:.23,emissive:0xb06b00,emissiveIntensity:.25})};
const cube=(p,m,x,y,z,w,h,d)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o},ball=(p,m,x,y,z,w,h,d)=>{const o=new T.Mesh(new T.SphereGeometry(1,12,8),m);o.position.set(x,y,z);o.scale.set(w,h,d);o.castShadow=true;p.add(o);return o};
const laneX=i=>(i-1)*3.6;const world=new T.Group();scene.add(world);
cube(world,mat(0x90acb7),0,-.5,-85,110,1,260);
for(let i=0;i<3;i++){cube(world,M.track,laneX(i),.01,-85,3.25,.14,260);for(let side of [-1,1])cube(world,M.rail,laneX(i)+side*1.07,.19,-85,.14,.15,260)}
const sleepers=[];for(let z=8;z>-165;z-=2.8){const group=new T.Group();world.add(group);for(let i=0;i<3;i++)cube(group,M.wood,laneX(i),.11,0,2.9,.16,.38);group.position.z=z;sleepers.push(group)}
const scenery=[];for(let n=0;n<48;n++){const g=new T.Group();world.add(g);const side=n%2?-1:1;const col=[0xffa75e,0xffd77e,0x6bcac6,0xe8819d,0x9c9de2][n%5],h=9+(n*7%14);cube(g,mat(col),0,h/2,0,6+(n%3)*2,h,8);for(let floor=2;floor<h-1;floor+=3)for(let x=-2;x<=2;x+=2)cube(g,M.glass,x,floor,side===1?-4.05:4.05,1.15,1.55,.12);cube(g,mat(0xf6e4be),0,h+.5,0,7.5,.65,9);g.position.set(side*(13+(n%3)*5),0,8-n*6);scenery.push(g)}
const player=new T.Group();scene.add(player);const runner=new T.Group();player.add(runner);
ball(runner,M.pants,0,1.1,0,.52,.67,.35);ball(runner,M.yellow,0,2.12,0,.65,.72,.42);ball(runner,M.skin,0,3.05,0,.43,.48,.42);ball(runner,M.red,0,3.47,-.08,.49,.21,.48);cube(runner,M.red,0,3.42,-.45,.75,.12,.55);
for(let s of [-1,1]){const arm=ball(runner,M.skin,s*.72,2.04,0,.22,.64,.24);arm.userData.limb=s;const leg=ball(runner,M.pants,s*.28,.59,0,.25,.62,.26);leg.userData.leg=s;ball(runner,M.shoe,s*.28,.17,-.14,.33,.2,.52)}
const obstacles=[],coins3d=[];let lane=1,vy=0,jump=0,slide=0,meters=0,score=0,speed=19,spawnT=0,coinT=0,playing=false,paused=false,dead=false,prev=performance.now();
const el=id=>document.getElementById(id);el('best').textContent=localStorage.getItem('metroRushBest')||0;
function train(l,z){const g=new T.Group();world.add(g);const body=cube(g,mat([0xf7b830,0x2b96d0,0xe85359][Math.floor(Math.random()*3)]),0,2.55,0,3.05,4.7,11);ball(g,M.glass,0,3.65,5.55,1.12,1.03,.1);for(let x of [-1.1,1.1])ball(g,M.yellow,x,1.05,5.56,.19,.2,.13);for(let s of [-1,1])for(let k=-3;k<=3;k+=2.5)cube(g,M.glass,s*1.54,3.2,k,.07,1.4,1.45);g.position.set(laneX(l),0,z);obstacles.push({g,l,type:'train',hit:false})}
function barrier(l,z){const g=new T.Group();world.add(g);cube(g,M.red,0,.82,0,2.75,1.55,.4);for(let x of [-.8,.8])cube(g,M.shoe,x,.83,-.24,.35,.18,.1);g.position.set(laneX(l),0,z);obstacles.push({g,l,type:'barrier',hit:false})}
function coin(l,z,y=1.6){const g=new T.Group();world.add(g);const c=new T.Mesh(new T.TorusGeometry(.52,.19,8,16),M.coin);g.add(c);g.position.set(laneX(l),y,z);coins3d.push({g,l})}
function announce(t){el('message').textContent=t;el('message').style.opacity=1;setTimeout(()=>el('message').style.opacity=0,550)}
function move(dir){if(!playing||paused)return;if(dir==='left')lane=Math.max(0,lane-1);if(dir==='right')lane=Math.min(2,lane+1);if(dir==='up'&&jump<=.01&&slide<=0)vy=9.2;if(dir==='down'&&jump<=.01)slide=.75}
function reset(){for(const a of obstacles)world.remove(a.g);for(const a of coins3d)world.remove(a.g);obstacles.length=0;coins3d.length=0;lane=1;vy=jump=slide=meters=score=spawnT=coinT=0;speed=19;dead=false;paused=false;playing=true;el('overlay').style.display='none';el('pause').textContent='Ⅱ'}
function finish(){playing=false;dead=true;const best=Math.max(Math.floor(meters),Number(localStorage.getItem('metroRushBest')||0));localStorage.setItem('metroRushBest',best);el('best').textContent=best;el('panel').querySelector('h1').innerHTML='FIN DE<br>CARRERA';el('panel').querySelector('p').textContent='Recorriste '+Math.floor(meters)+' m y juntaste '+score+' monedas.';el('start').textContent='REINTENTAR';el('overlay').style.display='flex'}
el('start').onclick=reset;el('pause').onclick=()=>{if(!playing)return;paused=!paused;el('pause').textContent=paused?'▶':'Ⅱ';announce(paused?'PAUSA':'¡VAMOS!')};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))move('left');if(['arrowright','d'].includes(k))move('right');if(['arrowup','w',' '].includes(k))move('up');if(['arrowdown','s'].includes(k))move('down');if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault()});
let touch=null;addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down'));touch=null},{passive:true});
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(playing&&!paused){const dz=speed*dt;meters+=dz*.65;speed=Math.min(38,19+meters*.012);spawnT-=dt;coinT-=dt;
if(spawnT<=0){const l=Math.floor(Math.random()*3);(Math.random()<.52?train:barrier)(l,-145);spawnT=Math.max(.68,1.55-meters*.0005)}
if(coinT<=0){const l=Math.floor(Math.random()*3);for(let k=0;k<4;k++)coin(l,-115-k*2.2);coinT=1.6}
for(const s of sleepers){s.position.z+=dz;if(s.position.z>12)s.position.z-=173.6}
for(const s of scenery){s.position.z+=dz*.78;if(s.position.z>24)s.position.z-=288}
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.g.position.z+=dz;if(o.g.position.z>18){world.remove(o.g);obstacles.splice(i,1);continue}if(!o.hit&&Math.abs(o.g.position.z-3)<(o.type==='train'?5.3:1.05)&&o.l===lane){if(o.type==='train'||jump<1.25){o.hit=true;finish();break}}}
for(let i=coins3d.length-1;i>=0;i--){const c=coins3d[i];c.g.position.z+=dz;c.g.rotation.y+=dt*4;if(c.g.position.z>16){world.remove(c.g);coins3d.splice(i,1);continue}if(Math.abs(c.g.position.z-3)<1.15&&c.l===lane&&Math.abs(jump+1.6-c.g.position.y)<1.35){score++;world.remove(c.g);coins3d.splice(i,1)}}
vy-=23*dt;jump=Math.max(0,jump+vy*dt);if(jump===0)vy=0;slide=Math.max(0,slide-dt);player.position.x+=(laneX(lane)-player.position.x)*Math.min(1,dt*14);player.position.y=jump;runner.scale.y=slide>0?.58:1;runner.position.y=slide>0?-.05:0;runner.rotation.z=Math.sin(now*.012)*.045;for(const part of runner.children)if(part.userData.limb)part.rotation.x=Math.sin(now*.018)*.55*part.userData.limb;el('meters').textContent=Math.floor(meters);el('coins').textContent=score}
camera.position.x+=(player.position.x*.4-camera.position.x)*Math.min(1,dt*3);camera.lookAt(player.position.x*.5,2,-24);renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?75:65;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
