<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLADYERIK ARCADE · Prototipo gabinete</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff;background:#06123d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#163e98,#06123d 75%)}
header{padding:24px 4vw 14px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(28px,4vw,55px);margin:0;font-weight:1000;letter-spacing:-2px}h1 span{color:#39dcff}h1 em{font-style:normal;color:#ffcb32}small{color:#b8c9eb}#status{font-weight:bold;color:#ffcd4b}
nav{display:flex;gap:9px;overflow:auto;padding:10px 4vw 20px}.filter{border:2px solid #4770b8;background:#0b245e;color:white;border-radius:40px;padding:10px 18px;font-size:16px;font-weight:800;white-space:nowrap}.filter.active{border-color:#ffcd32;color:#ffcd32}
main{padding:0 4vw 35px}#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.game{position:relative;min-height:240px;background:#11275d;border:3px solid #2675c2;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;outline:0}.game img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.game:after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#06123d 85%)}.game strong{color:#fff;font-size:17px;font-weight:900;line-height:1.2;text-shadow:0 2px 5px #000,0 0 12px #000!important}.game label{color:#ffdf70}.game strong,.game label{position:relative;z-index:1;text-align:center;text-shadow:0 2px 5px #000;padding:8px}.game label{font-size:12px;color:#ffdf70}.game.selected,.game:focus-visible{border-color:#ffce24;box-shadow:0 0 0 4px #fff,0 0 30px #ffcd35;transform:scale(1.02)}
footer{padding:12px 4vw;color:#b9c8e6}#player{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#player.open{display:flex}#toolbar{background:#091d50;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}button{cursor:pointer}#back{background:#ffc928;color:#111;border:0;border-radius:8px;font-weight:900;padding:11px 20px}iframe{width:100%;flex:1;border:0;background:#000}#empty{padding:20px;color:#ffd257}
</style></head><body>
<header><div><h1><span>VLADI</span><em>YERIK</em> ARCADE</h1><small>PROTOTIPO PARA GABINETE · NO PUBLICADO</small></div><div id="status">Cargando catálogo…</div></header>
<nav id="filters" aria-label="Categorías"></nav><main><section id="games" aria-label="Juegos"></section><p id="empty" hidden></p></main>
<footer>← → ↑ ↓ / WASD: elegir · ENTER: jugar · ESC: volver · Gamepad: cruceta y botón principal (solo menú)</footer>
<div id="player"><div id="toolbar"><strong id="gameTitle"></strong><button id="back">← VOLVER AL ARCADE (ESC)</button></div><iframe id="frame" title="Juego" allow="fullscreen; autoplay; gamepad"></iframe></div>
<script>
(()=>{'use strict';
const root=document.querySelector('#games'), filters=document.querySelector('#filters'),status=document.querySelector('#status'),player=document.querySelector('#player'),frame=document.querySelector('#frame'),back=document.querySelector('#back');
let all=[],shown=[],category='todos',selected=0,playing=false,lastPad=0,priorButtons=[];
const categories={todos:'TODOS',accion:'ACCIÓN',aventura:'AVENTURA',retro:'RETRO',ingenio:'INGENIO',aprender:'EDUCATIVOS',deportes:'DEPORTES',carreras:'CARRERAS',cartas:'CARTAS',casino:'CASINO',mesa:'MESA'};
const catalogURL=new URL('../arcade.html',location.href);
function focusIndex(i){if(!shown.length)return;selected=(i+shown.length)%shown.length;root.querySelectorAll('.game').forEach((el,n)=>el.classList.toggle('selected',n===selected));root.children[selected]?.scrollIntoView({block:'nearest',inline:'nearest'});}
function render(){shown=all.filter(g=>category==='todos'||g.categories.includes(category));root.replaceChildren();shown.forEach((g,i)=>{const b=document.createElement('button');b.className='game';b.type='button';b.setAttribute('aria-label',g.name);if(g.image){const img=document.createElement('img');img.src=g.image;img.alt='';img.loading='lazy';b.append(img)}const name=document.createElement('strong');name.textContent=g.name;const badge=document.createElement('label');badge.textContent='MODALIDAD Y CONTROLES POR VERIFICAR';b.append(name,badge);b.onclick=()=>openGame(i);root.append(b)});document.querySelector('#empty').hidden=shown.length>0;if(!shown.length)document.querySelector('#empty').textContent='No hay juegos en esta categoría.';focusIndex(0);status.textContent=all.length+' juegos detectados';}
function showFilters(){filters.replaceChildren();Object.entries(categories).forEach(([key,label])=>{if(key!=='todos'&&!all.some(g=>g.categories.includes(key)))return;const b=document.createElement('button');b.className='filter'+(key===category?' active':'');b.textContent=label;b.onclick=()=>{category=key;showFilters();render()};filters.append(b)})}
function openGame(i){const g=shown[i];if(!g)return;selected=i;playing=true;player.classList.add('open');document.querySelector('#gameTitle').textContent=g.name;frame.src=g.url;back.focus();}
function closeGame(){if(!playing)return;playing=false;frame.src='about:blank';player.classList.remove('open');focusIndex(selected);}
back.onclick=closeGame;
document.addEventListener('keydown',e=>{if(playing){if(e.key==='Escape'){e.preventDefault();closeGame()}return}if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Enter',' ','w','a','s','d'].includes(e.key)){e.preventDefault();const cols=Math.max(1,Math.round(root.clientWidth/(root.firstElementChild?.offsetWidth||220)));const step=({ArrowRight:1,d:1,ArrowLeft:-1,a:-1,ArrowDown:cols,s:cols,ArrowUp:-cols,w:-cols})[e.key];if(step)focusIndex(selected+step);else openGame(selected)}});
function pollGamepad(t){const pad=navigator.getGamepads?.()[0];if(pad&&!playing){const pressed=pad.buttons.map(x=>x.pressed);const dx=(pad.axes[0]||0),dy=(pad.axes[1]||0);if(t-lastPad>180){let step=0;const cols=Math.max(1,Math.round(root.clientWidth/(root.firstElementChild?.offsetWidth||220)));if(pressed[15]||dx>.65)step=1;else if(pressed[14]||dx<-.65)step=-1;else if(pressed[13]||dy>.65)step=cols;else if(pressed[12]||dy<-.65)step=-cols;if(step){focusIndex(selected+step);lastPad=t}}if((pressed[0]||pressed[9])&&!priorButtons[0])openGame(selected);priorButtons=[pressed[0]||pressed[9]]}requestAnimationFrame(pollGamepad)}requestAnimationFrame(pollGamepad);
fetch(catalogURL).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');all=[...doc.querySelectorAll('a.game-card[href]')].map(a=>{const href=a.getAttribute('href');const name=a.querySelector('h3')?.textContent.trim()||a.dataset.search||'JUEGO';const src=a.querySelector('img.cover-image')?.getAttribute('src');return {name,url:new URL(href,catalogURL).href,image:src?new URL(src,catalogURL).href:null,categories:[a.dataset.category,...(a.dataset.extraCategories||'').split(/\s+/)].filter(Boolean)}}).filter(g=>g.url.startsWith(location.origin+'/')||g.url.startsWith(location.origin+'?'));showFilters();render()}).catch(err=>{status.textContent='Catálogo no disponible';document.querySelector('#empty').hidden=false;document.querySelector('#empty').textContent='Abrí este prototipo desde un servidor local o GitHub Pages, no desde file://. '+err.message});
})();
</script><script src="./controls.js"></script></body></html>
