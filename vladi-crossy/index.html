<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#113b2a">
<title>Vladi Crossy Arcade</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#183d2b;font-family:system-ui,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}body{position:fixed;inset:0;color:#fff}#game{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}.pill{min-width:76px;padding:8px 12px;border:2px solid #43200e;border-radius:15px;background:linear-gradient(#56321d,#321b12);box-shadow:0 4px #21120d;font-weight:900;text-align:center;text-shadow:0 2px 2px #0008}.pill small{display:block;color:#ffe178;font-size:10px;letter-spacing:.08em}.pill b{font-size:20px;line-height:1.05}.icon{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));right:14px;width:46px;height:46px;border:3px solid #4b260f;border-radius:14px;background:linear-gradient(#a96735,#663615);color:white;font-size:23px;font-weight:900;box-shadow:0 4px #351a0c;touch-action:manipulation}.controls{position:absolute;z-index:3;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template:repeat(2,54px)/repeat(2,54px);gap:5px}.controls button{border:2px solid #e9d29e;border-radius:17px;background:#173c46dc;color:white;font-size:25px;font-weight:900;box-shadow:0 4px #09262f;touch-action:manipulation}.controls button:active{transform:translateY(2px);background:#277b80}.controls .up{grid-column:1/3;justify-self:center;width:62px}.panel{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:18px;background:#06150ac7;backdrop-filter:blur(4px)}.card{width:min(440px,94vw);max-height:90dvh;overflow:auto;border:7px solid #633410;border-radius:30px;background:linear-gradient(#fff1bf,#ffc75c);color:#44220f;text-align:center;padding:clamp(20px,5vw,34px);box-shadow:0 9px #32170b}.card h1{margin:0 0 8px;font-size:clamp(32px,9vw,48px);font-weight:1000;letter-spacing:-.04em;color:#50290e}.card p{margin:8px 0 20px;font-size:16px;font-weight:750;line-height:1.4}.hero{height:min(27vh,190px);width:min(100%,150px);background-image:url('../vladi-run/assets/vladi-runner.webp');background-repeat:no-repeat;background-position:left center;background-size:400% 100%;filter:drop-shadow(0 5px 4px #5524004d)}.play{width:min(100%,330px);min-height:68px;border:6px solid #07521d;border-radius:24px;background:linear-gradient(#7af248,#16b72b);box-shadow:0 6px #073c18;color:white;font-size:clamp(23px,7vw,32px);font-weight:1000;touch-action:manipulation}.play:active{transform:translateY(3px)}.hint{font-size:13px!important;margin:14px 0 0!important;color:#56351e}.hidden{display:none!important}@media (min-width:800px){.controls{right:28px;bottom:24px;grid-template:repeat(2,62px)/repeat(2,62px)}.controls button{font-size:28px}.pill{min-width:92px;padding:9px 14px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Vladi cruza caminos esquivando el tráfico"></canvas>
<div id="hud" class="hidden" aria-live="polite"><div class="pill"><small>MEJOR</small><b id="best">0</b></div><div class="pill"><small>CRUCES</small><b id="score">0</b></div><div class="pill"><small>🪙</small><b id="coins">0</b></div></div>
<button id="pause" class="icon hidden" aria-label="Pausar">Ⅱ</button>
<div class="controls hidden" id="controls" aria-label="Controles"><button class="up" data-move="up" aria-label="Avanzar">▲</button><button data-move="left" aria-label="Izquierda">◀</button><button data-move="right" aria-label="Derecha">▶</button><button class="up" data-move="down" aria-label="Retroceder">▼</button></div>
<div class="panel" id="panel"><section class="card"><h1 id="panelTitle">VLADI CROSSY</h1><div class="hero" role="img" aria-label="Vladi listo para cruzar"></div><p id="panelText">¡Cruzá calles y ríos! Esquivá autos, subite a los troncos y llegá cada vez más lejos.</p><button class="play" id="start">▶ JUGAR</button><p class="hint" id="hint">Usá las flechas o los botones para moverte. ¡No te quedes quieto!</p></section></div>
<script src="game.js?v=10"></script>
</body>
</html>
