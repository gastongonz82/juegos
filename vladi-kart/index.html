(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),sprite=new Image();sprite.src='assets/vladi-kart.webp';const $=s=>document.querySelector(s),hud=$('#hud'),overlay=$('#overlay'),title=$('#title'),subtitle=$('#subtitle'),chips=$('#chips'),help=$('#help'),start=$('#start'),pause=$('#pause'),controlBox=$('.controls');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);let W=0,H=0,DPR=1,state='menu',last=0,clock=0,player={lane:0,turn:0},rivals=[],boxes=[],fx=[],distance=0,speed=0,lapLength=560,raceLength=1680,boosts=1,boostTime=0,drift=0,elapsed=0,nextBox=70,collisionWait=0,shake=0,finishPlace=0,best=+(localStorage.getItem('vladiKartBest')||0),toast='',toastEnd=0;const keys={};

function background(t){const g=ctx.createLinearGradient(0,0,0,H*.64);g.addColorStop(0,'#0877d9');g.addColorStop(.68,'#69d1f2');g.addColorStop(1,'#d0f5d6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff3aa';ctx.beginPath();ctx.arc(W*.82,H*.13,Math.min(W,H)*.045,0,7);ctx.fill();for(let i=0;i<5;i++){let x=((i*237-t*.008)%(W+130)+W+130)%(W+130)-65;cloud(x,H*(.12+(i%3)*.06),.7+(i%2)*.3)}poly([[0,H*.36],[W*.1,H*.28],[W*.2,H*.34],[W*.34,H*.25],[W*.48,H*.34],[W*.62,H*.25],[W*.8,H*.33],[W*.92,H*.27],[W,H*.33],[W,H*.56],[0,H*.56]],'#287f50');poly([[0,H*.43],[W*.15,H*.34],[W*.28,H*.4],[W*.44,H*.32],[W*.61,H*.4],[W*.8,H*.32],[W,H*.4],[W,H*.56],[0,H*.56]],'#175f43');
 const hy=H*(H>W*1.15?.28:.3),sh=H*.16;for(const side of [-1,1]){const x=side<0?0:W*.76,w=W*.24;ctx.fillStyle='#e5ecf4';ctx.fillRect(x,hy-sh,w,sh);ctx.fillStyle='#c94d37';ctx.fillRect(x,hy-sh,w,sh*.22);ctx.fillStyle='#3b6187';ctx.fillRect(x,hy-sh*.7,w,sh*.09);ctx.fillStyle='#efcc58';ctx.fillRect(x,hy-sh*.35,w,sh*.08);for(let i=0;i<50;i++){ctx.fillStyle=['#e34c4a','#f1c547','#f4f5ff','#3172cc','#31a875'][i%5];ctx.beginPath();ctx.arc(x+(i%20)*w/20,hy-sh*.52+Math.floor(i/20)*sh*.14,Math.max(1,W*.0015),0,7);ctx.fill()}ctx.fillStyle='#a7332a';ctx.fillRect(x,hy-sh*.1,w,sh*.1)}palm(W*.08,H*.5,.7);palm(W*.92,H*.48,.7);ctx.fillStyle='#3ca94a';ctx.fillRect(0,hy,W,H-hy)}
function road(){const n=64,zMax=500;for(let i=0;i<n;i++){const za=zMax*(1-i/n)**2,zb=zMax*(1-(i+1)/n)**2,a=proj(za),b=proj(zb),odd=Math.floor((distance+zb)/8)%2;ctx.fillStyle=odd?'#318a3d':'#3a9a43';ctx.fillRect(0,a.y,W,b.y-a.y+1);const edgeA=a.half*1.12,edgeB=b.half*1.12;poly([[a.x-edgeA,a.y],[a.x+edgeA,a.y],[b.x+edgeB,b.y],[b.x-edgeB,b.y]],odd?'#fff4df':'#e94b3e');poly([[a.x-a.half,a.y],[a.x+a.half,a.y],[b.x+b.half,b.y],[b.x-b.half,b.y]],odd?'#555f66':'#50585f')}

function itemDraw(it){const z=it.d-distance;if(z<2||z>500)return;const p=proj(z),s=Math.max(8,p.p*44),x=p.x+it.lane*p.half*.73,y=p.y-s*.9+Math.sin(clock/230+it.d)*s*.12;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(clock/380+it.d)*.1);ctx.shadowColor='#32ddff';ctx.shadowBlur=s*.5;poly([[0,-s*.48],[s*.43,-s*.24],[s*.43,s*.24],[0,s*.48],[-s*.43,s*.24],[-s*.43,-s*.24]],'#26c7f3','#e0fbff',2);ctx.shadowBlur=0;ctx.fillStyle='#fff36a';ctx.font=`1000 ${s*.62}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',0,0);ctx.restore()}

function initRivals(){const col=['#d9453e','#38a85a','#edb92e','#9252d2'],helm=['#f0443b','#34aa5d','#f0ba2e','#7b45c4'];rivals=Array.from({length:4},(_,i)=>({d:22+i*14,lane:[-.5,.48,-.05,.72][i],color:col[i],helmet:helm[i],n:String(i+2),v:22.8+i*.9+rand(-.5,.8),stun:0}))}

function showToast(s){toast=s;toastEnd=performance.now()+900}
function begin(){distance=0;speed=0;elapsed=0;lapLength=560;raceLength=lapLength*3;boosts=1;boostTime=0;drift=0;boxes=[];fx=[];nextBox=65;collisionWait=0;finishPlace=0;player={lane:0,turn:0};initRivals();state='countdown';let count=3;overlay.classList.add('hidden');hud.classList.remove('hidden');pause.classList.remove('hidden');controlBox.classList.remove('hidden');last=performance.now();const timer=setInterval(()=>{count--;if(state!=='countdown'){clearInterval(timer);return}if(count<=0){state='race';clearInterval(timer)}},1000)}
function boost(){if(state==='race'&&boosts>0&&boostTime<=0){boosts--;boostTime=2.4;showToast('¡TURBO!');for(let i=0;i<12;i++)fx.push({x:W/2,y:H*.82,vx:rand(-80,80),vy:rand(-150,20),life:.6,c:'#ffad2c'})}}
function update(dt){clock=performance.now();if(state!=='race')return;elapsed+=dt;let steer=clamp((keys.right||keys.ArrowRight||keys.KeyD?1:0)-(keys.left||keys.ArrowLeft||keys.KeyA?1:0)+swipe,-1,1);player.turn+=(steer-player.turn)*Math.min(1,dt*9);if(steer&&speed>32){drift+=dt;if(drift>1.15){boosts=Math.min(3,boosts+1);drift=0;showToast('¡DERRAPE! + TURBO')}}else drift=Math.max(0,drift-dt*1.7);if(keys.Space||keys.ShiftLeft||keys.ShiftRight||keys.KeyX)boost();const max=boostTime>0?118:104;speed=Math.min(max,speed+(speed<max?36:0)*dt);player.lane=clamp(player.lane+steer*dt*1.0,-1.5,1.5);if(Math.abs(player.lane)>1.02)speed=Math.max(36,speed-46*dt);if(Math.abs(player.lane)>1.38)speed=Math.max(30,speed-70*dt);if(boostTime>0)boostTime-=dt;distance+=speed/3.6*dt;

function timeText(t){return`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`}

function pauseGame(){if(state==='race'){state='paused';title.textContent='PAUSA';subtitle.textContent='La carrera está en pausa';chips.innerHTML='<span class="chip">▶ Tocá continuar para seguir</span>';start.textContent='▶ CONTINUAR';help.textContent='';overlay.classList.remove('hidden');hud.classList.add('hidden');pause.classList.add('hidden');controlBox.classList.add('hidden')}else if(state==='paused'){state='race';overlay.classList.add('hidden');hud.classList.remove('hidden');pause.classList.remove('hidden');controlBox.classList.remove('hidden');last=performance.now()}}
start.addEventListener('click',()=>{if(state==='paused')pauseGame();else begin()});pause.addEventListener('click',pauseGame);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='race')pauseGame()});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Escape')pauseGame()},{passive:false});addEventListener('keyup',e=>keys[e.code]=false);

window.__vladiKart={get state(){return state},get metrics(){return{distance,speed,lap:Math.min(3,Math.floor(distance/lapLength)+1),place:rank(),boosts,elapsed,pickups:boxes.filter(x=>!x.used).length}},start:begin,boost,setSteer:v=>swipe=v};
})();
</script></body></html>
