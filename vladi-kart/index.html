<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#087fc4"><title>Vladi Kart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0786c7;font-family:system-ui,Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;z-index:2;inset:0 64px auto;display:flex;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 8px 0;pointer-events:none;color:#fff;text-shadow:0 2px #14273f}.badge{min-width:74px;padding:7px 12px;border:2px solid #122139;border-radius:13px;background:linear-gradient(#25496eec,#102644f2);box-shadow:0 3px #0a1727;text-align:center;font-weight:900;line-height:1}.badge small{display:block;font-size:11px;letter-spacing:.06em;color:#ffdf56}.badge b{display:block;font-size:clamp(17px,2.8vw,26px);white-space:nowrap}.pause{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 10px);width:46px;height:46px;border:3px solid #43220e;border-radius:14px;background:linear-gradient(#bd7437,#783713);color:white;font-size:22px;font-weight:1000;box-shadow:0 4px #331609}.hidden{display:none!important}.overlay{position:fixed;z-index:4;inset:0;display:grid;place-items:center;padding:14px;background:#061b37a3}.panel{width:min(600px,94vw);max-height:94dvh;overflow:auto;border:6px solid #713c18;border-radius:28px;background:linear-gradient(160deg,#fff6da,#ffe3a6 72%,#e7b45f);box-shadow:0 10px #3a1c0a,0 25px 60px #00193288;text-align:center;padding:clamp(16px,4vw,30px);color:#4a2815}.panel h1{margin:0;font-size:clamp(34px,7vw,64px);line-height:1;color:#3e2217;text-shadow:0 3px #e8b45d}.sub{font-size:clamp(14px,2.5vw,19px);font-weight:850;margin:8px 0 0}.hero{width:min(82%,420px);height:min(32vh,220px);object-fit:contain;display:block;margin:0 auto -8px;filter:drop-shadow(0 7px 5px #5d321e44)}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:13px 0;color:#533118;font-size:13px;font-weight:900}.chip{padding:6px 10px;border:2px solid #d59a47;border-radius:99px;background:#fff7dfbb}.start{border:5px solid #07551e;border-radius:18px;background:linear-gradient(#75ed45,#0aaa2a);color:#fff;padding:12px 28px;font-size:clamp(21px,4vw,29px);font-weight:1000;box-shadow:0 6px #064319}.help{margin:12px 0 0;color:#694727;font-size:13px;font-weight:800}.controls{position:fixed;z-index:3;inset:auto 0 calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:end;justify-content:space-between;padding:0 14px;pointer-events:none}.steer{display:flex;gap:9px}.pad,.turbo{width:64px;height:64px;border:3px solid #ffffffbb;border-radius:50%;background:linear-gradient(#294e70dd,#142d4ddd);box-shadow:0 4px #08172ccc;color:#fff;font-size:27px;font-weight:1000;pointer-events:auto;touch-action:none}.turbo{width:78px;height:78px;border-color:#ffe164;background:linear-gradient(#ffba25ed,#ea6617ed);font-size:12px}.turbo b{display:block;font-size:23px}.active{filter:brightness(1.35)}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.badge{min-width:58px;padding:6px 8px}.pause{width:42px;height:42px}.hero{height:min(25vh,170px)}.panel{max-height:88dvh;padding:15px}.chips{margin:9px 0}.help{margin-top:8px}}@media(orientation:portrait) and (max-width:800px){#hud{justify-content:flex-start;gap:5px;padding-right:56px}.badge{min-width:54px;padding:6px}.controls{padding-left:10px;padding-right:10px}.pad{width:58px;height:58px}.turbo{width:68px;height:68px}.hero{height:18vh}}
</style></head><body>
<canvas id="game" aria-label="Vladi Kart. Manejá con flechas o botones táctiles, derrapá y usá el turbo."></canvas>
<div id="hud" class="hidden"><div class="badge"><small>VUELTA</small><b id="lap">1/3</b></div><div class="badge"><small>PUESTO</small><b id="place">4/4</b></div><div class="badge"><small>TURBO</small><b id="charges">⚡ 1</b></div><div class="badge"><small>KM/H</small><b id="speed">0</b></div></div>
<button id="pause" class="pause hidden" aria-label="Pausar">Ⅱ</button>
<div class="controls hidden"><div class="steer"><button class="pad" id="left" aria-label="Girar a la izquierda">◀</button><button class="pad" id="right" aria-label="Girar a la derecha">▶</button></div><button class="turbo" id="turbo" aria-label="Usar turbo"><b>⚡</b>TURBO</button></div>
<div id="overlay" class="overlay"><section class="panel"><h1 id="title">VLADI KART</h1><p class="sub" id="subtitle">¡A correr en el kartódromo!</p><img class="hero" src="assets/vladi-kart.webp" alt="Vladi en su kart azul"><div id="chips" class="chips"><span class="chip">🏁 3 vueltas</span><span class="chip">↪ Derrapes y turbo</span><span class="chip">⚡ Cajas de energía</span></div><button id="start" class="start">▶ CORRER</button><p id="help" class="help">Flechas o A-D para manejar · Espacio o Shift para turbo</p></section></div>
<script src="game.js"></script></body></html>
