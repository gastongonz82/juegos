<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#087fc4">
<title>Vladi Kart — Esquiva obstáculos</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1484c2;font-family:system-ui,Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;z-index:2;inset:0 62px auto 0;display:flex;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 8px 0;pointer-events:none;color:white;text-shadow:0 2px #14273f}.badge{min-width:82px;padding:7px 12px;border:2px solid #122139;border-radius:13px;background:linear-gradient(#25496eec,#102644f2);box-shadow:0 3px #0a1727;text-align:center;font-weight:900;line-height:1}.badge small{display:block;font-size:11px;letter-spacing:.06em;color:#ffdf56}.badge b{display:block;font-size:clamp(17px,2.8vw,26px);white-space:nowrap}.pause{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 10px);width:46px;height:46px;border:3px solid #43220e;border-radius:14px;background:linear-gradient(#bd7437,#783713);color:#fff;font-size:22px;font-weight:1000;box-shadow:0 4px #331609}.hidden{display:none!important}.overlay{position:fixed;z-index:4;inset:0;display:grid;place-items:center;padding:14px;background:#061b37a3}.panel{width:min(510px,94vw);max-height:92dvh;overflow:auto;border:6px solid #713c18;border-radius:28px;background:linear-gradient(160deg,#fff6da,#ffe3a6 72%,#e7b45f);box-shadow:0 10px #3a1c0a,0 25px 60px #00193288;text-align:center;padding:clamp(16px,4vw,28px);color:#4a2815}.panel h1{margin:0;font-size:clamp(32px,7vw,58px);line-height:1;color:#3e2217;text-shadow:0 3px #e8b45d}.sub{font-size:clamp(14px,2.5vw,19px);font-weight:850;margin:8px 0 0}.hero{width:min(72%,340px);height:min(25vh,180px);object-fit:contain;display:block;margin:4px auto -4px;filter:drop-shadow(0 7px 5px #5d321e44)}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0;color:#533118;font-size:13px;font-weight:900}.chip{padding:6px 10px;border:2px solid #d59a47;border-radius:99px;background:#fff7dfbb}.start{border:5px solid #07551e;border-radius:18px;background:linear-gradient(#75ed45,#0aaa2a);color:#fff;padding:11px 28px;font-size:clamp(21px,4vw,28px);font-weight:1000;box-shadow:0 6px #064319}.help{margin:10px 0 0;color:#694727;font-size:13px;font-weight:800}.controls{position:fixed;z-index:3;inset:auto 0 calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:end;justify-content:space-between;padding:0 16px;pointer-events:none}.pad{width:70px;height:70px;border:3px solid #ffffffbb;border-radius:50%;background:linear-gradient(#294e70dd,#142d4ddd);box-shadow:0 4px #08172ccc;color:#fff;font-size:30px;font-weight:1000;pointer-events:auto;touch-action:none}.pad:active{filter:brightness(1.35);transform:translateY(2px)}@media(max-width:800px),(pointer:coarse){.controls{display:flex}.badge{min-width:66px;padding:6px 8px}.pause{width:42px;height:42px}.panel{max-height:88dvh;padding:15px}.hero{height:min(22vh,150px)}.chips{margin:8px 0}.help{margin-top:7px}}@media(orientation:portrait) and (max-width:800px){#hud{justify-content:flex-start;gap:5px;padding-right:4px}.badge{min-width:68px;padding:6px 5px}.controls{padding-left:14px;padding-right:14px}.pad{width:64px;height:64px}.hero{height:17vh}}@media(max-height:480px){.panel{max-height:84dvh;padding:10px 16px}.hero{display:none}.panel h1{font-size:34px}.chips{margin:6px 0}.help{margin-top:5px}.pad{width:56px;height:56px}}
#soundToggle{position:fixed;z-index:60;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:46px;height:46px;padding:0;display:grid;place-items:center;border:3px solid #4b220d;border-radius:14px;background:linear-gradient(#aa6435,#633214);box-shadow:0 4px #351809;color:#fff;font-size:19px;line-height:1;touch-action:manipulation;cursor:pointer}#soundToggle:active{transform:translateY(2px);box-shadow:0 2px #351809}@media(max-width:600px){#soundToggle{width:42px;height:42px;border-width:2px;border-radius:12px;font-size:17px}}</style>
</head>
<body><button id="soundToggle" data-sound-toggle type="button" aria-label="Silenciar sonidos">🔊</button>
<canvas id="game" aria-label="Vladi Kart. Esquivá obstáculos con las flechas, los botones o deslizando a izquierda y derecha."></canvas>
<div id="hud" class="hidden"><div class="badge"><small>METROS</small><b id="meters">0</b></div><div class="badge"><small>PUNTOS</small><b id="score">0</b></div><div class="badge"><small>RÉCORD</small><b id="best">0</b></div></div>
<button id="pause" class="pause hidden" aria-label="Pausar">Ⅱ</button>
<div class="controls hidden"><button class="pad" id="left" aria-label="Mover auto a la izquierda">◀</button><button class="pad" id="right" aria-label="Mover auto a la derecha">▶</button></div>
<div id="overlay" class="overlay"><section class="panel"><h1 id="title">VLADI KART</h1><p class="sub" id="subtitle">¡Esquivá los obstáculos y llegá lo más lejos posible!</p><img class="hero" src="assets/vladi-kart.webp" alt="Vladi en su kart azul"><div id="chips" class="chips"><span class="chip">🚧 Esquivá conos y karts</span><span class="chip">⭐ Juntá estrellas</span><span class="chip">🏆 Superá tu récord</span></div><button id="start" class="start">▶ JUGAR</button><p id="help" class="help">Usá ◀ ▶, las flechas o deslizá para cambiar de carril</p></section></div>
<script src="../game-audio.js?v=3"></script><script src="game.js?v=3"></script>
</body>
</html>
