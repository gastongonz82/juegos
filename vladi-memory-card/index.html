<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10162b">
  <meta name="description" content="Encontrá los pares de personajes en Memory Card con Vladi.">
  <title>Memory Card con Vladi — Arcade de Vladi</title>
  <link rel="stylesheet" href="../arcade-ui.css?v=1">
  <script src="../arcade-ui.js" defer></script>
  <script src="../game-audio.js?v=3" defer></script>
  <script src="../music/vladi-palabras.js?v=1" defer></script>
  <script src="../game-music.js?v=4" defer></script>
  <style>
    :root{color-scheme:dark;--line:#ffffff20;--text:#f8f7ff;--muted:#aab4cf;--gold:#ffd166;--cyan:#77e5dd;--green:#83edc0;--pink:#ff92b6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:#0b1020}body{margin:0;min-height:100svh;color:var(--text);background:radial-gradient(ellipse at 12% 0%,#47427c55,transparent 34rem),radial-gradient(ellipse at 92% 52%,#168e9650,transparent 31rem),linear-gradient(160deg,#10162b,#090e1b 74%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#dce7ff66 .7px,transparent .8px);background-size:32px 32px;mask-image:linear-gradient(#000,transparent 90%)}
    button,a{font:inherit}a{color:inherit}.shell{position:relative;width:min(1180px,calc(100% - 30px));margin:auto}.top{height:54px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:750}.back:hover{color:#fff}.sound-toggle{width:40px;height:36px;display:grid;place-items:center;margin-left:auto;border:1px solid #ffd16666;border-radius:12px;background:#ffffff0b;color:#ffe08a;font-size:18px;cursor:pointer;touch-action:manipulation}
    main{padding:13px 0 20px}.heading{text-align:center;margin:0 auto 11px}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.heading h1{margin:6px 0 4px;font-size:clamp(29px,5.5vw,42px);line-height:1;letter-spacing:-.04em;text-transform:uppercase}.heading h1 span{color:var(--gold)}.heading p{margin:0;color:var(--muted);font-size:12px}
    .game{padding:13px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(155deg,#1b2540ed,#121a2eee);box-shadow:0 20px 50px #0005,inset 0 1px #ffffff09}.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.stat{min-width:0;padding:7px 6px;border:1px solid #ffffff16;border-radius:13px;background:#ffffff07;text-align:center}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.stat b{display:block;margin-top:2px;color:#fff;font-size:19px}.stat.pairs b{color:var(--cyan)}.stat.best b{color:var(--gold);font-size:12px;line-height:1.5}.board{width:min(100%,650px);height:auto;aspect-ratio:1;margin:0 auto 9px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:9px}.memory-card{min-width:0;min-height:0;padding:0;border:0;border-radius:15px;background:transparent;perspective:700px;cursor:pointer;touch-action:manipulation}.memory-card:focus-visible,.reset:focus-visible,.back:focus-visible,.sound-toggle:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.memory-card:disabled{cursor:default}.card-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.75,.3,1)}.memory-card.open .card-inner,.memory-card.matched .card-inner{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;border:1px solid #ffffff1c;border-radius:15px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 1px #ffffff15,0 6px 14px #05091666}.card-back{background:radial-gradient(circle at 50% 20%,#77e5dd1f,transparent 52%),linear-gradient(145deg,#2b3d62,#192541);color:#ffe08a}.card-back:before{content:"";position:absolute;inset:7px;border:1px solid #ffd16635;border-radius:10px}.back-mark{z-index:1;width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffd16677;border-radius:12px;background:#ffd16613;color:var(--gold);font-size:22px;font-weight:1000;box-shadow:0 0 17px #ffd16622}.back-star{z-index:1;margin-top:-3px;font-size:11px;color:#9ceee2;letter-spacing:.25em}.card-front{transform:rotateY(180deg);border-color:#ffffff2a;background:radial-gradient(ellipse at 50% 28%,var(--tint),transparent 70%),linear-gradient(155deg,#263550,#172139);color:#fff}.memory-card.matched .card-front{border-color:#83edc077;box-shadow:0 0 20px #83edc025,inset 0 1px #ffffff20}.character-icon{font-size:clamp(25px,5.5vw,43px);line-height:1;filter:drop-shadow(0 5px 7px #0006)}.character-name{max-width:95%;overflow:hidden;color:#eaf1ff;font-size:clamp(7px,1.5vw,10px);font-weight:900;letter-spacing:.06em;text-overflow:ellipsis;white-space:nowrap}.message{min-height:21px;margin:0;text-align:center;color:#c3cde2;font-size:11px;font-weight:800}.message.good{color:var(--green)}.message.bad{color:#ffabc2}.reset{display:block;width:min(100%,650px);min-height:43px;margin:8px auto 0;border:0;border-radius:13px;background:linear-gradient(135deg,#ffe18c,#ffbd59);color:#241b27;font-size:13px;font-weight:950;box-shadow:0 7px 18px #eaa94430;cursor:pointer}.reset:hover{filter:brightness(1.07);transform:translateY(-1px)}.instructions{margin:8px 0 0;color:#8794b2;font-size:9px;text-align:center}
    @media(min-width:621px){.board{width:min(100%,780px);aspect-ratio:2/1;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.memory-card:nth-child(13){grid-column:2}.memory-card:nth-child(14){grid-column:3}.memory-card:nth-child(15){grid-column:4}.memory-card:nth-child(16){grid-column:5}}@media(max-width:620px){.shell{width:min(500px,calc(100% - 20px))}.top{height:48px}.back{font-size:12px}main{padding:8px 0 10px}.heading{margin-bottom:7px}.heading h1{font-size:clamp(25px,7.5vw,35px)}.heading p{font-size:10px}.game{padding:9px;border-radius:18px}.toolbar{gap:5px;margin-bottom:7px}.stat{padding:5px 3px;border-radius:10px}.stat span{font-size:7px}.stat b{font-size:17px}.stat.best b{font-size:10px}.board{width:min(100%,460px);height:auto;gap:6px;margin-bottom:6px}.memory-card,.card-face{border-radius:12px}.card-back:before{inset:5px;border-radius:8px}.back-mark{width:31px;height:31px;border-radius:10px;font-size:18px}.back-star{font-size:9px}.character-icon{font-size:clamp(25px,8vw,38px)}.character-name{font-size:clamp(7px,2vw,9px)}.message{font-size:10px;min-height:19px}.reset{min-height:39px;margin-top:5px;font-size:12px}.instructions{display:none}}
    @media(max-width:360px){.shell{width:calc(100% - 14px)}.game{padding:7px}.board{gap:5px}.toolbar{gap:4px}.stat b{font-size:15px}.card-face,.memory-card{border-radius:10px}.character-icon{font-size:25px}.character-name{font-size:7px}}
    @media(max-height:630px) and (min-width:621px){main{padding-top:6px}.heading{margin-bottom:5px}.game{padding:9px}.board{max-width:780px;aspect-ratio:2.4;gap:6px}.toolbar{margin-bottom:6px}.reset{min-height:38px;margin-top:5px}.instructions{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <link rel="stylesheet" href="../desafios-kids.css?v=20261008-2">
</head>
<body class="kids-memory">
  <header class="shell top"><a class="back" href="../">← VOLVER AL ARCADE</a><button class="sound-toggle" id="soundToggle" data-sound-toggle type="button" aria-label="Silenciar sonidos">🔊</button></header>
  <main class="shell">
    <header class="heading"><span class="eyebrow">Desafío de ingenio</span><h1>MEMORY <span>CARD</span></h1><p>Encontrá los 8 pares de personajes de Vladi.</p></header>
    <section class="game" aria-label="Juego Memory Card">
      <div class="toolbar" aria-label="Marcador">
        <div class="stat pairs"><span>PAREJAS</span><b id="pairs">0 / 8</b></div>
        <div class="stat"><span>INTENTOS</span><b id="moves">0</b></div>
        <div class="stat"><span>TIEMPO</span><b id="time">00:00</b></div>
        <div class="stat best"><span>RÉCORD</span><b id="best">—</b></div>
      </div>
      <div class="board" id="board" role="group" aria-label="16 tarjetas para encontrar 8 pares"></div>
      <p class="message" id="message" aria-live="polite">TOCÁ DOS TARJETAS Y ENCONTRÁ SU PAREJA.</p>
      <button class="reset" id="reset" type="button">MEZCLAR Y JUGAR OTRA VEZ&nbsp; ↻</button>
      <p class="instructions">Encontrá todas las parejas con la menor cantidad de intentos y en el menor tiempo.</p>
    </section>
  </main>
  <script>
  (() => {
    'use strict';
    const characters=[
      {id:'heroe',name:'SUPERHÉROE',icon:'🦸',tint:'#ffca6a28'},
      {id:'espacio',name:'ASTRONAUTA',icon:'👨‍🚀',tint:'#8aa9ff28'},
      {id:'futbol',name:'FUTBOLISTA',icon:'⚽',tint:'#83edc028'},
      {id:'kart',name:'PILOTO DE KART',icon:'🏎️',tint:'#ff927428'},
      {id:'taekwondo',name:'TAEKWONDISTA',icon:'🥋',tint:'#ffd16628'},
      {id:'ninja',name:'NINJA',icon:'🥷',tint:'#bb9bff28'},
      {id:'explorador',name:'EXPLORADOR',icon:'🧭',tint:'#77e5dd28'},
      {id:'mago',name:'MAGO',icon:'🪄',tint:'#ff92b628'}
    ];
    const $=id=>document.getElementById(id);
    const state={deck:[],first:null,locked:false,moves:0,pairs:0,seconds:0,timer:null,started:false,best:null};
    try{const stored=JSON.parse(localStorage.getItem('vladiMemoryBest')||'null');if(stored&&Number.isFinite(stored.seconds))state.best=stored}catch(_){}
    const formatTime=seconds=>String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    function mix(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
    function saveBest(){if(!state.best||state.seconds<state.best.seconds||(state.seconds===state.best.seconds&&state.moves<state.best.moves)){state.best={seconds:state.seconds,moves:state.moves};try{localStorage.setItem('vladiMemoryBest',JSON.stringify(state.best))}catch(_){}}}
    function updateStats(){
      $('pairs').textContent=state.pairs+' / 8';$('moves').textContent=state.moves;$('time').textContent=formatTime(state.seconds);
      $('best').textContent=state.best?formatTime(state.best.seconds)+' · '+state.best.moves+' INT.':'—';
    }
    function makeCard(item,index){
      const button=document.createElement('button');button.type='button';button.className='memory-card';button.dataset.id=item.id;button.setAttribute('aria-label','Carta '+(index+1)+', oculta');
      const inner=document.createElement('span');inner.className='card-inner';
      const back=document.createElement('span');back.className='card-face card-back';back.setAttribute('aria-hidden','true');back.innerHTML='<span class="back-mark">V</span><span class="back-star">✦ ✧</span>';
      const front=document.createElement('span');front.className='card-face card-front';front.style.setProperty('--tint',item.tint);front.setAttribute('aria-hidden','true');front.innerHTML='<span class="character-icon">'+item.icon+'</span><span class="character-name">'+item.name+'</span>';
      inner.append(back,front);button.append(inner);button.addEventListener('click',()=>flip(button,item,index));return button
    }
    function renderDeck(){const board=$('board');board.replaceChildren();state.deck.forEach((item,index)=>board.append(makeCard(item,index)))}
    function startClock(){if(state.started)return;state.started=true;state.timer=window.setInterval(()=>{state.seconds++;updateStats()},1000)}
    function flip(button,item,index){
      if(state.locked||button.classList.contains('open')||button.classList.contains('matched'))return;
      startClock();button.classList.add('open');button.setAttribute('aria-label',item.name+', carta '+(index+1));window.VladiSound?.play('move');
      if(!state.first){state.first={button,item,index};return}
      state.moves++;const first=state.first;
      if(first.item.id===item.id){
        first.button.classList.add('matched');button.classList.add('matched');first.button.disabled=true;button.disabled=true;state.pairs++;state.first=null;
        $('message').textContent=state.pairs===8?'¡ENCONTRASTE TODAS LAS PAREJAS!':'¡PAREJA ENCONTRADA!';$('message').className='message good';window.VladiSound?.play(state.pairs===8?'goal':'correct');
        if(state.pairs===8){window.clearInterval(state.timer);state.timer=null;saveBest();$('reset').textContent='¡GANASTE! JUGAR OTRA VEZ ↻'}
        updateStats();return
      }
      state.locked=true;$('message').textContent='NO SON IGUALES. ¡PROBÁ OTRA VEZ!';$('message').className='message bad';window.VladiSound?.play('wrong');
      window.setTimeout(()=>{first.button.classList.remove('open');button.classList.remove('open');first.button.setAttribute('aria-label','Carta '+(first.index+1)+', oculta');button.setAttribute('aria-label','Carta '+(index+1)+', oculta');state.first=null;state.locked=false;$('message').textContent='TOCÁ DOS TARJETAS Y ENCONTRÁ SU PAREJA.';$('message').className='message'},780)
    }
    function reset(playSound=true){
      window.clearInterval(state.timer);state.timer=null;state.deck=mix(characters.flatMap(item=>[item,item]));state.first=null;state.locked=false;state.moves=0;state.pairs=0;state.seconds=0;state.started=false;
      $('message').textContent='TOCÁ DOS TARJETAS Y ENCONTRÁ SU PAREJA.';$('message').className='message';$('reset').textContent='MEZCLAR Y JUGAR OTRA VEZ ↻';renderDeck();updateStats();if(playSound)window.VladiSound?.play('start')
    }
    $('reset').addEventListener('click',()=>reset(true));reset(false);
  })();
  </script>
</body>
</html>
