<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0c1325">
  <title>Vladi Bowling Arcade</title>
  <meta name="description" content="Una partida de bowling arcade con Vladi. Apuntá, lanzá y buscá el strike.">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f5f0;--gold:#ffd474;--orange:#ff9a52;--line:rgba(255,232,186,.28)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{min-height:100dvh;background:#0b1020;touch-action:none;user-select:none;-webkit-user-select:none}
    #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;z-index:3;inset:calc(env(safe-area-inset-top) + 10px) 12px auto;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
    .brand{display:flex;align-items:center;gap:9px;min-width:145px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,212,116,.7);border-radius:13px;background:linear-gradient(145deg,#513456,#1d2339);box-shadow:0 5px 18px #080a13aa;color:var(--gold);font-weight:1000;font-size:22px}.brand strong{font-size:12px;line-height:1.05;letter-spacing:.1em;text-transform:uppercase}.brand small{display:block;margin-top:4px;color:#c2c8d5;font-size:9px;letter-spacing:.14em;font-weight:800}
    .stats{display:flex;gap:7px;pointer-events:none}.stat{min-width:76px;padding:7px 10px;border:1px solid var(--line);border-radius:13px;background:#141b2ddd;box-shadow:0 5px 18px #080a13aa;text-align:center}.stat label{display:block;color:#eedcae;font-size:9px;font-weight:900;letter-spacing:.11em}.stat b{display:block;margin-top:1px;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
    .buttons{display:flex;gap:7px;pointer-events:auto}.icon{width:43px;height:43px;border:1px solid rgba(255,212,116,.48);border-radius:13px;background:linear-gradient(145deg,#34233a,#171d31);color:#fff4d7;font-size:20px;cursor:pointer;box-shadow:0 5px 18px #080a13aa}.icon:active{transform:translateY(1px)}.icon:focus-visible,.primary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    #frame-strip{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 65px);left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border:1px solid rgba(255,232,186,.15);border-radius:12px;background:#101729dd;box-shadow:0 7px 20px #080a1380}
    .frame{width:33px;height:34px;display:grid;place-content:center;gap:0;border-radius:7px;border:1px solid #ffffff16;background:#1b2438;text-align:center}.frame.current{border-color:#ffd474bb;background:#44333c}.frame small{color:#d6c99f;font-size:8px;font-weight:900}.frame b{font-size:12px;line-height:1.15}
    #hint{position:fixed;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);padding:10px 15px;border:1px solid #ffffff20;border-radius:999px;background:#111827dc;color:#f3e6c1;box-shadow:0 8px 26px #0006;text-align:center;font-size:12px;font-weight:750;letter-spacing:.015em;pointer-events:none}
    .overlay{position:fixed;z-index:4;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at center,rgba(8,12,22,.3),rgba(8,12,22,.78));backdrop-filter:blur(4px)}.overlay[hidden]{display:none}.card{width:min(440px,100%);padding:28px 24px;border:1px solid rgba(255,225,162,.42);border-radius:25px;background:linear-gradient(150deg,rgba(37,42,64,.97),rgba(17,23,39,.97));box-shadow:0 25px 80px #0009,inset 0 1px #ffffff20;text-align:center}.card .badge{color:var(--gold);font-size:10px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.card h1{margin:10px 0 7px;font-size:clamp(29px,8vw,43px);line-height:1;letter-spacing:-.055em}.card p{max-width:330px;margin:0 auto 21px;color:#c6cde0;font-size:14px;line-height:1.55}.hero-art{height:106px;display:flex;align-items:center;justify-content:center;gap:10px;margin:7px 0 8px}.mini-pin{width:29px;height:53px;position:relative;border-radius:44% 44% 35% 35%;background:linear-gradient(90deg,#d9dce2,#fff 43%,#c8d0dc);box-shadow:inset -5px -2px 0 #9da9b7,0 7px 14px #0006;transform:rotate(-9deg)}.mini-pin::before,.mini-pin::after{content:"";position:absolute;left:4px;right:5px;height:4px;border-radius:4px;background:#d94b43}.mini-pin::before{top:22px}.mini-pin::after{top:29px}.mini-ball{width:48px;height:48px;margin:0 4px 0 13px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffdb8d,#e26b3e 55%,#712e3e);box-shadow:inset -8px -8px 13px #461e31,0 9px 16px #0008;position:relative}.mini-ball::before{content:"";position:absolute;width:5px;height:5px;top:13px;left:19px;border-radius:50%;background:#321d30;box-shadow:-7px 7px 0 #321d30,7px 7px 0 #321d30}.primary{min-width:190px;padding:13px 20px;border:1px solid #ffe1a0;border-radius:14px;background:linear-gradient(110deg,#ffbf5d,#e47943);box-shadow:0 8px 20px #ff8a3d35;color:#23182a;font:inherit;font-weight:1000;letter-spacing:.06em;cursor:pointer}.secondary{display:block;margin:12px auto 0;border:0;background:none;color:#bbc5dc;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
    @media(max-width:680px){.hud{inset:calc(env(safe-area-inset-top) + 8px) 8px auto;gap:5px}.brand{min-width:0;gap:6px}.mark{width:36px;height:36px;font-size:18px;border-radius:11px}.brand strong{max-width:64px;font-size:8px;letter-spacing:.04em}.brand small{font-size:7px}.stats{gap:4px}.stat{min-width:47px;padding:6px 4px;border-radius:11px}.stat label{font-size:7px;letter-spacing:.07em}.stat b{font-size:15px}.buttons{gap:3px}.icon{width:32px;height:34px;border-radius:10px;font-size:16px}#frame-strip{top:calc(env(safe-area-inset-top) + 53px);gap:2px;padding:4px}.frame{width:27px;height:29px}.frame small{font-size:7px}.frame b{font-size:10px}#hint{bottom:calc(env(safe-area-inset-bottom) + 12px);font-size:11px;padding:9px 12px}}
    @media(max-width:370px){.hud{gap:3px}.brand{gap:4px}.brand strong{max-width:40px;font-size:7px;letter-spacing:0}.brand small{display:none}.mark{width:28px;height:28px}.stats{gap:3px}.stat{min-width:38px;padding-inline:2px}.stat label{font-size:6px}.stat b{font-size:14px}.buttons{gap:2px}.icon{width:25px;height:29px;font-size:14px}.frame{width:24px}}
    @media(orientation:landscape) and (max-height:520px){.hud{inset:calc(env(safe-area-inset-top) + 6px) 12px auto}.mark,.icon{width:34px;height:34px}.stat{padding:4px 8px}.stat b{font-size:15px}#frame-strip{top:calc(env(safe-area-inset-top) + 48px)}#hint{bottom:calc(env(safe-area-inset-bottom) + 7px);padding:7px 12px}}
    #shot-controls{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 62px);transform:translateX(-50%);display:flex;gap:14px;padding:10px 14px;width:min(440px,calc(100vw - 24px));border:1px solid #ffdc9c40;border-radius:14px;background:#111827ef;box-shadow:0 6px 18px #0006}#shot-controls[hidden]{display:none}#shot-controls label{flex:1;min-width:0;font-size:10px;color:#e7cd99;font-weight:800}#shot-controls output{float:right;color:#fff;font-size:10px}#shot-controls input{display:block;width:100%;margin:7px 0 0;accent-color:#f9ba67;height:22px;touch-action:pan-x} .frame{width:38px}.frame b{font-size:10px;white-space:nowrap}
    @media(max-width:680px){.frame{width:27px}.frame b{font-size:8px}#shot-controls{gap:9px;padding:7px 10px;bottom:calc(env(safe-area-inset-bottom) + 53px)}#shot-controls label,#shot-controls output{font-size:9px}}
    @media(max-width:370px){.frame{width:24px}.frame b{font-size:7px}}
    @media(orientation:landscape) and (max-height:520px){#shot-controls{left:10px;bottom:12px;transform:none;width:240px;gap:7px;padding:6px 8px}#shot-controls label,#shot-controls output{font-size:8px}#hint{left:auto;right:10px;transform:none;max-width:calc(100vw - 270px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
  <link rel="stylesheet" href="../arcade-ui.css?v=3caf1eaf">
  <script src="../arcade-ui.js" defer></script>
</head>
<body>
  <canvas id="game" tabindex="0" role="img" aria-label="Pista de bowling. Arrastrá la pelota hacia los pinos y soltá para lanzar. Con teclado: flechas para apuntar y espacio para lanzar."></canvas>
  <header class="hud" aria-label="Marcador">
    <div class="brand"><span class="mark">V</span><div><strong>Vladi Bowling</strong><small>ARCADE • 10 FRAMES</small></div></div>
    <div class="stats"><div class="stat"><label>FRAME</label><b id="frame-label">1 / 10</b></div><div class="stat"><label>PUNTOS</label><b id="score-label">0</b></div><div class="stat"><label>RÉCORD</label><b id="best-label">0</b></div></div>
    <div class="buttons"><button class="icon" id="sound" data-sound-toggle aria-label="Silenciar sonidos" title="Sonido">♫</button><button class="icon" id="pause" aria-label="Pausar" title="Pausa">Ⅱ</button><button class="icon" id="fullscreen" aria-label="Pantalla completa" title="Pantalla completa">⛶</button></div>
  </header>
  <div id="frame-strip" aria-label="Marcador por frames"></div>
  <div id="hint" aria-live="polite">Arrastrá la pelota hacia los pinos y soltá. Flechas para apuntar.</div>
  <div id="shot-controls" hidden aria-label="Preparar lanzamiento">
    <label>Posición <output id="position-value">Centro</output><input id="position" aria-label="Posición de lanzamiento" type="range" min="-40" max="40" step="1" value="0"></label>
    <label>Fuerza <output id="power-value">72%</output><input id="power" aria-label="Fuerza del lanzamiento" type="range" min="20" max="100" step="1" value="72"></label>
    <label>Efecto <output id="spin-value">Recto</output><input id="spin" aria-label="Efecto de la pelota" type="range" min="-100" max="100" step="5" value="0"></label>
  </div>
  <section class="overlay" id="overlay" aria-modal="true" role="dialog">
    <div class="card"><div class="badge" id="overlay-badge">La pista es tuya</div><div class="hero-art" aria-hidden="true"><span class="mini-pin"></span><span class="mini-pin" style="transform:rotate(5deg)"></span><span class="mini-pin" style="transform:rotate(12deg)"></span><span class="mini-ball"></span><span class="mini-pin" style="transform:rotate(-7deg)"></span><span class="mini-pin" style="transform:rotate(3deg)"></span></div><h1 id="overlay-title">¡A buscar el strike!</h1><p id="overlay-copy">Tocá la pista para apuntar y deslizá la pelota hacia adelante para lanzar. Ajustá posición, fuerza y efecto. Diez frames con reglas de bowling.</p><button class="primary" id="main-action">EMPEZAR PARTIDA</button><button class="secondary" id="back-link">Volver al arcade</button></div>
  </section>
  <script>window.VladiMusicSource='../music/vladi-bowling.ogg';</script>
  <script src="../game-music.js"></script>
  <script src="../game-audio.js"></script>
  <script src="./physics.js?v=1"></script>
  <script src="./game.js?v=5"></script>
</body>
</html>
