<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3552">
<title>Vladi Fruit Ninja Arcade</title>
<style>
:root{color-scheme:dark;--cream:#fff3d0;--brown:#42210f;--gold:#ffc83d}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#073b61;font-family:system-ui,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}body{position:fixed;inset:0;color:#fff}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;pointer-events:none}.pill{min-width:72px;padding:7px 12px;border:2px solid #693817;border-radius:16px;background:linear-gradient(180deg,#683d23,#321a13);box-shadow:0 4px 0 #23110b, inset 0 1px #ffdb8a55;text-align:center;text-shadow:0 2px 2px #0009}.pill small{display:block;color:#ffe185;font-size:10px;line-height:1.1;font-weight:900;letter-spacing:.09em}.pill b{font-size:20px;line-height:1.1;font-weight:1000}.pill:nth-child(3) b{font-size:15px;letter-spacing:-.08em}.pause{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:48px;height:48px;border:3px solid #693817;border-radius:15px;background:linear-gradient(#b5723b,#693719);box-shadow:0 4px #361a0d;color:#fff;font-size:22px;font-weight:1000;touch-action:manipulation}.panel{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:18px;background:#041b2f88;backdrop-filter:blur(5px)}.card{width:min(440px,94vw);max-height:91dvh;overflow:auto;border:6px solid #793c19;border-radius:30px;background:linear-gradient(155deg,#fff0c4,#ffc65a 85%);color:var(--brown);text-align:center;padding:clamp(20px,5vw,34px);box-shadow:0 9px 0 #35190d,0 20px 60px #03172c88}.eyebrow{margin:0 0 3px;color:#a14c15;font-size:12px;letter-spacing:.18em;font-weight:1000}.card h1{margin:0;font-size:clamp(31px,9vw,48px);line-height:.98;font-weight:1000;letter-spacing:-.045em;color:#51270f;text-shadow:0 2px #ffdf8a}.hero-art{height:clamp(150px,25vh,220px);display:flex;align-items:center;justify-content:center;margin:6px auto 0}.hero-art img{height:100%;width:auto;max-width:min(62vw,220px);object-fit:contain;filter:drop-shadow(0 9px 5px #64301166)}.card p{margin:10px 0 20px;font-size:16px;font-weight:800;line-height:1.4}.play{width:min(100%,330px);min-height:66px;border:5px solid #07551e;border-radius:24px;background:linear-gradient(#7bf34a,#16b72d);box-shadow:0 6px #073e18;color:white;font-size:clamp(22px,7vw,31px);font-weight:1000;touch-action:manipulation}.play:active{transform:translateY(3px)}.hint{font-size:13px!important;margin:14px 0 0!important;color:#60402a}.hidden{display:none!important}.best-line{margin:10px 0 0;color:#805016;font-weight:900;font-size:14px}
@media (max-width:390px){.hud{gap:5px}.pill{min-width:63px;padding:6px 9px}.pill b{font-size:18px}.pause{width:44px;height:44px}}
@media (orientation:landscape) and (max-height:560px){.panel{padding:8px}.card{width:min(650px,96vw);max-height:94dvh;padding:12px 22px;display:grid;grid-template-columns:170px 1fr;grid-template-rows:auto auto auto auto;column-gap:14px;align-items:center}.eyebrow,.card h1{grid-column:2;text-align:left}.hero-art{grid-column:1;grid-row:1/5;height:150px;margin:0}.hero-art img{height:100%;max-width:150px}.card p{grid-column:2;margin:5px 0;font-size:14px}.play{grid-column:2;min-height:52px;width:min(100%,300px);justify-self:start}.hint,.best-line{grid-column:2;text-align:left;margin-top:4px!important}.hud{left:48%;gap:5px}.pill{min-width:62px;padding:5px 8px}.pill b{font-size:17px}.pill small{font-size:9px}.pause{width:42px;height:42px}}
#soundToggle{position:fixed;z-index:60;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:46px;height:46px;padding:0;display:grid;place-items:center;border:3px solid #4b220d;border-radius:14px;background:linear-gradient(#aa6435,#633214);box-shadow:0 4px #351809;color:#fff;font-size:19px;line-height:1;touch-action:manipulation;cursor:pointer}#soundToggle:active{transform:translateY(2px);box-shadow:0 2px #351809}@media(max-width:600px){#soundToggle{width:42px;height:42px;border-width:2px;border-radius:12px;font-size:17px}}</style>
  <link rel="stylesheet" href="../arcade-ui.css?v=3caf1eaf">
  <script src="../arcade-ui.js" defer></script>
</head>
<body><button id="soundToggle" data-sound-toggle type="button" aria-label="Silenciar sonidos">🔊</button>
<canvas id="game" aria-label="Cortá frutas con el dedo y evitá las bombas"></canvas>
<div id="hud" class="hud hidden" aria-live="polite"><div class="pill"><small>PUNTOS</small><b id="score">0</b></div><div class="pill"><small>RÉCORD</small><b id="best">0</b></div><div class="pill"><small>VIDAS</small><b id="lives">♥ 15</b></div></div>
<button id="pause" class="pause hidden" aria-label="Pausar">Ⅱ</button>
<div id="panel" class="panel"><section class="card"><p class="eyebrow">ARCADE DE FRUTAS</p><h1 id="panelTitle">VLADI FRUIT NINJA</h1><div class="hero-art"><img src="vladi-ninja.png?v=2" alt="Vladi vestido de ninja"></div><p id="panelText">Deslizá el dedo para cortar la fruta. Sumá combos y esquivá las bombas.</p><button id="start" class="play">▶ JUGAR</button><p id="hint" class="hint">Cortá varias frutas de un solo movimiento para ganar más puntos.</p><p id="bestLine" class="best-line">Récord: <span id="menuBest">0</span></p></section></div>
<script src="../game-audio.js?v=3"></script>
<script src="../music/vladi-fruit-ninja.js?v=1"></script>
<script src="../game-music.js?v=4"></script><script src="game.js?v=8"></script>
</body>
</html>
