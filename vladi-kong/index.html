<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071747"><title>Vladi Kong</title><link rel="stylesheet" href="../arcade-ui.css"><link rel="stylesheet" href="style.css?v=compact3"></head><body>
<header class="hud"><div class="logo">VLADI <b>KONG</b></div><div class="stat"><small>PUNTOS</small><strong id="score">0</strong></div><div class="stat"><small>RÉCORD</small><strong id="best">0</strong></div><div class="stat"><small>VIDAS</small><strong id="lives">♥ ♥ ♥</strong></div><button id="pause" aria-label="Pausar">Ⅱ</button><button id="fullscreen" aria-label="Pantalla completa">⛶</button></header>
