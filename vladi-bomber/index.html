/* Premium responsive controls and layout */
.hud{top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right))}.stats{background:linear-gradient(135deg,#10357bea,#0b1d4bea);border:2px solid #7ddfff;border-radius:15px;box-shadow:inset 0 2px 0 #ffffff35,0 5px 18px #0006;color:#fff}.tool{background:linear-gradient(160deg,#3387e9,#092a74);border:2px solid #a5efff;box-shadow:inset 0 2px #ffffff45,0 4px 0 #092051}.dir{border:2px solid #9eeaff;border-radius:50%;background:radial-gradient(circle at 32% 23%,#64b9ff,#1856a5 67%,#10275c);box-shadow:inset 0 2px #ffffff66,0 4px 0 #091d45;font-size:22px}.bomb{border:3px solid #ffe9a5;border-radius:50%;background:radial-gradient(circle at 32% 24%,#ffe97e,#ff9d25 48%,#d84a26);box-shadow:inset 0 3px #ffffff7c,0 6px 0 #782a22;font-size:15px;text-shadow:0 2px 2px #7c271e}.dpad{gap:0;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,48px)}.controls{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom))}@media(min-width:850px) and (orientation:landscape){.controls{max-width:none;inset:auto 16px max(15px,env(safe-area-inset-bottom))}.dpad{opacity:.82}.bomb{opacity:.92}}@media(max-height:700px) and (orientation:portrait){.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,40px)}.bomb{width:76px;height:76px}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="stats" id="stats">NIVEL 1 · ❤❤❤ · 0000</div><div class="tools"><button class="tool" id="sound" aria-label="Sonido">🔊</button><button class="tool" id="pause" aria-label="Pausar">⏸</button></div></div><div class="controls"><div class="dpad"><button class="dir up" data-dir="0,-1" aria-label="Arriba">▲</button><button class="dir left" data-dir="-1,0" aria-label="Izquierda">◀</button><button class="dir right" data-dir="1,0" aria-label="Derecha">▶</button><button class="dir down" data-dir="0,1" aria-label="Abajo">▼</button></div><button class="bomb" id="bomb">💣<br>PONER</button></div><div class="overlay" id="overlay"><div class="panel"><h1 id="heading">VLADI BOMBER</h1><p id="message">Abrí camino con bombas, esquivá las explosiones y encontrá la salida. Las bombas también pueden lastimarte.<br><br>PC: flechas o WASD para moverte, espacio para poner bombas.</p><button class="primary" id="start">¡JUGAR!</button><br><a class="secondary" href="../arcade.html">← Volver al Arcade</a></div></div><script>
(()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),overlay=document.querySelector('#overlay'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),stats=document.querySelector('#stats');const W=13,H=11;let grid=[],player={x:1,y:1},enemies=[],bombs=[],fire=[],exit={x:11,y:9},level=1,lives=3,score=0,record=+(localStorage.getItem('vladiBomberRecord')||0),state='menu',muted=false,last=0,moveWait=0,enemyWait=0,held=null,tile=30,ox=0,oy=0,clock=0,ctxAudio;const rnd=(n)=>Math.floor(Math.random()*n),at=(x,y)=>grid[y]?.[x]??1;
function audio(freq=440,dur=.1,type='sine'){if(muted)return;try{ctxAudio??=new(window.AudioContext||window.webkitAudioContext)();if(ctxAudio.state==='suspended')ctxAudio.resume();const o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctxAudio.currentTime);g.gain.setValueAtTime(.12,ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+dur);o.connect(g).connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+dur)}catch(e){}}
function generate(){grid=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1||x%2===0&&y%2===0?1:0));const safe=new Set(['1,1','2,1','1,2','11,9','10,9','11,8']);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(grid[y][x]===0&&!safe.has(x+','+y)&&Math.random()<Math.min(.56,.34+level*.025))grid[y][x]=2;player={x:1,y:1};exit={x:11,y:9};grid[9][11]=0;grid[9][10]=0;grid[8][11]=0;enemies=[];let candidates=[];for(let y=3;y<H-1;y++)for(let x=3;x<W-1;x++)if(!at(x,y)&&Math.abs(x-1)+Math.abs(y-1)>6)candidates.push({x,y});for(let i=0;i<Math.min(2+Math.floor(level/2),7)&&candidates.length;i++){let j=rnd(candidates.length);enemies.push({...candidates.splice(j,1)[0],dir:rnd(4)})}bombs=[];fire=[];moveWait=0;enemyWait=0;updateStats()}
function updateStats(){stats.textContent='NIVEL '+level+' · '+'❤'.repeat(Math.max(0,lives))+' · '+String(score).padStart(4,'0')+' · RÉCORD '+record}
function modal(title,msg,button){heading.textContent=title;message.innerHTML=msg;document.querySelector('#start').textContent=button;overlay.classList.remove('hidden')}
function newGame(){level=1;lives=3;score=0;generate();state='playing';overlay.classList.add('hidden')}
function next(){score+=500;level++;if(level>12){state='win';record=Math.max(score,record);localStorage.setItem('vladiBomberRecord',record);modal('¡CAMPEÓN!','¡Superaste los 12 niveles! Puntaje: '+score,'JUGAR DE NUEVO');audio(780,.4);return}generate();state='transition';modal('¡NIVEL SUPERADO!','¡Excelente! Preparate para el nivel '+level+'.','CONTINUAR');audio(720,.24)}
function hurt(){if(state!=='playing')return;lives--;audio(180,.35,'sawtooth');if(lives<=0){state='over';record=Math.max(score,record);localStorage.setItem('vladiBomberRecord',record);updateStats();modal('FIN DEL JUEGO','Puntaje: '+score+' · Récord: '+record,'REINTENTAR')}else{player={x:1,y:1};bombs=[];fire=[];enemies=enemies.filter(e=>!(e.x===1&&e.y===1));updateStats()}}
function walk(dx,dy){if(state!=='playing')return;const x=player.x+dx,y=player.y+dy;if(at(x,y)!==0||bombs.some(b=>b.x===x&&b.y===y))return;player={x,y};audio(270,.025);if(enemies.some(e=>e.x===x&&e.y===y)||fire.some(f=>f.x===x&&f.y===y))hurt();else if(x===exit.x&&y===exit.y&&enemies.length===0)next()}
function plant(){if(state!=='playing'||bombs.some(b=>b.x===player.x&&b.y===player.y)||bombs.length>=2)return;bombs.push({x:player.x,y:player.y,t:1.9});audio(350,.08)}
function explode(b){audio(100,.3,'sawtooth');const cells=[{x:b.x,y:b.y}];for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]])for(let k=1;k<=2;k++){const x=b.x+dx*k,y=b.y+dy*k,v=at(x,y);if(v===1)break;cells.push({x,y});if(v===2){grid[y][x]=0;score+=20;break}}for(const c of cells){fire.push({...c,t:.52});const before=enemies.length;enemies=enemies.filter(e=>e.x!==c.x||e.y!==c.y);score+=(before-enemies.length)*100;if(player.x===c.x&&player.y===c.y)hurt();const chain=bombs.find(other=>other!==b&&other.x===c.x&&other.y===c.y);if(chain)chain.t=0}updateStats()}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const availableTop=Math.max(60,document.querySelector('.hud').getBoundingClientRect().bottom+4),availableBottom=Math.max(132,innerHeight-document.querySelector('.controls').getBoundingClientRect().top+5);const landscape=innerWidth>innerHeight*1.15;const side=landscape?Math.max(118,Math.min(185,innerWidth*.15)):8;tile=Math.floor(Math.min((innerWidth-(landscape?side*2:10))/W,(innerHeight-(landscape?availableTop+14:availableTop+availableBottom))/H,110));tile=Math.max(12,tile);ox=Math.round((innerWidth-W*tile)/2);oy=Math.round(availableTop+Math.max(0,(innerHeight-availableTop-(landscape?12:availableBottom)-H*tile)/2))}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){const sw=innerWidth,sh=innerHeight;const bg=ctx.createLinearGradient(0,0,sw,sh);bg.addColorStop(0,'#36a8e0');bg.addColorStop(.46,'#2763ac');bg.addColorStop(1,'#0d346d');rect(0,0,sw,sh,bg);ctx.fillStyle='#fff8';for(let i=0;i<7;i++){let xx=((i*211+30)%sw),yy=((i*109+60)%sh);ctx.beginPath();ctx.ellipse(xx,yy,58,18,0,0,7);ctx.fill()}ctx.fillStyle='#8bcfff17';for(let i=0;i<55;i++){let x=(i*173)%sw,y=(i*97)%sh;ctx.fillRect(x,y,2,2)}ctx.shadowColor='#051a38';ctx.shadowBlur=28;ctx.shadowOffsetY=12;round(ox-9,oy-9,W*tile+18,H*tile+18,16,'#597a9b');ctx.shadowBlur=0;ctx.shadowOffsetY=0;round(ox-5,oy-5,W*tile+10,H*tile+10,12,'#b5d7bd');ctx.strokeStyle='#e2f8d2';ctx.lineWidth=3;ctx.strokeRect(ox-3,oy-3,W*tile+6,H*tile+6);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=ox+x*tile,py=oy+y*tile,v=at(x,y);rect(px,py,tile,tile,(x+y)%2?'#51ad56':'#61bf60');ctx.fillStyle='#ffffff12';ctx.fillRect(px+2,py+2,tile-4,2);if(v===0&&((x*17+y*29)%7===0)){ctx.fillStyle='#fef3b2';for(let q=0;q<5;q++){let a=q*Math.PI*2/5;ctx.beginPath();ctx.arc(px+tile*.32+Math.cos(a)*tile*.065,py+tile*.68+Math.sin(a)*tile*.065,Math.max(1,tile*.032),0,7);ctx.fill()}ctx.fillStyle='#ffc15d';ctx.beginPath();ctx.arc(px+tile*.32,py+tile*.68,tile*.038,0,7);ctx.fill()}if(v===0&&((x*11+y*7)%9===0)){ctx.fillStyle='#2f9150';ctx.beginPath();ctx.ellipse(px+tile*.8,py+tile*.23,tile*.11,tile*.055,-.7,0,7);ctx.ellipse(px+tile*.7,py+tile*.27,tile*.1,tile*.05,.7,0,7);ctx.fill()}if(v===1){round(px+2,py+tile*.13,tile-4,tile*.81,Math.max(2,tile*.13),'#46547c');round(px+2,py+1,tile-4,tile*.78,Math.max(2,tile*.13),'#b6c1d8');round(px+4,py+3,tile-8,tile*.22,3,'#e6ebf4');ctx.fillStyle='#536987';ctx.fillRect(px+tile*.08,py+tile*.73,tile*.84,tile*.08);ctx.strokeStyle='#7e8baa';ctx.lineWidth=Math.max(1,tile*.025);ctx.beginPath();ctx.moveTo(px+tile*.5,py+tile*.36);ctx.lineTo(px+tile*.4,py+tile*.53);ctx.lineTo(px+tile*.59,py+tile*.64);ctx.stroke()}else if(v===2){round(px+2,py+tile*.12,tile-4,tile*.82,4,'#78472c');round(px+2,py+2,tile-4,tile*.76,4,'#d58b45');round(px+5,py+4,tile-10,tile*.16,3,'#f5ba6a');ctx.strokeStyle='#8e4f2e';ctx.lineWidth=Math.max(2,tile*.075);ctx.beginPath();ctx.moveTo(px+tile*.19,py+tile*.19);ctx.lineTo(px+tile*.81,py+tile*.74);ctx.moveTo(px+tile*.81,py+tile*.19);ctx.lineTo(px+tile*.19,py+tile*.74);ctx.stroke();ctx.fillStyle='#fbe2a3';for(const xx of [.15,.85])for(const yy of [.16,.77]){ctx.beginPath();ctx.arc(px+tile*xx,py+tile*yy,Math.max(1,tile*.032),0,7);ctx.fill()}}}if(enemies.length===0){const x=ox+exit.x*tile,y=oy+exit.y*tile;round(x+tile*.13,y+tile*.12,tile*.74,tile*.76,4,'#f8d25e');round(x+tile*.25,y+tile*.22,tile*.5,tile*.56,3,'#33bbd2');ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(tile*.4)+'px system-ui';ctx.textAlign='center';ctx.fillText('★',x+tile/2,y+tile*.67)}for(const b of bombs){let x=ox+(b.x+.5)*tile,y=oy+(b.y+.5)*tile;ctx.shadowColor='#05111e';ctx.shadowBlur=tile*.2;const bombGrad=ctx.createRadialGradient(x-tile*.13,y-tile*.14,1,x,y,tile*.37);bombGrad.addColorStop(0,'#78869e');bombGrad.addColorStop(.32,'#263954');bombGrad.addColorStop(1,'#070d1c');ctx.fillStyle=bombGrad;ctx.beginPath();ctx.arc(x,y,tile*.32,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#9de9ff';ctx.beginPath();ctx.arc(x-tile*.09,y-tile*.11,tile*.09,0,7);ctx.fill();rect(x+tile*.1,y-tile*.42,tile*.08,tile*.18,'#f4d476')}for(const f of fire){let x=ox+(f.x+.5)*tile,y=oy+(f.y+.5)*tile;ctx.shadowColor='#ff9c21';ctx.shadowBlur=tile*.45;ctx.fillStyle=f.t>.25?'#ff9b19':'#f65d43';ctx.beginPath();ctx.arc(x,y,tile*.48,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff2aa';ctx.beginPath();ctx.arc(x,y,tile*.23,0,7);ctx.fill();ctx.strokeStyle='#ff5e19';ctx.lineWidth=Math.max(2,tile*.07);for(let k=0;k<8;k++){let a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*tile*.28,y+Math.sin(a)*tile*.28);ctx.lineTo(x+Math.cos(a)*tile*.49,y+Math.sin(a)*tile*.49);ctx.stroke()}}for(const e of enemies){let x=ox+(e.x+.5)*tile,y=oy+(e.y+.5)*tile;ctx.fillStyle='#811d55';ctx.beginPath();ctx.ellipse(x,y+tile*.23,tile*.3,tile*.12,0,0,7);ctx.fill();const ec=ctx.createRadialGradient(x-tile*.13,y-tile*.18,1,x,y,tile*.44);ec.addColorStop(0,'#ff9cca');ec.addColorStop(.5,'#e74793');ec.addColorStop(1,'#922468');ctx.fillStyle=ec;ctx.beginPath();ctx.arc(x,y,tile*.35,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-tile*.11,y,tile*.085,0,7);ctx.arc(x+tile*.11,y,tile*.085,0,7);ctx.fill();ctx.fillStyle='#25113e';ctx.beginPath();ctx.arc(x-tile*.09,y,tile*.043,0,7);ctx.arc(x+tile*.13,y,tile*.043,0,7);ctx.fill();ctx.strokeStyle='#69245a';ctx.lineWidth=Math.max(2,tile*.045);ctx.beginPath();ctx.moveTo(x-tile*.22,y-tile*.13);ctx.lineTo(x-tile*.04,y-tile*.08);ctx.moveTo(x+tile*.22,y-tile*.13);ctx.lineTo(x+tile*.04,y-tile*.08);ctx.stroke()}let x=ox+(player.x+.5)*tile,y=oy+(player.y+.5)*tile;ctx.fillStyle='#142e57';ctx.beginPath();ctx.ellipse(x,y+tile*.29,tile*.36,tile*.14,0,0,7);ctx.fill();round(x-tile*.25,y+tile*.12,tile*.5,tile*.29,tile*.12,'#1459be');ctx.fillStyle='#ffce9c';ctx.beginPath();ctx.arc(x,y-tile*.01,tile*.27,0,7);ctx.fill();round(x-tile*.32,y-tile*.36,tile*.64,tile*.25,Math.max(3,tile*.08),'#0767d9');round(x-tile*.3,y-tile*.32,tile*.6,tile*.08,3,'#8edfff');round(x-tile*.32,y-tile*.17,tile*.64,tile*.095,3,'#48bafc');ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(tile*.21)+'px system-ui';ctx.textAlign='center';ctx.fillText('V',x,y-tile*.18);ctx.fillStyle='#202843';ctx.beginPath();ctx.arc(x-tile*.1,y,tile*.04,0,7);ctx.arc(x+tile*.1,y,tile*.04,0,7);ctx.fill();if(state==='playing'&&enemies.length) {ctx.fillStyle='#f8ffff';ctx.shadowColor='#12224b';ctx.shadowBlur=5;ctx.font='bold '+Math.max(10,Math.min(15,tile*.3))+'px system-ui';ctx.textAlign='center';ctx.fillText('Eliminá los enemigos para abrir la salida',sw/2,Math.max(65,oy-12));ctx.shadowBlur=0}}
function update(dt){if(state!=='playing')return;clock+=dt;moveWait-=dt;enemyWait-=dt;if(held&&moveWait<=0){walk(...held);moveWait=.135}for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.t-=dt;if(b.t<=0){bombs.splice(i,1);explode(b);if(state!=='playing')return}}for(let i=fire.length-1;i>=0;i--){fire[i].t-=dt;if(fire[i].t<=0)fire.splice(i,1)}if(enemyWait<=0){enemyWait=Math.max(.24,.7-level*.032);for(const e of enemies){let dirs=[[0,1],[0,-1],[1,0],[-1,0]].sort(()=>Math.random()-.5);for(const [dx,dy] of dirs){let nx=e.x+dx,ny=e.y+dy;if(at(nx,ny)===0&&!bombs.some(b=>b.x===nx&&b.y===ny)&&!enemies.some(other=>other!==e&&other.x===nx&&other.y===ny)){e.x=nx;e.y=ny;break}}if(e.x===player.x&&e.y===player.y){hurt();break}}}}
function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(frame)}function setHeld(dx,dy){held=[dx,dy];moveWait=0}const keymap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();if(!e.repeat)setHeld(...keymap[e.key])}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)plant()}else if(e.key==='Escape'||e.key.toLowerCase()==='p')togglePause()});addEventListener('keyup',e=>{if(keymap[e.key]){e.preventDefault();held=null}});addEventListener('blur',()=>{held=null;if(state==='playing')togglePause()});for(const btn of document.querySelectorAll('[data-dir]')){const dir=btn.dataset.dir.split(',').map(Number);btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);setHeld(...dir)});for(const event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>{held=null})}document.querySelector('#bomb').addEventListener('pointerdown',e=>{e.preventDefault();plant()});function togglePause(){if(state==='playing'){state='paused';held=null;modal('PAUSA','La partida está detenida.','CONTINUAR')}else if(state==='paused'){state='playing';overlay.classList.add('hidden')}}document.querySelector('#pause').onclick=togglePause;document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'🔇':'🔊'};document.querySelector('#start').onclick=()=>{if(state==='paused'||state==='transition'){state='playing';overlay.classList.add('hidden')}else newGame()};addEventListener('resize',resize);generate();resize();requestAnimationFrame(frame)})();
